function award(id,v,key){const t=S.teams[id];if(!t||!v)return;t.cash+=v;if(id===S.me)addFin(key||'premio',v)}
/* prêmio contabilizado por competição (para mostrar o total ganho em cada uma) */
function awardC(c,id,v){award(id,v);if(id===S.me&&v)c.earn=(c.earn||0)+v}
function koPrizes(c,rd){const pr=przOf(c);if(!pr||!pr.adv)return;const i=c.st.rounds.indexOf(rd);const v=(pr.adv[i]||0)*(c.kind==='est'?estK(c):1);rd.ties.forEach(t=>{if(t.w&&!t.bye){awardC(c,t.w,v);if(t.w===S.me&&v)news(`💰 ${c.s}: classificado em ${rd.n.toLowerCase()} — bônus de ${money(v)}.`)}})}
function onStage(c){
  if(c.fin&&!c.champ){const s0=c.done[c.done.length-1];if(s0&&s0.t==='rr'&&s0.groups.length===1){c.champ=groupTable(s0.groups[0])[0].id;onChampion(c)}return}
  if(c.st&&c.st.t==='ko'){const pr=przOf(c);if(pr&&pr.q)c.st.pool.forEach(id=>awardC(c,id,pr.q*(c.kind==='est'?estK(c):1)));
    if(c.st.pool.includes(S.me))news(`${c.s}: você se classificou para a ${c.st.rounds[0].n.toLowerCase()}.`);
    else if(compTeams(c).includes(S.me)&&c.done.length===1)news(`${c.s}: eliminado na primeira fase.`)}
}
function onChampion(c){
  const pr=przOf(c);const cv=pr&&pr.champ?pr.champ*(c.kind==='est'?estK(c):1):0;if(cv)awardC(c,c.champ,cv);
  const mine=c.champ===S.me;
  if(mine){const lp=LEAGUE_PRIZE[c.id]||(c.kind==='ext'?LEAGUE_PRIZE.X:null);const sc=compScorers(c);const myTop=sc.find(x=>P(x[0])&&P(x[0]).t===S.me);
    (UI.champQ=UI.champQ||[]).push({n:c.n,s:c.s,season:S.season,title:cv,earn:c.earn||0,league:lp?lp[0]+lp[1]:0,top:sc[0]||null,mine:myTop&&myTop!==sc[0]?myTop:null,games:(S.my||[]).filter(r=>r.c===c.id).length,rec:(()=>{const r=(S.my||[]).filter(x=>x.c===c.id);let v=0,e=0,d=0;r.forEach(x=>{const f=x.h===S.me?x.gh:x.ga,a=x.h===S.me?x.ga:x.gh;if(f>a)v++;else if(f<a)d++;else e++});return [v,e,d]})()})}
  if(mine){S.titles.push({season:S.season,c:c.id,n:c.n,club:S.me});S.sat=clamp(S.sat+({est:4,reg:5,copa:15,cont:22,liga:18,ext:18})[c.kind],0,100);T(S.me).mood=clamp(T(S.me).mood+15,5,100);news(`🏆 ${T(S.me).name} é campeão: ${c.n} ${S.season}!`)}
  else if(['A','CB','LIB','SUD'].includes(c.id)||inComp(c,S.me))news(`${c.n}: ${T(c.champ).name} é o campeão.`);
}

/* ==================== GESTÃO DO CLUBE ==================== */
function initMgmt(t){
  t.lvl=t.lvl??(t.rep>=85?4:t.rep>=70?3:t.rep>=45?2:1);t.price=t.price??(30+t.lvl*12);
  t.socios=t.socios??Math.round(t.rep*t.rep*8);t.shop=t.shop??0;t.box=t.box??0;
  t.proj=t.proj||[];t.camp=t.camp||[];t.mood=t.mood??60;t.coach=t.coach||'Interino';
}
const refPrice=t=>30+t.lvl*12;
const building=(t,k)=>t.proj.some(p=>p.k===k);
const hasCamp=(t,k)=>t.camp.some(c=>c.k===k);
const capNow=t=>Math.round(t.cap*(building(t,'arq')?.85:1));
/* momento do time (0 a 1): humor da torcida, últimos 5 jogos e posição na liga */
function perfOf(t,pos){
  const last=t.last||[];
  const form=last.length?last.reduce((s,r)=>s+(r==='V'?3:r==='E'?1:0),0)/(3*last.length):.5;
  const ri_=rankInfo(t.id);const ps=ri_.n>1?1-(clamp(pos||ri_.pos,1,ri_.n)-1)/(ri_.n-1):.5;
  const w=last.length>=3?1:last.length/3;
  return clamp(.45*t.mood/100+w*(.35*form+.2*ps)+(1-w)*.275,0,1);
}
const perfTxt=p=>p>=.7?'em grande fase':p>=.55?'em boa fase':p>=.4?'em fase regular':p>=.25?'em fase ruim':'em crise';
/* público: o desempenho define a procura; o preço pesa mais quando o time vai mal */
function attendance(t,price,pos,opp,imp){
  const pf=perfOf(t,pos);
  let demand=(.06+.28*t.rep/100+.66*pf+.03*t.lvl)*(imp||1);
  if(opp&&S.teams[opp])demand+=Math.max(0,(T(opp).rep-75)/100)*.5;
  const el=price>refPrice(t)?1.05+1.2*(1-pf):.3+1.3*(1-pf);
  const pr=clamp(Math.pow(refPrice(t)/price,el),.15,1.6);
  return Math.round(Math.min(capNow(t),capNow(t)*clamp(demand*pr,.05,1.2)));
}
/* fatores por divisão: TV e custos fixos variam muito entre Série A e distrital */
const DTV={A:1,B:.35,C:.12,D:.05,E:.03,X:.45},DOP={A:1,B:.6,C:.4,D:.3,E:.25,X:.7};
function econ(t){
  const e={},dv=t.div;
  e.tv=(.4+2.2*Math.pow(t.rep/100,2))*MO*DTV[dv];
  e.pat=(.1+1.1*Math.pow(t.rep/100,2))*MO*DOP[dv]*(hasCamp(t,'pub')?1.3:1);
  e.pub=t.gpub;e.jogos=t.ghome;e.tk=t.gm;e.box=t.gbox;
  e.soc=t.socios*10/1e6*MO;
  e.loja=t.rep*.012*(1+.15*t.shop)*clamp(t.mood/60,.5,1.4)*(hasCamp(t,'kit')?1.5:1)*MO*DOP[dv];
  e.sal=(SQ.get(t.id)||[]).reduce((s,p)=>s+wage(p),0)*(dv==='E'?.6:1);
  e.man=(.04*t.lvl+capNow(t)/1e6*.5)*MO*DOP[dv];
  /* custo fixo + 12% da receita (impostos, base, departamentos) */
  e.op=(.2+.6*t.rep/100)*MO*DOP[dv]+.32*(e.tv+e.pat+e.tk+e.box+e.soc+e.loja);
  e.jur=(t.cash<0?-t.cash*.018:0)+(t.loan||0)*.03;
  e.rec=e.tv+e.pat+e.tk+e.box+e.soc+e.loja;e.desp=e.sal+e.man+e.op+e.jur;e.net=e.rec-e.desp;
  return e;
}
const PROJ={
  arq:{n:'Ampliar arquibancada',d:'+5.000 lugares. Durante a obra o estádio opera com 85% da capacidade.',cost:t=>8+t.cap/8000,rounds:14,ok:t=>t.cap<80000,apply:t=>{t.cap+=5000}},
  mod:{n:'Modernizar o estádio',d:'+1 nível de estrutura: torcida aceita ingresso mais caro e comparece mais.',cost:t=>7*t.lvl,rounds:18,ok:t=>t.lvl<5,apply:t=>{t.lvl++}},
  box:{n:'Construir camarotes',d:'+R$ 350 mil de receita por jogo em casa (até 3).',cost:()=>5,rounds:10,ok:t=>t.box<3,apply:t=>{t.box++}},
  shop:{n:'Abrir lojas oficiais',d:'+15% nas vendas de camisas e suvenires (até 3).',cost:()=>3,rounds:6,ok:t=>t.shop<3,apply:t=>{t.shop++}}
};
const CAMP={
  kit:{n:'Lançar nova camisa',d:'Vendas da loja +50% por cerca de 3 meses.',cost:()=>1.5,rounds:24},
  soc:{n:'Campanha de sócio-torcedor',d:'Sócios crescem 1,5% a cada data por cerca de 6 semanas.',cost:()=>1,rounds:12},
  pub:{n:'Campanha publicitária',d:'Patrocínio +30% e torcida mais animada por cerca de 2 meses.',cost:()=>2,rounds:18}

const wk=n=>`~${Math.max(1,Math.round(n/2))} semana${Math.round(n/2)>1?'s':''}`;
function addFin(k,v){S.finS[k]=(S.finS[k]||0)+v}
function monthTick(){
  Object.values(S.teams).forEach(t=>{
    const e=econ(t);t.cash+=e.net;if(t.cash<0)t.mood=clamp(t.mood-4,5,100);
    /* clubes da IA reinvestem o excesso de caixa (estrutura, base, dívidas antigas) */
    if(t.id!==S.me){const cap=30+t.rep*.8;if(t.cash>cap)t.cash-=(t.cash-cap)*.12}
    if(t.mood>65)t.socios*=1.025;else if(t.mood<35)t.socios*=.98;
    t.socios=Math.round(t.socios);
    if(t.id===S.me){S.fin={...e,mes:S.mon};['tv','pat','tk','box','soc','loja','sal','man','op','jur'].forEach(k=>addFin(k,e[k]))}
    t.gm=t.gbox=t.gpub=t.ghome=0;
  });

}
function startProj(k){
  const t=T(S.me),d=PROJ[k],c=d.cost(t);
  if(!d.ok(t))return toast('Limite máximo já atingido.');

/* ==================== EVOLUÇÃO (mensal) ==================== */
function devTick(){
  const ups=[],downs=[];
  S.players.forEach(p=>{
    if(p.t===null)return;
    const mp=Math.max(1,S.teams[p.t]?S.teams[p.t].mp:1);
    const share=clamp(p.j/mp,0,1);let d=0;
    /* share = jogos em que entrou / jogos do time: entrar em campo conta igual, seja 1 minuto ou 90 */
    const star=isStar(p);
    if(p.a<=25){if(p.o<p.pot&&R()<.22+.42*share){d=1;if(share>.35&&R()<.4)d=2}}
    else if(p.a<=26){if(p.o<p.pot&&R()<.1+.2*share)d=1}
    else if(star&&p.a<=32){if(p.o<Math.max(p.pot,p.o0+3)&&R()<.06+.14*share)d=1}
    else if(star&&p.a<=34){if(share<.1&&R()<.03)d=-1}
    else if(p.a<=29){if(p.o<p.pot&&R()<.055+.11*share)d=1;else if(R()<.022+(share<.15?.045:0))d=-1}
    else if(p.a<=32){if(R()<.09)d=-1}
    else{if(R()<.18)d=p.a>=35&&R()<.25?-2:-1}
    if(p.inj>=6&&d>0)d=0;
    if(d){p.o=clamp(p.o+d,38,95);if(p.o>p.pot)p.pot=p.o;if(p.t===S.me)(d>0?ups:downs).push(`${p.n} ${d>0?'+':''}${d}`)}
    if(p.t===S.me||d){p.h.push(p.o);if(p.h.length>12)p.h.shift()}
  });
  if(ups.length||downs.length)news(`Relatório de evolução do mês: ${ups.length?'subiram '+ups.join(', '):''}${ups.length&&downs.length?'; ':''}${downs.length?'caíram '+downs.join(', '):''}.`);
}

/* ==================== DIRETORIA, TORCIDA E TÉCNICOS ==================== */
function targetPos(id){
  id=id||S.me;const t=T(id);const st=leagueStage(S.comps[t.main]);if(!st)return null;
  const g=st.groups.find(g=>g.tb[id]);if(!g)return null;
  const pool=S.comps[t.main].kind==='est'?st.groups.flatMap(x=>x.ids):g.ids;const n=pool.length;
  const idx=pool.slice().sort((a,b)=>T(b).rep-T(a).rep).indexOf(id);
  return clamp(Math.round(idx*.8)+(n>=16?3:1),1,Math.max(1,n-2));
}
function targetTxt(){const tg=targetPos();const c=S.comps[T(S.me).main];return tg==null||!c?'fazer boa campanha':`terminar até o ${tg}º lugar ${c.kind==='est'?'no':'na'} ${c.s}${c.id==='D'?' (no grupo)':''}`}
function boardTick(gf,ga,op,c){
  const me=T(S.me),strong=teamAvg(op)-teamAvg(S.me);let d=0;
  if(gf>ga)d=strong>2?4:2;else if(gf===ga)d=strong>2?1:strong<-2?-1:0;else d=strong>2?-1:strong<-3?-4:-2;
  d*=c.kind==='est'?.4:c.kind==='liga'||c.kind==='ext'?.6:.5;if(d>0&&S.sat>75)d*=.5;
  if(c.id===me.main){const ri_=rankInfo(S.me);if(ri_.row&&ri_.row.J>=5){const pos=ri_.pos,tg=targetPos();if(tg){if(pos<=tg)d+=.4;else if(pos>tg+5)d-=1.6;else if(pos>tg+2)d-=.8}}}
  if(me.cash<0)d-=.6;if(me.cash<-30)d-=1;
  if(me.mood<30)d-=.6;
  const before=S.sat;S.sat=clamp(S.sat+d,0,100);
  if(before>=35&&S.sat<35)news('A diretoria está insatisfeita e cobra reação imediata.');
  if(before>=20&&S.sat<20)news('Ultimato: mais um tropeço e o técnico pode cair.');
}
function checkFired(){if(S.fired||S.sat>12)return;if(S.my.length>=5||(S.d===0&&S.hist.length))fire()}
function fire(){
  const old=S.me;const repOld=T(old).rep;
  const cands=shuffle(Object.values(S.teams).filter(t=>t.id!==old&&t.rep<=repOld&&t.rep>=repOld-25)).slice(0,3).map(t=>t.id);

}

function aiCoaches(){

  const leaving=[];
  S.players.forEach(p=>{if(p.t===null)return;p.ct=(p.ct||1)-1;if(p.ct>0)return;
    if(p.t===S.me)leaving.push(p);else if(topIds(p.t).includes(p.id)||R()<.75){p.ct=ri(1,3);p.w=baseWage(p)}else{sqMove(p,null)}});
  leaving.forEach(p=>{news(`${p.n} deixa o clube de graça: contrato encerrado.`);transfer(p,null,0)});
  S.players.filter(p=>p.t===null).forEach(p=>{p.ct=0});
}

/* ==================== MERCADO ==================== */
function topIds(tid){return squad(tid).sort((a,b)=>b.o-a.o).slice(0,13).map(p=>p.id)}
function ask(p){if(p.t===null)return value(p)*.15;return value(p)*(topIds(p.t).includes(p.id)?1.35:1.05)}
function transfer(p,to,amt){
  const from=p.t;
  if(from)T(from).cash+=amt;
  if(to)T(to).cash-=amt;
  if(from===S.me&&amt)addFin('vendas',amt);if(to===S.me&&amt)addFin('compras',amt);
  sqMove(p,to);p.sale=false;clearXC();
  if(from===S.me){const i=S.lineup.xi.indexOf(p.id);if(i>=0)S.lineup.xi[i]=null}
  S.inbox=S.inbox.filter(o=>o.pid!==p.id);S.auctions=S.auctions.filter(a=>a.pid!==p.id);
}
function tryBuy(pid,mult){
  const p=P(pid);const me=T(S.me);const a=ask(p)*mult;
  if(sqLen(S.me)>=34)return toast('Elenco cheio (34). Dispense alguém antes.');
  if(p.t===null){if(S.triedC[pid]===S.d)return toast('Ele recusou nesta data. Tente na próxima.');if(me.cash<a)return toast(`Sem caixa: faltam ${money(a-me.cash)}.`);openNeg(pid,'free');return}
  if(!inWindow())return toast('Janela fechada. '+windowText());
  if(me.cash<a)return toast(`Sem caixa: faltam ${money(a-me.cash)}.`);
  if(S.tried[pid]===S.d)return toast('O clube já respondeu nesta data.');
  S.tried[pid]=S.d;
  if(sqLen(p.t)<=18){toast(`${T(p.t).name} não libera: elenco curto.`);openPlayer(pid);return}
  const prob=clamp((mult-.8)/.4,0,1);
  if(R()<prob){toast(`${T(p.t).name} aceitou. Agora negocie o salário.`);openNeg(pid,'buy',a)}
  else{toast(`${T(p.t).name} recusou ${money(a)}.`);openPlayer(pid)}
}
/* compradores plausíveis: clubes onde o jogador seria útil e que têm caixa */
function buyersFor(p,amt){const lim=p.o-6;return Object.values(S.teams).filter(t=>t.id!==S.me&&t.id!==p.t&&t.cash>=amt&&sqLen(t.id)<32&&t.div!=='E'&&teamAvg(t.id)>=lim-4)}
function genOffers(){
  const top=topIds(S.me).slice(0,4);
  squad(S.me).forEach(p=>{
    if(p.sale||S.inbox.some(o=>o.pid===p.id)||!top.includes(p.id)||R()>.012)return;
    const amt=value(p)*(1.3+R()*.3);
    const buyers=buyersFor(p,amt);if(!buyers.length)return;const b=pick(buyers);
    S.inbox.push({id:S.nextId++,pid:p.id,from:b.id,amt,exp:S.d+4});
    news(`${b.name} faz proposta de ${money(amt)} por ${p.n}.`);
  });
}
function acceptOffer(oid){
  const o=S.inbox.find(x=>x.id===+oid);if(!o)return;const p=P(o.pid);
  if(!inWindow())return toast('A janela fechou.');
  if(sqLen(S.me)<=16)return toast('Mínimo de 16 jogadores no elenco.');
  if(p.sgn===S.season)return toast('Contratado sem custo nesta temporada: só pode ser vendido na próxima.');
  if(T(o.from).cash<o.amt){S.inbox=S.inbox.filter(x=>x!==o);return toast('O clube desistiu: sem caixa.')}
  transfer(p,o.from,o.amt);fixMyXI();news(`${p.n} vendido ao ${T(o.from).name} por ${money(o.amt)}.`);toast(`Venda concluída: +${money(o.amt)}`);save();render();
}
/* leilão: você define o preço mínimo; durante a janela os clubes dão lances por 4 datas */
const MINR={GOL:2,ZAG:3,LD:1,LE:1,VOL:2,MEI:1,MOF:1,PD:1,PE:1,CA:2};
function needsRole(tid,r){return (SQ.get(tid)||[]).filter(p=>p.p===r||p.p2===r).length<(MINR[r]||1)+1}
function openAuction(pid,min){const p=P(pid);if(p.sgn===S.season){toast('Contratado sem custo nesta temporada: só pode ser vendido na próxima.');return false}S.auctions=S.auctions.filter(a=>a.pid!==pid);S.auctions.push({pid,min,bidders:[],high:null,left:4});p.sale=true;news(`${p.n} vai a leilão com preço mínimo de ${money(min)}.`);return true}
function auctionTick(){
  S.auctions.slice().forEach(a=>{
    const p=P(a.pid);if(!p||p.t!==S.me){S.auctions=S.auctions.filter(x=>x!==a);return}
    const v=value(p);const cands=buyersFor(p,a.min).filter(t=>!a.bidders.some(b=>b.club===t.id));
    const k=Math.min(1,14/Math.max(1,cands.length));
    cands.forEach(t=>{
      const ch=clamp(.2*Math.pow(v/a.min,2.2),0,.45)*(needsRole(t.id,p.p)?1.4:.8)*k;
      if(R()<ch)a.bidders.push({club:t.id,max:v*(.85+R()*.65)});
    });
    a.bidders.forEach(b=>b.cap=Math.min(b.max,T(b.club).cash));
    const ok=a.bidders.filter(b=>b.cap>=a.min).sort((x,y)=>y.cap-x.cap);
    if(ok.length){const second=ok[1]?ok[1].cap*1.03:a.min;a.high={club:ok[0].club,amt:Math.min(ok[0].cap,Math.max(a.min,second))};a.n=ok.length}
    a.left--;
    if(a.left<=0){
      if(a.high&&sqLen(S.me)<=16){a.left=2;news(`Leilão de ${p.n} suspenso: o elenco tem o mínimo de 16 jogadores.`)}
      else if(a.high){const b=T(a.high.club);transfer(p,a.high.club,a.high.amt);fixMyXI();news(`Leilão encerrado: ${p.n} vendido ao ${b.name} por ${money(a.high.amt)} (${a.n} clube(s) na disputa).`)}
      else{a.left=4;news(`Leilão de ${p.n}: nenhum lance pelo mínimo de ${money(a.min)}. Segue listado.`)}
    }else if(a.high&&a.left%2===0)news(`Leilão de ${p.n}: maior lance de ${money(a.high.amt)} (${T(a.high.club).name}).`);
  });
}
function acceptAuction(pid){

}
const bigNews=(a,b)=>[a,b].some(id=>id===S.me||(S.teams[id]&&S.teams[id].main===T(S.me).main));
function aiTransfers(){
  Object.values(S.teams).forEach(t=>{
    if(t.id===S.me||t.cash>-25||sqLen(t.id)<=20)return;
    const p=squad(t.id).sort((a,b)=>value(b)-value(a))[0];if(!p)return;const amt=value(p);
    const buyer=Object.values(S.teams).filter(b=>b.id!==S.me&&b.id!==t.id&&b.cash>amt+20&&sqLen(b.id)<32).sort((a,b)=>b.cash-a.cash)[0];
    if(!buyer)return;transfer(p,buyer.id,amt);p.ct=ri(2,4);p.w=baseWage(p);if(bigNews(t.id,buyer.id))news(`Mercado: endividado, o ${t.name} vende ${p.n} ao ${buyer.name} por ${money(amt)}.`);
  });
  for(let k=0;k<4;k++){
    const buyers=Object.values(S.teams).filter(t=>t.id!==S.me&&t.cash>40&&t.div!=='E');if(!buyers.length)return;
    const b=pick(buyers);const r=pick(GENROLES);const bAvg=teamAvg(b.id);
    const best=Math.max(0,...(SQ.get(b.id)||[]).filter(p=>p.p===r).map(p=>p.o));
    const c=S.players.filter(p=>p.p===r&&p.t&&p.t!==S.me&&p.t!==b.id&&p.o>best&&p.o<=bAvg+8&&sqLen(p.t)>20&&value(p)*1.15<=b.cash-15).sort((x,y)=>y.o-x.o)[0];
    if(!c||topIds(c.t).slice(0,3).includes(c.id)||R()<(b.cash>150?.2:.55))continue;
    const from=c.t,amt=value(c)*1.15;transfer(c,b.id,amt);c.ct=ri(2,4);c.w=baseWage(c)*1.1;
    if(bigNews(from,b.id))news(`Mercado: ${c.n} deixa o ${T(from).name} e acerta com o ${b.name} por ${money(amt)}.`);
  }
}
function aiMarket(){
  let changed=false;
  Object.values(S.teams).forEach(t=>{
    if(t.id===S.me||sqLen(t.id)>=18)return;
    const sq=SQ.get(t.id)||[];const need=ROLES.find(r=>sq.filter(p=>p.p===r||p.p2===r).length<MINR[r])||pick(GENROLES);
    const fa=(SQ.get(null)||[]).filter(p=>p.p===need&&value(p)*.15<Math.max(1,t.cash)).sort((a,b)=>b.o-a.o)[0];
    if(fa){transfer(fa,t.id,0);fa.ct=ri(1,3);fa.w=baseWage(fa)}else fillSquad(t.id,18);

/* ==================== SESSÃO DE LEILÃO (a cada 10 rodadas da liga) ==================== */
/* lotes de jogadores de clubes com elenco inchado, sem clube e jovens promessas; vale mesmo fora da janela */
const AUC_EVERY=10;
function aucStep(v){return Math.max(.05,Math.round(v*.1*20)/20)}
function openAucSession(){
  const myAvg=teamAvg(S.me),pool=[];
  Object.values(S.teams).forEach(t=>{if(t.id===S.me||sqLen(t.id)<=20)return;const top=new Set(topIds(t.id));squad(t.id).forEach(p=>{if(!top.has(p.id)&&!p.sale)pool.push(p)})});
  S.players.filter(p=>p.t===null&&p.a<=33).forEach(p=>pool.push(p));
  const fit=pool.filter(p=>p.o>=myAvg-9&&p.o<=myAvg+7||(p.a<=21&&(p.pot||0)>=myAvg+4&&p.o>=myAvg-16));
  const pick=[];const src=fit.slice();
  const gems=src.filter(p=>p.a<=21&&(p.pot||0)>=myAvg+4);
  while(pick.length<2&&gems.length){const p=gems.splice(ri(0,gems.length-1),1)[0];pick.push(p);src.splice(src.indexOf(p),1)}
  while(pick.length<8&&src.length)pick.push(src.splice(ri(0,src.length-1),1)[0]);
  const lots=pick.map(p=>{
    const v=Math.max(.05,value(p));const start=Math.max(.05,Math.round(v*.5*20)/20);
    const cand=buyersFor(p,start).filter(t=>t.id!==p.t);const rivs=[];
    for(let k=0;k<2&&cand.length;k++){if(R()<(k?.45:.8)){const t=cand.splice(ri(0,cand.length-1),1)[0];rivs.push({id:t.id,max:Math.min(t.cash,v*(.7+R()*.65))})}}
    return {pid:p.id,start,cur:start,lead:null,rivs,from:p.t};
  });
  S.aucS={lots,d:S.d,i:0};
  news(`Sessão de leilão aberta: ${lots.length} jogadores à venda.`);
  if(S.auctions.length&&!inWindow())auctionTick();
}
function aucBid(i){
  const s=S.aucS;if(!s)return;const L=s.lots[i];if(!L||L.done)return;const p=P(L.pid);
  if(L.lead==='me')return toast('Seu lance já é o maior.');
  const nv=L.lead?+(L.cur+aucStep(L.cur)).toFixed(2):L.cur;
  const comp=s.lots.reduce((a,x,j)=>a+(j!==i&&x.lead==='me'?x.cur:0),0);
  if(T(S.me).cash<nv+comp)return toast(`Sem caixa: com os outros lances, faltam ${money(nv+comp-T(S.me).cash)}.`);
  const mine=s.lots.filter(x=>x.lead==='me').length;
  if(sqLen(S.me)+mine>=34)return toast('Elenco cheio (34).');
  L.cur=nv;L.lead='me';
  if(L.riv&&L.max>=nv+aucStep(nv)&&R()<.85){L.cur=+(nv+aucStep(nv)).toFixed(2);L.lead=L.riv;toast(`${T(L.riv).name} cobriu: ${money(L.cur)}`)}
  else{if(L.riv&&!L.out){L.out=true}toast(`Você lidera ${p.n}: ${money(L.cur)}`)}
  save();openAucSheet();
}
function closeAucSession(){
  const s=S.aucS;if(!s)return;S.aucS=null;clearInterval(AUCT);const el=document.getElementById('auclive');if(el)el.remove();const got=[];
  s.lots.forEach(L=>{const p=P(L.pid);if(L.done||!p||p.t!==L.from||!L.lead)return;
    if(L.lead==='me'){if(T(S.me).cash<L.cur||sqLen(S.me)>=34)return;transfer(p,S.me,L.cur);p.w=baseWage(p)*1.1;p.ct=p.a<=21?3:2;p.sgn=S.season;got.push(`${p.n} (${money(L.cur)})`)}
    else if(T(L.lead).cash>=L.cur&&sqLen(L.lead)<32)transfer(p,L.lead,L.cur);
  });
  fixMyXI();
  news(got.length?`Leilão encerrado. Arrematados: ${got.join(', ')}.`:'Sessão de leilão encerrada sem compras suas.');
}

/* ==================== LEILÃO AO VIVO (um jogador por vez, estilo Elifoot) ==================== */
let AUCT=null;
const AUC_T0=8,AUC_RESET=4;
function aucRivs(L){if(!L.rivs)L.rivs=L.riv?[{id:L.riv,max:L.max||0}]:[];return L.rivs}
function openAucLive(){
  const s=S.aucS;if(!s)return;if(s.i==null)s.i=0;
  while(s.i<s.lots.length&&s.lots[s.i].done)s.i++;
  let el=document.getElementById('auclive');if(!el){el=document.createElement('div');el.id='auclive';document.body.appendChild(el)}
  if(s.i>=s.lots.length){aucFinish();return}
  aucStartLot();
}
function aucStartLot(){
  const s=S.aucS,L=s.lots[s.i];const p=P(L.pid);
  if(!p||p.t!==L.from){L.done=true;L.res='Lote retirado';s.i++;openAucLive();return}
  aucRivs(L);L.left=AUC_T0;L.msg='Lances abertos!';
  clearInterval(AUCT);AUCT=setInterval(aucTick,250);aucPaint();
}
function aucTick(){
  const s=S.aucS;if(!s){clearInterval(AUCT);return}const L=s.lots[s.i];if(!L||L.done)return;
  L.left-=.25;
  /* rivais dão lance em momentos aleatórios, mais afoitos no fim */
  const step=aucStep(L.cur);
  for(const r of aucRivs(L)){if(L.lead===r.id)continue;const nv=L.lead?L.cur+step:L.cur;if(r.max>=nv&&T(r.id).cash>=nv&&R()<(L.left<2.5?.35:.1)){L.cur=+nv.toFixed(2);L.lead=r.id;L.left=Math.max(L.left,AUC_RESET);L.msg=`${T(r.id).name} dá lance!`;L.flash=Date.now();break}}
  if(L.left<=0){aucSell();return}
  L.msg=L.left<=1.2?'Dou-lhe duas…':L.left<=2.4?'Dou-lhe uma…':L.msg;
  aucPaint();
}
function aucBidLive(){
  const s=S.aucS;if(!s)return;const L=s.lots[s.i];if(!L||L.done||L.lead==='me')return;
  const nv=L.lead?+(L.cur+aucStep(L.cur)).toFixed(2):L.cur;
  if(T(S.me).cash<nv)return toast(`Sem caixa: faltam ${money(nv-T(S.me).cash)}.`);
  if(sqLen(S.me)>=34)return toast('Elenco cheio (34).');
  L.cur=nv;L.lead='me';L.left=Math.max(L.left,AUC_RESET);L.msg='Seu lance!';L.flash=Date.now();aucPaint();
}
function aucSell(){
  clearInterval(AUCT);const s=S.aucS,L=s.lots[s.i];const p=P(L.pid);L.done=true;
  if(L.lead==='me'&&T(S.me).cash>=L.cur&&sqLen(S.me)<34&&p.t===L.from){transfer(p,S.me,L.cur);p.w=baseWage(p)*1.1;p.ct=p.a<=21?3:2;p.sgn=S.season;fixMyXI();L.res=`Arrematado por você: ${money(L.cur)}`;L.win='me';news(`Leilão: ${p.n} arrematado por ${money(L.cur)}.`)}
  else if(L.lead&&L.lead!=='me'&&T(L.lead).cash>=L.cur&&sqLen(L.lead)<32&&p.t===L.from){transfer(p,L.lead,L.cur);L.res=`Vendido ao ${T(L.lead).name}: ${money(L.cur)}`;L.win=L.lead}
  else{L.res='Sem lances: lote retirado';L.lead=null}
  L.msg='VENDIDO!';if(!L.win)L.msg='SEM LANCES';
  save();aucPaint();
  setTimeout(()=>{if(!S||!S.aucS)return;S.aucS.i++;openAucLive()},1800);
}
function aucPass(){const s=S.aucS;if(!s)return;const L=s.lots[s.i];if(!L||L.done)return;if(L.lead==='me')return toast('Você está na frente: espere o martelo.');L.left=Math.min(L.left,1.2)}
function aucFinish(){
  clearInterval(AUCT);const s=S.aucS;if(!s)return;s.fin=true;
  const el=document.getElementById('auclive');if(el)el.innerHTML=aucSummaryHTML();
}
function aucClose(){clearInterval(AUCT);const el=document.getElementById('auclive');if(el)el.remove();if(S.aucS&&S.aucS.fin){const got=S.aucS.lots.filter(l=>l.win==='me').map(l=>P(l.pid).n);news(got.length?`Leilão encerrado. Arrematados: ${got.join(', ')}.`:'Sessão de leilão encerrada sem compras suas.');S.aucS=null}save();render()}


/* ==================== FIM DE TEMPORADA: ACESSOS, REBAIXAMENTOS E VAGAS ==================== */
const LIBQ={ARG:5,URU:3,COL:3,ECU:3,PAR:3,CHI:3,PER:2,BOL:2,VEN:2},SUDQ={ARG:6,URU:3,COL:3,ECU:3,PAR:3,CHI:3,PER:2,BOL:2,VEN:1};
const LEAGUE_PRIZE={A:[18,2],B:[5,.6],C:[1.5,.3],D:[.5,.1],X:[6,1]};
function statePicks(quota,exclude,R_){
  const out=[];
  for(const u of Object.keys(quota)){
    let list=(R_['E-'+u]||[]).filter(id=>!exclude.has(id));
    const extra=Object.values(S.teams).filter(t=>t.reg===u&&!exclude.has(t.id)&&!list.includes(t.id)).sort((a,b)=>(teamAvg(b.id)+b.rep/10)-(teamAvg(a.id)+a.rep/10)).map(t=>t.id);
    list=list.concat(extra).slice(0,quota[u]);list.forEach(id=>{out.push(id);exclude.add(id)});
  }
  return out;
}
function regionGroups(ids,size){
  const s=ids.slice().sort((a,b)=>STORD.indexOf(T(a).reg)-STORD.indexOf(T(b).reg)||T(b).rep-T(a).rep);
  const g=Math.round(s.length/size);const out=Array.from({length:g},()=>[]);
  s.forEach((id,i)=>out[Math.min(g-1,Math.floor(i*g/s.length))].push(id));return out;
}
function contGroups(ids){
  const s=ids.slice().sort((a,b)=>T(b).rep-T(a).rep);let best=null,bc=1e9;
  for(let tr=0;tr<300&&bc>0;tr++){
    const pots=[0,1,2,3].map(k=>shuffle(s.slice(k*8,k*8+8)));
    const gs=Array.from({length:8},(_,i)=>pots.map(p=>p[i]).filter(Boolean));
    const cty=id=>STN[T(id).reg]?'BRA':T(id).reg;
    const conf=gs.reduce((n,g)=>n+(g.length-new Set(g.map(cty)).size),0);
    if(conf<bc){bc=conf;best=gs}
  }
  return best;
}
/* tabela final de uma série: posição pelo ranking, números da fase de pontos corridos */
function finalTable(c,rk){
  const perf={};c.done.concat(c.st&&!c.fin?[c.st]:[]).filter(s=>s.t==='rr').forEach(s=>s.groups.forEach(g=>groupTable(g).forEach(r=>{if(!perf[r.id])perf[r.id]=r})));
  return rk.map(id=>{const r=perf[id]||{};return [id,r.P||0,r.J||0,(r.GP||0)-(r.GC||0)]});
}
function seasonEnd(){
  const Rk={};Object.values(S.comps).forEach(c=>Rk[c.id]=compRanking(c));
  const me=T(S.me);const main=S.comps[me.main];
  const ri_=rankInfo(S.me);const pos=ri_.pos;const tg=targetPos();
  /* premiação das ligas */
  ['A','B','C','D'].forEach(k=>{const [top,base]=LEAGUE_PRIZE[k];const r=Rk[k];r.forEach((id,i)=>award(id,top*(r.length-1-i)/(r.length-1)+base))});
  Object.values(S.comps).filter(c=>c.kind==='ext').forEach(c=>{const r=Rk[c.id];const [top,base]=LEAGUE_PRIZE.X;r.forEach((id,i)=>award(id,top*(r.length-1-i)/(r.length-1)+base))});
  /* diretoria */
  if(tg){if(pos===1&&main&&main.kind!=='est')S.sat+=15;else if(pos<=tg)S.sat+=10;else if(pos>tg+3)S.sat-=18;else S.sat-=7}
  /* acessos e rebaixamentos */
  const A=Rk.A,B=Rk.B,C=Rk.C,D=Rk.D;
  const A1=A.slice(0,16).concat(B.slice(0,4));
  const B1=A.slice(16).concat(B.slice(4,16),C.slice(0,4));
  const C1=B.slice(16).concat(C.slice(4,16),D.slice(0,4));
  const Cdown=C.slice(16);
  const ex=new Set([...A1,...B1,...C1,...Cdown]);

/* ==================== PRÓXIMOS JOGOS (calendário do clube) ==================== */
function aliveIn(c,id){
  if(c.fin)return false;const st=c.st;if(!st)return false;
  if(st.t==='rr')return st.groups.some(g=>g.tb[id]);
  const rd=st.rounds[st.r];if(rd.ties)return rd.ties.some(t=>(t.a===id||t.b===id)&&(!t.w||t.w===id))||(st.ent&&Object.keys(st.ent).some(r=>+r>st.r&&st.ent[r].includes(id)));
  return st.pool.includes(id)||(st.ent&&Object.keys(st.ent).some(r=>+r>=st.r&&st.ent[r].includes(id)));
}
function upcoming(id,max){
  const out=[];
  for(const c of Object.values(S.comps)){
    if(!aliveIn(c,id))continue;const st=c.st;
    if(st.t==='rr'){
      const g=st.groups.find(g=>g.tb[id]);
      for(let o=0;st.j+o<st.nd&&c.k+o<c.dates.length;o++){const f=(g.sch[st.j+o]||[]).find(([h,a])=>h===id||a===id);if(f)out.push({d:c.dates[c.k+o],c,h:f[0],a:f[1]})}
      if(c.si+1<c.stages.length&&c.k+(st.nd-st.j)<c.dates.length)out.push({d:c.dates[c.k+(st.nd-st.j)],c,tbd:1});
    }else{
      if(!st.rounds[st.r].ties&&(st.draw==='seed'||c.dates[c.k]===S.d))drawRound(c);
      let r=st.r,l=st.l,k=c.k;
      const er=st.ent?Object.keys(st.ent).map(Number).find(x=>x>=st.r&&st.ent[x].includes(id)&&!(st.rounds[x].ties&&st.rounds[x].ties.some(t=>t.a===id||t.b===id))):undefined;
      if(er!=null&&er>st.r){let kk=c.k-l;for(let x=st.r;x<er;x++)kk+=st.rounds[x].legs;if(kk<c.dates.length)out.push({d:c.dates[kk],c,tbd:1,rn:st.rounds[er].n});continue}
      while(r<st.rounds.length&&k<c.dates.length){
        const rd=st.rounds[r];
        if(r===st.r&&rd.ties){const t=rd.ties.find(t=>t.a===id||t.b===id);if(t&&!t.bye)out.push({d:c.dates[k],c,h:l===0?t.a:t.b,a:l===0?t.b:t.a,leg:rd.legs>1?l+1:0,rn:rd.n,tie:t});else if(!t||t.bye){/* folga */}}
        else{out.push({d:c.dates[k],c,tbd:1,rn:rd.n});break}
        l++;k++;if(l>=rd.legs){l=0;r++}
      }
    }
  }
  out.sort((x,y)=>x.d-y.d);return max?out.slice(0,max):out;
}
function nextFixture(){const u=upcoming(S.me,1)[0];if(!u)return null;if(u.tbd)return{...u,op:null};return{...u,home:u.h===S.me,op:u.h===S.me?u.a:u.h}}
function stageTxt(u){
  const c=u.c;if(u.tbd)return `${c.s} · ${u.rn?u.rn:'próxima fase'} (a definir)`;
  if(c.st.t==='ko'){const rd=c.st.rounds.find(r=>r.n===u.rn)||c.st.rounds[c.st.r];return `${c.s} · ${rd.n}${u.leg?` · jogo ${u.leg===1?'de ida':'de volta'}`:''}`}
  const st=c.st;const g=st.groups.find(g=>g.tb[u.h]);const j=st.groups.length>1?' · Grupo '+String.fromCharCode(65+st.groups.indexOf(g)):'';
  const rnd=st.j+1+Math.max(0,c.dates.indexOf(u.d)-c.k);
  return `${c.s}${j} · ${rnd}ª rodada`;
}

const GKKITS=['#f5c518','#22c3b0','#ff7a1a','#8e44d6','#e8336d','#9be22d','#2b2f36'];
function gkKit(tid){const t=T(tid);const near=c=>{const h=x=>parseInt(x.slice(1),16);const d=(p,q)=>Math.abs((h(p)>>16)-(h(q)>>16))+Math.abs((h(p)>>8&255)-(h(q)>>8&255))+Math.abs((h(p)&255)-(h(q)&255));return [t.c1,t.c2].some(x=>/^#[0-9a-f]{6}$/i.test(x||'')&&d(c,x)<140)};
  let i=0;for(const ch of String(tid))i=(i*31+ch.charCodeAt(0))%997;for(let k=0;k<GKKITS.length;k++){const c=GKKITS[(i+k)%GKKITS.length];if(!near(c))return c}return GKKITS[0]}
/* geometria da cobrança: canto, altura, mergulho do goleiro e rebote */
function penGeo(k){
  const rr=(a,b)=>a+Math.random()*(b-a),side=()=>Math.random()<.5?-1:1;
  const s=Math.random()<.18?0:side(),high=Math.random()<.4;
  let bx=s===0?rr(-4,4):s*rr(16,29),by=high?rr(24,36):rr(58,74);
  let kd,bx2=null,by2=null;
  if(k==='gol'){kd=s===0?side():(Math.random()<.7?-s:s);if(kd===s&&s!==0){bx=s*rr(28,32);by=high?rr(20,28):by}}
  else if(k==='def'){kd=s;if(s===0){by=rr(40,60)}bx2=bx+(s||side())*rr(14,24);by2=by+rr(22,40)}
  else if(k==='trave'){if(Math.random()<.3){bx=rr(-24,24);by=16;bx2=bx+rr(-10,10);by2=rr(100,120)}else{const p=side();bx=p*35;bx2=p*rr(20,30);by2=rr(98,118)}kd=Math.random()<.5?-Math.sign(bx||1):Math.sign(bx||1)}
  else{if(Math.random()<.45){bx=rr(-28,28);by=-2}else{bx=side()*rr(44,48);}kd=side()}
  if(bx2===null){bx2=bx;by2=by}
  const kl=50+(kd===0?0:kd*(s===kd&&k==='def'?Math.min(Math.abs(bx),24):rr(16,24)));
  const kt=s===0&&k==='def'?22:Math.max(8,Math.min(42,(k==='def'?by:(high?28:64))-26));
  const kr=kd===0?0:kd*(high?62:82);
  return {bl:50+bx,bt:by,bl2:50+bx2,bt2:by2,kl,kt,kr};
}

function snapLineup(n){return{n,f:formName(),tac:S.lineup.tac,pos:S.lineup.pos.map(q=>({x:q.x,y:q.y})),xi:S.lineup.xi.slice()}}
function toast(s){const t=$('#toast');t.textContent=s;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600)}
async function copyText(txt,okMsg){try{await navigator.clipboard.writeText(txt);toast(okMsg)}catch(e){toast('Não deu para copiar automaticamente. Selecione o texto e copie.')}}
function exportCSV(){return 'CLUBE;FUNÇÃO;NOME;FORÇA;IDADE;FUNÇÃO2\n'+squad(S.me).sort((a,b)=>ROLES.indexOf(a.p)-ROLES.indexOf(b.p)||b.o-a.o).map(p=>`${T(S.me).name};${p.p};${p.n};${p.o};${p.a};${p.p2||''}`).join('\n')}
function importCSV(txt){
  const byName={};Object.values(S.teams).forEach(t=>{byName[t.name.toLowerCase()]=t.id;byName[t.id]=t.id});
  const rows=[],bad=[];
  const role=x=>{x=(x||'').toUpperCase().trim();return RN[x]?x:LEGACY[x]||null};
  txt.split(/\r?\n/).forEach((l,i)=>{
    if(!l.trim())return;const c=l.split(/[;\t]/).map(x=>x.trim());
    if(i===0&&/clube/i.test(c[0]))return;
    const club=(c[0]||'').toLowerCase()==='livre'?null:byName[(c[0]||'').toLowerCase()];
    const r=role(c[1]),r2=c[5]?role(c[5]):'';const o=+c[3],a=+c[4];
    if(club===undefined||!r||r2===null||!c[2]||!(o>=30&&o<=99)||!(a>=14&&a<=45)){bad.push(i+1);return}
    rows.push({t:club,p:r,p2:r2||'',n:c[2],o,a});
  });
  if(!rows.length)return{ok:0,bad};
  const clubs=new Set(rows.map(r=>r.t));
  S.players=S.players.filter(p=>!clubs.has(p.t));
  reindex();
  rows.forEach(r=>{const p={id:S.nextId++,...r,inj:0,sus:0,g:0,j:0,sale:false};initPot(p);initContract(p);addPlayer(p)});
  clubs.forEach(id=>{if(id)fillSquad(id,id===S.me?16:18)});
  S.inbox=S.inbox.filter(o=>P(o.pid));
  if(clubs.has(S.me))S.lineup.xi=elPick(S.me,"4-4-2");else fixMyXI();
  clearXC();save();return{ok:rows.length,clubs:clubs.size,bad};
}
function saveCode(){const raw=packS();const z=LZ();return z?'TZ:'+z.compressToBase64(raw):raw}
function readCode(txt){txt=txt.trim();if(txt.startsWith('TZ:')){const z=LZ();if(!z)throw new Error('lz');txt=z.decompressFromBase64(txt.slice(3))}return unpackS(txt)}

function mPos(id){const m=MS.mine;const e=m.on[S.me].find(o=>o[1]===id);return m.posMe[id]||(e?{x:MRXY[e[0]][0],y:MRXY[e[0]][1]}:{x:50,y:50})}
function mSwap(a,b){const m=MS.mine;const on=m.on[S.me];const ea=on.find(o=>o[1]===a),eb=on.find(o=>o[1]===b);if(!ea||!eb)return;
  const pa=mPos(a),pb=mPos(b);m.posMe[a]=pb;m.posMe[b]=pa;[ea[0],eb[0]]=[eb[0],ea[0]];m.dirty=true;MS.form=null;
  toast(`${P(a).n} ↔ ${P(b).n}`)}
function mMove(id,x,y){const m=MS.mine;const on=m.on[S.me];const e=on.find(o=>o[1]===id);if(!e)return;const r=zoneRole(x,y);
  if(r==='GOL'&&on.some(o=>o[0]==='GOL'&&o!==e))return toast('Já há um goleiro em campo.');
  m.posMe[id]={x,y};e[0]=r;m.dirty=true;MS.form=null;toast(`${P(id).n} agora joga como ${RN[r].toLowerCase()}.`)}
/* trocas em lote: monte a lista (sai → entra) e confirme tudo de uma vez */
function freeGaps(){const m=MS.mine;return m.gap[S.me].length-(MS.pend||[]).filter(x=>!x.o).length}
function tryPair(){
  const m=MS.mine;MS.pend=MS.pend||[];if(!MS.selIn)return;
  if(m.subs[S.me]+MS.pend.length>=5){toast('Limite de 5 trocas atingido.');MS.selIn=null;return}
  if(MS.selOut){MS.pend.push({o:MS.selOut,i:MS.selIn});MS.selOut=MS.selIn=null;toast('Troca adicionada à lista.')}
  else if(freeGaps()>0){MS.pend.push({o:null,i:MS.selIn});MS.selIn=null;toast('Entrada adicionada à lista.')}
}
function applyPend(){
  const m=MS.mine;const L=MS.pend||[];let n=0;
  L.forEach(x=>{if(m.subs[S.me]>=5)return;if(x.o){if(m.on[S.me].some(o=>o[1]===x.o)){doSub(m,S.me,x.o,x.i);n++}}else if(m.gap[S.me].length){doSub(m,S.me,null,x.i,m.gap[S.me].shift());n++}});

}

let DRAG=null,NOBG=0;
function fieldXY(e){const r=DRAG.rect;return{x:clamp((e.clientX-r.left)/r.width*100,5,95),y:clamp((e.clientY-r.top)/r.height*100,5,95)}}
function nearestSlot(x,y,skip,maxd){let best=-1,bd=maxd;S.lineup.pos.forEach((q,i)=>{if(i===skip)return;const dx=(q.x-x)*0.68,dy=(q.y-y)*0.86;const d=Math.hypot(dx,dy);if(d<bd){bd=d;best=i}});return best}
document.addEventListener('pointerdown',e=>{
  const el=e.target.closest('[data-drag]');const f=$('#field');if(!el||!f||e.button>0)return;
  DRAG={el,kind:el.dataset.drag,i:+el.dataset.v,pid:+el.dataset.pid,sx:e.clientX,sy:e.clientY,moved:false,rect:f.getBoundingClientRect(),ghost:null};
  try{el.setPointerCapture(e.pointerId)}catch(_){}
});
document.addEventListener('pointermove',e=>{
  if(!DRAG)return;
  if(!DRAG.moved&&Math.hypot(e.clientX-DRAG.sx,e.clientY-DRAG.sy)<7)return;
  if(!DRAG.moved){DRAG.moved=true;$('#field').classList.add('dragging');
    if(DRAG.kind==='bench'){const g=DRAG.el.cloneNode(true);g.classList.add('ghost');document.body.appendChild(g);DRAG.ghost=g}else DRAG.el.classList.add('lift')}
  e.preventDefault();
  if(DRAG.kind==='slot'){const {x,y}=fieldXY(e);DRAG.el.style.left=x+'%';DRAG.el.style.top=y+'%';const sn=snap(x,y);const r=zoneRole(sn.x,sn.y);document.querySelectorAll('#field .sp.hot').forEach(n=>n.classList.remove('hot'));const hs=[...document.querySelectorAll('#field .sp')].find(n=>n.style.left===sn.x+'%'&&n.style.top===sn.y+'%');if(hs)hs.classList.add('hot');DRAG.el.querySelector('b').textContent=r;
    const p=P(S.lineup.xi[DRAG.i]);if(p){const pn=penP(p,r);DRAG.el.classList.toggle('off',pn>1);const em=DRAG.el.querySelector('em');if(pn>1){if(em)em.textContent='−'+pn;else DRAG.el.querySelector('i').insertAdjacentHTML('beforeend',`<em>−${pn}</em>`)}else if(em)em.remove()}}
  else{DRAG.ghost.style.left=e.clientX+'px';DRAG.ghost.style.top=e.clientY+'px'}
},{passive:false});
function endDrag(e,cancel){
  if(!DRAG)return;const d=DRAG;DRAG=null;
  if(d.ghost)d.ghost.remove();
  if(cancel){render();return}
  /* no celular, o clique que segue o toque cai no fundo da janela recém-aberta e a fechava: ignora por um instante */
  if(!d.moved){NOBG=Date.now()+600;if(d.kind==='slot')openSlot(d.i);else openPlayer(d.pid);return}
  const {x,y}=(DRAG=d,fieldXY(e));DRAG=null;
  const inside=e.clientX>=d.rect.left&&e.clientX<=d.rect.right&&e.clientY>=d.rect.top&&e.clientY<=d.rect.bottom;
  const xi=S.lineup.xi;
  if(d.kind==='slot'){
    const sn=snap(x,y);const j=S.lineup.pos.findIndex((q,k)=>k!==d.i&&q.x===sn.x&&q.y===sn.y);
    if(j>=0){[xi[d.i],xi[j]]=[xi[j],xi[d.i]];toast('Jogadores trocados de lugar.')}
    else S.lineup.pos[d.i]=sn;
  }else if(inside){
    const p=P(d.pid);if(!avail(p)){toast(`${p.n} está ${p.inj?'lesionado':'suspenso'}.`);render();return}
    const j=nearestSlot(x,y,-1,14);
    if(j>=0){xi[j]=d.pid;toast(`${p.n} entra como ${RN[myRoles()[j]].toLowerCase()}.`)}else toast('Solte o reserva em cima de uma bolinha do campo.');
  }
  S.lineup.form=formName();save();render();
}

/* ---------- escalação: 11 titulares escolhidos; o esquema sai da contagem D-M-A ---------- */
const ELFORMS=['4-4-2','4-3-3','3-4-3','4-5-1','5-3-2','5-4-1','3-5-2','4-2-4','5-5-0','5-0-5','3-3-4','4-6-0'];
const grpOfId=id=>{const p=P(id);return p?GRP[p.p]:null};
function formName(){
  const xi=(S&&S.lineup&&S.lineup.xi||[]).filter(id=>id&&P(id));
  const c=g=>xi.filter(id=>grpOfId(id)===g).length;
  return `${c('D')}-${c('M')}-${c('A')}`;
}
function xiIds(){return S.lineup.xi.filter(id=>id&&P(id))}
/* melhores do elenco para um esquema (goleiro + D + M + A); falta de gente num setor é coberta pelos melhores que sobrarem */
function elPick(tid,form,onlyAvail=true){
  const [d,m,a]=form.split('-').map(Number);
  const pool=squad(tid).filter(p=>!onlyAvail||avail(p)).sort((x,y)=>y.o-x.o);
  const used=new Set();const take=(g,n)=>{const out=[];for(const p of pool){if(out.length>=n)break;if(!used.has(p.id)&&GRP[p.p]===g){out.push(p.id);used.add(p.id)}}return out};
  const xi=[...take('G',1),...take('D',d),...take('M',m),...take('A',a)];
  for(const p of pool){if(xi.length>=11)break;if(!used.has(p.id)&&GRP[p.p]!=='G'){xi.push(p.id);used.add(p.id)}}
  for(const p of pool){if(xi.length>=11)break;if(!used.has(p.id)){xi.push(p.id);used.add(p.id)}}
  while(xi.length<11)xi.push(null);
  return xi;
}
function fixMyXI(){
  let changed=false;const xi=S.lineup.xi;
  if(!Array.isArray(xi)||xi.length!==11){S.lineup.xi=elPick(S.me,'4-4-2');return true}
  for(let i=0;i<11;i++){const p=P(xi[i]);if(xi[i]&&(!p||p.t!==S.me||!avail(p))){xi[i]=null;changed=true}}
  const hasG=xi.some(id=>grpOfId(id)==='G');

/* ---------- 11 reservas relacionados ---------- */
const MAXRES=11;
function elRes(xi){
  const on=new Set((xi||S.lineup.xi).filter(Boolean));
  const pool=squad(S.me).filter(p=>avail(p)&&!on.has(p.id)).sort((a,b)=>b.o-a.o);
  const out=[];const g=pool.find(p=>GRP[p.p]==='G');if(g)out.push(g.id);
  /* pelo menos um de cada setor, depois os melhores */
  for(const k of ['D','M','A']){const p=pool.find(p=>GRP[p.p]===k&&!out.includes(p.id));if(p)out.push(p.id)}
  for(const p of pool){if(out.length>=MAXRES)break;if(!out.includes(p.id)&&!(GRP[p.p]==='G'&&out.filter(id=>GRP[P(id).p]==='G').length>=2))out.push(p.id)}
  return out.slice(0,MAXRES);
}
const _fixXI=fixMyXI;
fixMyXI=function(){const ch=_fixXI();const xi=new Set(S.lineup.xi.filter(Boolean));
  let r=(S.lineup.res||[]).filter(id=>{const p=P(id);return p&&p.t===S.me&&avail(p)&&!xi.has(id)});
  if(!r.length)r=elRes();S.lineup.res=r.slice(0,MAXRES);return ch};
function bench(m,t){
  const onIds=new Set(m.on[t].map(x=>x[1]));let l=squad(t).filter(p=>avail(p)&&!onIds.has(p.id)&&!m.left[t].includes(p.id)&&!(m.app[t]||[]).includes(p.id));
  if(t===S.me&&S.lineup.res&&S.lineup.res.length)l=l.filter(p=>S.lineup.res.includes(p.id));
  else if(t!==S.me){const top=new Set(squad(t).filter(p=>avail(p)&&!onIds.has(p.id)).sort((a,b)=>b.o-a.o).slice(0,MAXRES).map(p=>p.id));l=l.filter(p=>top.has(p.id))}
  return l;
}
Object.assign(ACT,{
  elres:v=>{const id=+v;S.lineup.res=S.lineup.res||[];const i=S.lineup.res.indexOf(id);
    if(i>=0)S.lineup.res.splice(i,1);else{if(S.lineup.xi.includes(id))return toast('Ele já é titular.');if(!avail(P(id)))return toast('Indisponível.');if(S.lineup.res.length>=MAXRES)return toast(`Já são ${MAXRES} reservas: tire alguém antes.`);S.lineup.res.push(id)}
    save();render()},
  elresauto:()=>{S.lineup.res=elRes();save();render();toast('Reservas escolhidos automaticamente.')}
});

/* ======================================================================
   EVOLUÇÃO POR RODADA (como no Elifoot): a força muda depois de cada jogo do time.
   Subiu na rodada = número em azul; caiu = vermelho. Lesão tira 3 pontos de força.
   ====================================================================== */
function markEv(p,f0){const f1=FZ(p.o);if(f1!==f0)p.ev=f1>f0?1:-1}
/* evolução estilo Elifoot: sem teto. Descansando, sobe; jogando, cansa e cai aos poucos; voltou a descansar, sobe de novo.
   A idade pesa: jovem descansado sobe mais rápido; veterano (33+, craque 35+) tende a cair. */
/* evolução dinâmica estilo Elifoot: a cada 2–3 rodadas o jogador ganha ou perde 1 de força.
   descansando sobe; jogando oscila e tende a cair devagar; quanto mais forte, mais rápido sobe; craque bem mais */
var DVP={pu:.13,pd:.23,ru:[.3,.22,.14,.06],rd:[.13,.13,.15,.19],a:.9,b:.2,s:1.7,sd:.75,pr:1.4};
function devPlayer(p,played){
  const star=isStar(p);const old=p.a>=(star?35:33);let up,dn;
  if(played){up=DVP.pu;dn=DVP.pd}
  else{const k=p.a<=25?0:p.a<=29?1:p.a<=32?2:3;up=DVP.ru[k];dn=DVP.rd[k]}
  const F=FZ(p.o);up*=DVP.a+F/50*DVP.b;
  if(star){up*=DVP.s;dn*=DVP.sd}
  else if(p.prom&&p.a<=25)up*=DVP.pr;
  if(old){up*=.4;dn+=.1}
  if(p.inj>0)up=0;
  const r=R();if(r<dn)return -1;if(r<dn+up)return 1;return 0;
}
function roundDev(teams,ap){ap=ap||new Set();
  const ups=[],downs=[];
  teams.forEach(tid=>{(SQ.get(tid)||[]).forEach(p=>{
    if(tid===S.me&&p.evd!==S.d){p.ev=0}
    const d=devPlayer(p,ap.has(p.id));if(!d)return;
    const f0=FZ(p.o);p.o=clamp(+(p.o+d*.9).toFixed(2),38,95);if(p.o>p.pot)p.pot=p.o;p.evd=S.d;markEv(p,f0);
    /* promessa que desabrocha vira craque (*) */
    if(d>0&&p.prom&&!isStar(p)&&p.a<=25&&FZ(p.o)>=22&&R()<.1){p.star=1;if(tid===S.me)news(`✱ ${p.n} desabrochou e virou craque!`);}
    if(tid===S.me&&p.ev)(p.ev>0?ups:downs).push(`${p.n} ${p.ev>0?'▲':'▼'}`);
  })});
  if(ups.length||downs.length)news(`Evolução na rodada: ${ups.length?'subiram '+ups.join(', '):''}${ups.length&&downs.length?'; ':''}${downs.length?'caíram '+downs.join(', '):''}.`);
}
/* o relatório mensal agora só guarda o histórico do gráfico */
function devTick(){S.players.forEach(p=>{if(p.t===S.me){p.h=p.h||[];p.h.push(p.o);if(p.h.length>12)p.h.shift()}})}
function injure(m,t){
  const on=m.on[t];if(!on.length)return;const p=P(pick(on)[1]);if(!p)return;
  p.inj=ri(2,9);const f0=FZ(p.o);p.o=Math.max(38,p.o-3);p.evd=S.d;markEv(p,f0);if(t===S.me&&!p.ev)p.ev=-1;
  m.ev.push({min:m.min,t,k:'les',n:p.n+' (−3)'});
  const r=takeOff(m,t,p.id);
  if(t===S.me&&MS&&MS.live&&m===MS.mine)m.gap[t].push(r);else autoSub(m,t,r);
}

/* ======================================================================
   VENDA IMEDIATA: você pede um preço; perto do valor de mercado vende fácil,
   acima disso a chance cai. Se vender, o dinheiro entra na hora.
   ====================================================================== */
function sellChance(p,price){const r=price/Math.max(.01,value(p));return r<=.8?.95:r<=1?.85:r<=1.15?.6:r<=1.3?.35:r<=1.5?.15:r<=1.8?.04:0}
function sellBox(p){
  const v=value(p);const blk=p.sgn===S.season;const last=(S.sellTry||{})[p.id];
  const tried=last&&last.d===S.d;
  return `<div class="offer"><p class="tiny" style="font-weight:700">VENDER</p>
    ${blk?'<p class="small">Contratado nesta temporada sem custo: só pode ser vendido na próxima.</p>':
    !inWindow()?`<p class="small">Janela fechada. ${windowText()}</p>`:
    `<div class="row" style="align-items:flex-end"><label class="grow" for="sellp">Preço pedido (R$ milhões)<input type="number" id="sellp" step="0.1" min="0.05" value="${(tried?Math.min(last.p*.9,v):v).toFixed(1)}" data-in="sellp"></label><button class="btn sm pri" data-a="sellgo" data-v="${p.id}">Vender agora</button></div>
    <p class="hint">Sugestão: <b>${money(v)}</b> (valor de mercado). Pedindo até isso, vende fácil; acima, cada vez mais difícil — com mais de 80% acima, ninguém paga.${tried?` Hoje ninguém pagou ${money(last.p)}: só dá para tentar de novo com um preço menor.`:''}</p>`}</div>`;
}
function sellNow(pid){
  const p=P(pid);const el=$('#sellp');const price=Math.max(.05,parseFloat(((el&&el.value)||'').replace(',','.'))||0);
  if(!(price>0))return toast('Informe um preço.');
  if(!inWindow())return toast('Janela fechada.');
  if(sqLen(S.me)<=16)return toast('Mínimo de 16 jogadores no elenco.');
  S.sellTry=S.sellTry||{};const last=S.sellTry[pid];
  if(last&&last.d===S.d&&price>=last.p)return toast(`Hoje ninguém pagou ${money(last.p)}. Peça menos.`);
  const buyers=buyersFor(p,price).filter(t=>sqLen(t.id)<32);
  if(!buyers.length||R()>=sellChance(p,price)){S.sellTry[pid]={d:S.d,p:price};save();openPlayer(pid);return toast(buyers.length?`Nenhum clube aceitou pagar ${money(price)}.`:'Nenhum clube tem caixa ou vaga para esse valor.')}
  const b=buyers.sort((x,y)=>y.rep-x.rep)[0];
  transfer(p,b.id,price);fixMyXI();delete S.sellTry[pid];
  news(`${p.n} vendido ao ${b.name} por ${money(price)}.`);toast(`Vendido ao ${b.name}: +${money(price)}`);closeSheet();save();render();
}

/* ---------- leilão sem cronômetro: você decide no seu tempo ----------
   cada lance seu recebe resposta imediata dos rivais (cobrem ou desistem);
   "Passar" encerra o lote com quem estiver na frente */
function aucRivalTurn(L){
  const nv=L.lead?+(L.cur+aucStep(L.cur)).toFixed(2):L.cur;
  const c=aucRivs(L).filter(r=>r.id!==L.lead&&r.max>=nv&&T(r.id).cash>=nv);
  if(!c.length)return false;
  /* quanto mais folga até o teto, mais provável cobrir */
  const r=c.sort((a,b)=>b.max-a.max)[0];if(R()>Math.min(.95,.55+(r.max-nv)/Math.max(.1,nv)))return false;
  L.cur=nv;L.lead=r.id;L.flash=Date.now();return true;
}
function aucStartLot(){
  const s=S.aucS,L=s.lots[s.i];const p=P(L.pid);
  if(!p||p.t!==L.from){L.done=true;L.res='Lote retirado';s.i++;openAucLive();return}
  clearInterval(AUCT);aucRivs(L);L.left=AUC_T0;
  if(!L.lead&&aucRivalTurn(L))L.msg=`${T(L.lead).name} abre com ${money(L.cur)}. Sua vez.`;else if(!L.msg)L.msg='Lances abertos. Sua vez.';
  aucPaint();
}
function aucTick(){clearInterval(AUCT)}
function aucBidLive(){
  const s=S.aucS;if(!s)return;const L=s.lots[s.i];if(!L||L.done||L.lead==='me')return;
  const nv=L.lead?+(L.cur+aucStep(L.cur)).toFixed(2):L.cur;
  if(T(S.me).cash<nv)return toast(`Sem caixa: faltam ${money(nv-T(S.me).cash)}.`);
  if(sqLen(S.me)>=34)return toast('Elenco cheio (34).');
  L.cur=nv;L.lead='me';
  if(aucRivalTurn(L)){L.msg=`Você ofereceu ${money(nv)} · ${T(L.lead).name} cobriu: ${money(L.cur)}. Sua vez.`;aucPaint();return}
  L.msg=`Ninguém cobre ${money(nv)}. Dou-lhe uma, dou-lhe duas…`;aucSell();
}
function aucPass(){
  const s=S.aucS;if(!s)return;const L=s.lots[s.i];if(!L||L.done||L.lead==='me')return;
  /* rivais disputam entre si até alguém desistir */
  let k=0;while(k++<30&&aucRivalTurn(L)){}
  aucSell();
}
