const pick=a=>a[Math.floor(R()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* dinheiro guardado em milhões; mostrado sempre redondo na centena (23 mil, 534.500, 12.534.500) */
function money(v){const r=Math.round(Math.abs(v)*1e4)*100;return (v<0?'−':'')+'R$ '+(r%1000===0&&r<1e6?(r/1000).toLocaleString('pt-BR')+' mil':r.toLocaleString('pt-BR'))}
const r100=v=>Math.round(v*1e4)/1e4;

function lum(h){h=(h||'#777').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);const r=(n>>16)&255,g=(n>>8)&255,b=n&255;return (.299*r+.587*g+.114*b)/255}
const light=c=>lum(c)>.82;

}

  return `<svg class="crest" viewBox="0 0 40 40" style="width:${s}px;height:${s}px" aria-hidden="true"><defs><clipPath id="${uid}"><circle cx="20" cy="20" r="18"/></clipPath><radialGradient id="${uid}g" cx="34%" cy="28%" r="80%"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".32"/></radialGradient></defs><g clip-path="url(#${uid})">${g}</g><circle cx="20" cy="20" r="18" fill="url(#${uid}g)" stroke="rgba(0,0,0,.45)" stroke-width="1.2"/></svg>`;
}
/* caixa colorida com o nome do time (lista de jogos) */
const tbox=id=>{const t=T(id),bg=bgOf(t);return `<span class="gt ${id===S.me?'mine':''}" style="background:${bg};color:${fgOn(bg)}">${esc(t.name)}</span>`};

/* ---------- jogadores ---------- */
let NID=1;
function mkPlayer(n,role,o,a,pot,tid,prom){
  const g=RG[role]||'M';
  const p={id:NID++,n,r:role,g,f:FZ(o),a,t:tid,star:0,prom:prom?1:0,beh:0,inj:0,sus:0,yc:0,gl:0,j:0,ev:0,f0:0,cg:{}};
  /* craque (*): os muito fortes, e alguns médios/avançados acima da média */
  if(p.f>=40||(g!=='G'&&g!=='D'&&p.f>=24&&R()<.12)||(g==='D'&&p.f>=30&&R()<.06))p.star=1;
  const rb=R();p.beh=rb<.1?0:rb<.35?1:rb<.75?2:rb<.93?3:4;
  p.f0=p.f;return p;
}
function genName(c){const es=c&&c!=='BRA';return `${pick(es?FN_ES:FN)} ${pick(es?LN_ES:LN)}`}
function genPlayer(tid,g,f,a){
  const role=g==='G'?'GOL':g==='D'?pick(['ZAG','ZAG','LD','LE']):g==='M'?pick(['VOL','MEI','MEI','MOF']):pick(['PD','PE','CA','CA']);
  const p=mkPlayer(genName(T(tid)&&T(tid).cty),role,45+clamp(f,1,50)*45/50,a,0,tid,a<=21&&R()<.25);
  p.f=clamp(Math.round(f),1,50);p.f0=p.f;return p;
}
/* completa elencos curtos: 2 goleiros, 6 defesas, 6 médios, 4 avançados no mínimo */
function fillSquad(tid,min=20){
  const sq=squad(tid);const avg=sq.length?sq.reduce((s,p)=>s+p.f,0)/sq.length:teamBaseF(tid);
  const need={G:2,D:6,M:6,A:4};
  for(const g of GORD){let k=sq.filter(p=>p.g===g).length;while(k<need[g]){addP(genPlayer(tid,g,avg-2+ri(-3,3),ri(18,31)));k++}}
  while(squad(tid).length<min)addP(genPlayer(tid,pick(['D','M','M','A']),avg-3+ri(-3,3),ri(18,30)));
}
function teamBaseF(tid){const t=T(tid);return clamp(Math.round((t.rep-35)*.55),3,40)}
function addP(p){S.players.push(p);PI.set(p.id,p);if(p.t){if(!SQ.has(p.t))SQ.set(p.t,[]);SQ.get(p.t).push(p)}}
/* força do time = média dos 14 melhores */
function teamF(tid){const a=squad(tid).map(p=>p.f).sort((x,y)=>y-x).slice(0,14);return a.length?a.reduce((s,x)=>s+x,0)/a.length:1}

/* ---------- montagem do mundo ---------- */
function buildWorld(){
  S.teams={};S.players=[];NID=1;
  const meta={};TEAMS.forEach(r=>meta[r[0]]=r);
  /* elencos do banco */
  const roster={};let tid=null;
  PDATA.split('\n').forEach(l=>{if(!l)return;if(l[0]==='#'){tid=l.slice(1);roster[tid]=[];return}roster[tid].push(l.split('|'))});
  const mkTeam=(id,cty)=>{const [_,name,code,c1,c2,cap,st,city,coach,reg,rep]=meta[id];
    S.teams[id]={id,name,code,c1,c2,rep,cty,cap:Math.max(3000,Math.round((cap||8000)/500)*500),stad:st,city,coach:coach||'Interino',div:0,
      cash:0,loan:0,price:0,moral:50,form:pick(['4-4-2','4-4-2','4-3-3','4-5-1','3-5-2','5-3-2','4-4-2']),last:[]}};
  /* Brasil: 64 clubes em 4 divisões de 16, pela força atual dos elencos */
  const brOrder=[...INIT.A,...INIT.B,...INIT.C,...INIT.Dg.flat()];
  const seen=new Set();const br=brOrder.filter(id=>meta[id]&&!seen.has(id)&&seen.add(id));
  const strength=id=>{const r=(roster[id]||[]).map(x=>+x[2]).sort((a,b)=>b-a).slice(0,14);return r.length?r.reduce((a,b)=>a+b,0)/r.length:40};
  /* divisão de origem pesa: A > B > C > D; dentro dela, a força decide */
  const tier=id=>INIT.A.includes(id)?0:INIT.B.includes(id)?1:INIT.C.includes(id)?2:3;
  const ranked=br.slice().sort((a,b)=>(tier(a)*9-strength(a)/4)-(tier(b)*9-strength(b)/4));
  ranked.slice(0,64).forEach((id,i)=>{mkTeam(id,'BRA');S.teams[id].div=1+Math.floor(i/16)});
  FORE.forEach(c=>INIT.EX[c].forEach(id=>{if(meta[id])mkTeam(id,c)}));
  Object.keys(S.teams).forEach(id=>{(roster[id]||[]).forEach(([n,rs,o,a,pot,ct,prom])=>{const p=mkPlayer(n,ROLES[+rs[0]],+o,+a,+pot,id,prom);S.players.push(p)})});
  reindex();
  Object.values(S.teams).forEach(t=>{
    fillSquad(t.id,20);
    const f=teamF(t.id);
    t.cash=r100(t.cty==='BRA'?[0,18,7,3,1.2][t.div]*(.7+t.rep/150):4+f/4);
    t.price=t.cty==='BRA'?[0,50,35,25,18][t.div]:25;
    t.cap=t.cty==='BRA'?clamp(t.cap,[0,25000,12000,6000,4000][t.div],80000):t.cap;
  });
  S.players.forEach(p=>{p.w=wageOf(p)});
  /* nível de referência de cada divisão/liga (âncora da evolução) */
  S.dt={};const acc={};Object.values(S.teams).forEach(t=>{const k=t.cty==='BRA'?'L'+t.div:'X-'+t.cty;(acc[k]=acc[k]||[]).push(teamF(t.id))});
  Object.entries(acc).forEach(([k,a])=>S.dt[k]=a.reduce((x,y)=>x+y,0)/a.length);
}

/* =====================================================================
   MOTOR DE PARTIDA (estilo Elifoot 98)
   - força de setor: defesa soma 2×F dos defesas, ataque 2×F dos avançados,
     médios dão F para cada lado; craque (*) +5.
   - a cada minuto: mandante cria lance com sorteio(6000), visitante com sorteio(7600);
     lance vira duelo atacante × defensor; vencendo, remate: gol, defesa, poste, barra ou fora.
   ===================================================================== */
const FORMS=['4-4-2','4-3-3','3-4-3','4-5-1','5-3-2','5-4-1','3-5-2','4-2-4','5-5-0','5-0-5','3-3-4','4-6-0'];
const ELB=.12,ZB=13,ZA=130,MAXSUB=3;
let MS=null; /* partida ao vivo */

/* escalação: melhores disponíveis para um esquema; falta num setor é coberta pelos melhores que sobrarem */
function pickXI(tid,form){
  const [d,m,a]=form.split('-').map(Number);
  const pool=squad(tid).filter(avail).sort((x,y)=>y.f-x.f||(y.star-x.star));
  const used=new Set();const take=(g,n)=>{const o=[];for(const p of pool){if(o.length>=n)break;if(!used.has(p.id)&&p.g===g){o.push(p.id);used.add(p.id)}}return o};
  const xi=[...take('G',1),...take('D',d),...take('M',m),...take('A',a)];
  for(const p of pool){if(xi.length>=11)break;if(!used.has(p.id)&&p.g!=='G'){xi.push(p.id);used.add(p.id)}}
  for(const p of pool){if(xi.length>=11)break;if(!used.has(p.id)){xi.push(p.id);used.add(p.id)}}
  return xi;
}
/* mantém a sua escalação válida (tira lesionados/suspensos/vendidos e repõe do mesmo setor) */
function fixMyXI(){
  const L=S.lineup;let xi=(L.xi||[]).filter(id=>{const p=P(id);return p&&p.t===S.me&&avail(p)});
  if(!L.xi||!L.xi.length){L.xi=pickXI(S.me,'4-4-2');return}
  const lost=(L.xi||[]).filter(id=>!xi.includes(id)).map(id=>{const p=P(id);return p?p.g:'M'});
  const free=()=>squad(S.me).filter(p=>avail(p)&&!xi.includes(p.id)).sort((a,b)=>b.f-a.f);
  for(const g of lost){if(xi.length>=11)break;const c=(!xi.some(id=>P(id).g==='G')?free().find(p=>p.g==='G'):null)||free().find(p=>p.g===g)||free().find(p=>p.g!=='G')||free()[0];if(c)xi.push(c.id)}
  L.xi=xi.slice(0,11);
}
const xiOf=t=>t===S.me?S.lineup.xi.filter(id=>P(id)&&avail(P(id))):pickXI(t,T(t).form);
function formOf(ids){const c=g=>ids.filter(id=>P(id)&&P(id).g===g).length;return `${c('D')}-${c('M')}-${c('A')}`}

/* árbitro: o rigor muda a quantidade de cartões */
const REFN=['Anselmo Vaz','Wilson Seixas','Carlos Bittencourt','Rui Matoso','Edgar Pimenta','Sávio Lacerda','Jonas Rebouças','Heitor Alvim','Clóvis Brandão','Nelson Paixão','Otávio Sena','Ismael Faro','Paulo Quintela','Gerson Ribas','Mário Cotrim','Álvaro Teles'];
function refFor(h,a){const k=(String(h).length*7+(+h%97)*31+(+a%89)*17+S.d*7)%REFN.length;const rig=[.7,.85,1,1,1,1.15,1.3,1.5][(+h+(+a)+S.d)%8];return{n:REFN[k],r:rig}}

function secOf(on){
  let att=0,def=0;const A=[],D=[];let gk=null;
  on.forEach(id=>{const p=P(id);if(!p)return;const f=p.f+(p.star?5:0),w=p.star?2.2:1;
    if(p.g==='G'){if(!gk||p.f>gk.f)gk=p;D.push([p,.25]);return}
    if(p.g==='D'){def+=f*2;D.push([p,1]);A.push([p,.12*w])}
    else if(p.g==='M'){att+=f;def+=f;A.push([p,.55*w]);D.push([p,.5])}
    else{att+=f*2;A.push([p,w]);D.push([p,.1])}});
  return{att,def,A,D,gk};
}
function wsel(list){const tot=list.reduce((s,x)=>s+x[1],0);let r=R()*tot;for(const x of list){r-=x[1];if(r<=0)return x[0]}return list.length?list[list.length-1][0]:null}

/* c: competição (id), neu: campo neutro */
function makeMatch(h,a,c,neu){
  const xh=xiOf(h),xa=xiOf(a);
  return{c,h,a,neu:!!neu,ref:refFor(h,a),on:{[h]:xh.slice(),[a]:xa.slice()},app:{[h]:xh.slice(),[a]:xa.slice()},subs:{[h]:0,[a]:0},down:{[h]:0,[a]:0},
    left:{[h]:[],[a]:[]},gap:{[h]:0,[a]:0},yc:{},gh:0,ga:0,min:0,ev:[],dirty:true,end:90+ri(1,4),pub:0};
}
function stepMatch(m){
  m.min++;
  if(m.dirty||!m.sec){m.sec={[m.h]:secOf(m.on[m.h]),[m.a]:secOf(m.on[m.a])};
    /* moral: −8% (péssima) a +8% (excelente) */
    for(const t of [m.h,m.a]){const k=.92+.16*clamp(T(t).moral/100,0,1);m.sec[t].att*=k;m.sec[t].def*=k}
    m.dirty=false}
  const anti=t=>{const d=t===m.h?m.gh-m.ga:m.ga-m.gh;return d>=2?Math.pow(.66,d-1):1};
  const dh=m.neu?6500:6000,da=m.neu?6500:7600;const SH=m.sec[m.h],SA=m.sec[m.a];
  const pc=(x,y,d)=>ELB*(6000/d)*(2*(x.att+ZA)/Math.max(1,x.att+y.def+2*ZA));
  if(R()<pc(SH,SA,dh)*anti(m.h))chance(m,m.h);
  if(R()<pc(SA,SH,da)*anti(m.a))chance(m,m.a);
  if(R()<1/2400)luckyGoal(m,m.h);else if(R()<1/3600)luckyGoal(m,m.a);
  const rig=m.ref.r;
  for(const t of [m.h,m.a]){if(R()<.017*rig)card(m,t,false);if(R()<.0006*rig)card(m,t,true);if(R()<.0022)injure(m,t)}
}
function chance(m,t){
  const o=t===m.h?m.a:m.h;const S1=m.sec[t],S2=m.sec[o];if(!S1.A.length)return;
  const atk=wsel(S1.A);if(!atk||R()<.25)return;
  const dfd=wsel(S2.D);const fa=atk.f+(atk.star?7:0),fd=dfd?dfd.f:1;
  if(R()*(fa+ZB)<=R()*(fd+ZB)*1.05)return;
  if(R()<.045){penalty(m,t);return}
  const gk=S2.gk;const fg=gk?gk.f:1;const onT=R()<.62;
  if(onT&&R()*(fa*1.05+ZB+(atk.star?5:0))>R()*(fg*1.15+ZB)){goalBy(m,t,atk);return}
  if(m.live){const x=R();m.ev.push({min:m.min,t,k:'ch',n:`${atk.n}: ${onT?(x<.8?'defende '+(gk?gk.n:'o goleiro'):'no poste!'):(x<.25?'na barra!':x<.4?'no poste!':'para fora')}`})}
}
function goalBy(m,t,p,pen){if(t===m.h)m.gh++;else m.ga++;m.ev.push({min:m.min,t,k:pen?'pg':'gol',n:p.n,id:p.id})}
function luckyGoal(m,t){const S1=m.sec[t];const p=S1.A.length?wsel(S1.A):P(m.on[t][0]);if(p)goalBy(m,t,p)}
function penChance(m,t,p){const o=t===m.h?m.a:m.h;const gk=m.sec&&m.sec[o]&&m.sec[o].gk;const g=gk?gk.f:20;
  return clamp(.72+(p.f-28)*.006+(p.star?.08:0)-(p.g==='G'?.3:0)-(g-28)*.004,.35,.92)}
function bestTaker(m,t){return m.on[t].map(P).filter(Boolean).sort((a,b)=>penChance(m,t,b)-penChance(m,t,a))[0]}
function penalty(m,t){
  /* no seu jogo ao vivo, você escolhe o batedor */
  if(m.live&&t===S.me&&MS&&MS.mine===m&&!MS.skip){MS.pen={t,min:m.min};return}
  const p=bestTaker(m,t);if(p)resolvePen(m,t,p);
}
function resolvePen(m,t,p){
  if(R()<penChance(m,t,p))goalBy(m,t,p,true);
  else m.ev.push({min:m.min,t,k:'pp',n:p.n+(R()<.6?' (defendido)':' (para fora)')});
}
function takeOff(m,t,id){m.on[t]=m.on[t].filter(x=>x!==id);m.left[t].push(id);m.dirty=true}
function card(m,t,red){
  const on=m.on[t].map(P).filter(p=>p&&p.g!=='G');if(!on.length)return;
  const p=wsel(on.map(x=>[x,CARDW[x.beh]]));if(!p)return;
  if(!red){m.yc[p.id]=(m.yc[p.id]||0)+1;
    if(m.yc[p.id]<2){m.ev.push({min:m.min,t,k:'am',n:p.n,id:p.id});
      /* 3º amarelo acumulado: suspenso no próximo jogo (vale depois da partida) */
      p.yc=(p.yc||0)+1;if(p.yc>=3){p.yc=0;(m.ysus=m.ysus||[]).push(p.id)}return}}
  m.ev.push({min:m.min,t,k:'vm',n:p.n,id:p.id});(m.rsus=m.rsus||[]).push(p.id);takeOff(m,t,p.id);m.down[t]++;
}
function injure(m,t){
  const on=m.on[t].map(P).filter(Boolean);if(!on.length)return;const p=pick(on);
  p.inj=ri(1,4);p.f=Math.max(1,p.f-3);p.ev=-1;p.evd=S.d;
  m.ev.push({min:m.min,t,k:'les',n:p.n,id:p.id});takeOff(m,t,p.id);
  if(m.live&&t===S.me&&MS&&MS.mine===m&&!MS.skip){m.gap[t]++;MS.paused=true;MS.why='les';return}
  autoSub(m,t,p.g);
}
function bench(m,t){const on=new Set(m.on[t]);return squad(t).filter(p=>avail(p)&&!on.has(p.id)&&!m.left[t].includes(p.id)&&!m.app[t].includes(p.id)&&!(m.rsus||[]).includes(p.id))}
function autoSub(m,t,g){
  if(m.subs[t]>=MAXSUB)return;const b=bench(m,t).sort((x,y)=>((y.g===g)-(x.g===g))||y.f-x.f);if(!b.length)return;
  doSub(m,t,null,b[0].id);
}
function doSub(m,t,outId,inId){
  if(outId)takeOff(m,t,outId);
  m.on[t].push(inId);m.app[t].push(inId);m.subs[t]++;m.dirty=true;
  m.ev.push({min:m.min,t,k:'sub',n:`Entra ${P(inId).n}`+(outId?`, sai ${P(outId).n}`:'')});
}
/* IA: troca cansados/perdendo no 2º tempo */
function aiSubs(m,t){
  if(m.subs[t]>=MAXSUB||m.min<60||R()>.05)return;
  const lose=(t===m.h?m.gh-m.ga:m.ga-m.gh)<0;const on=m.on[t].map(P).filter(p=>p&&p.g!=='G');if(!on.length)return;
  const out=on.sort((a,b)=>a.f-b.f)[0];const want=lose?'A':out.g;
  const b=bench(m,t).sort((x,y)=>((y.g===want)-(x.g===want))||y.f-x.f)[0];if(b&&b.f>=out.f-4)doSub(m,t,out.id,b.id);
}
function playAll(m){while(m.min<m.end){stepMatch(m);if(m.min>=60){aiSubs(m,m.h);aiSubs(m,m.a)}}return m}
/* disputa de pênaltis */
function shootout(m){
  const tk=t=>m.on[t].map(P).filter(Boolean).sort((a,b)=>penChance(m,t,b)-penChance(m,t,a));
  const H=tk(m.h),A=tk(m.a);let sh=0,sa=0;const seq=[];
  for(let i=0;i<20;i++){
    const ph=H[i%H.length],pa=A[i%A.length];
    const gh=R()<penChance(m,m.h,ph)-.04,ga=R()<penChance(m,m.a,pa)-.04;
    sh+=gh;seq.push({t:m.h,n:ph.n,ok:gh});
    if(i<5&&(sh>sa+(5-i)||sa>sh+(5-i)))break;
    sa+=ga;seq.push({t:m.a,n:pa.n,ok:ga});
    if(i<5&&(sh>sa+(4-i)||sa>sh+(4-i)))break;
    if(i>=4&&sh!==sa)break;
  }
  m.pens=[sh,sa];m.so=seq;return sh>sa?m.h:m.a;
}

/* =====================================================================
   TEMPORADA: campeonatos, taças, calendário, jornadas e fim de época
   ===================================================================== */
const COMPN={L1:'1ª Divisão',L2:'2ª Divisão',L3:'3ª Divisão',L4:'4ª Divisão',T:'Taça do Brasil',LIB:'Libertadores',SUD:'Sul-Americana'};
const compName=c=>COMPN[c]||(c.startsWith('X-')?LGN[c.slice(2)]:c);
const KO_N={64:'1ª eliminatória',32:'2ª eliminatória',16:'Oitavas',8:'Quartas',4:'Semifinal',2:'Final'};
const CONT_N={32:'16-avos',16:'Oitavas',8:'Quartas',4:'Semifinal',2:'Final'};
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const DIA=['dom','seg','ter','qua','qui','sex','sáb'];

/* ---------- tabelas ---------- */
const row0=id=>({id,J:0,V:0,E:0,D:0,GP:0,GC:0,P:0});
function roundRobin(ids,double){
  const a=ids.slice();if(a.length%2)a.push(null);const n=a.length,rounds=[];
  for(let r=0;r<n-1;r++){const pr=[];for(let i=0;i<n/2;i++){const x=a[i],y=a[n-1-i];if(x&&y)pr.push(r%2?[y,x]:[x,y])}rounds.push(pr);a.splice(1,0,a.pop())}
  shuffle(rounds);
  return double?rounds.concat(rounds.map(r=>r.map(([h,a])=>[a,h]))):rounds;
}
function mkLeague(ids,double){const tb={};ids.forEach(id=>tb[id]=row0(id));return{ids:ids.slice(),fx:roundRobin(ids,double),tb}}
function sortTable(lg){return Object.values(lg.tb).sort((x,y)=>y.P-x.P||y.V-x.V||(y.GP-y.GC)-(x.GP-x.GC)||y.GP-x.GP||T(y.id).rep-T(x.id).rep)}
function addRes(lg,h,a,gh,ga){const H=lg.tb[h],A=lg.tb[a];if(!H||!A)return;H.J++;A.J++;H.GP+=gh;H.GC+=ga;A.GP+=ga;A.GC+=gh;
  if(gh>ga){H.V++;H.P+=3;A.D++}else if(gh<ga){A.V++;A.P+=3;H.D++}else{H.E++;A.E++;H.P++;A.P++}}

/* ---------- taças (mata-mata) ---------- */
function drawTies(ids,avoidCty){
  let a=shuffle(ids.slice());
  if(avoidCty){for(let k=0;k<40;k++){let bad=-1;for(let i=0;i<a.length;i+=2)if(T(a[i]).cty===T(a[i+1]).cty){bad=i;break}if(bad<0)break;const j=ri(0,a.length-1);[a[bad+1],a[j]]=[a[j],a[bad+1]]}}
  const ties=[];for(let i=0;i<a.length;i+=2)ties.push({a:a[i],b:a[i+1],l1:null,l2:null,w:null});return ties;
}
function mkCup(ids,legs,cont){return{ids:ids.slice(),legs,cont:!!cont,r:0,rounds:[{n:ids.length,ties:drawTies(ids,cont)}],champ:null,out:{}}}
/* jogo único da Taça: manda o clube de divisão mais baixa (ou sorteio) */
function tieHome(t){const da=T(t.a).div||9,db=T(t.b).div||9;return db>da?[t.b,t.a]:da>db?[t.a,t.b]:[t.a,t.b]}

/* ---------- calendário: 30 jornadas de liga (domingos) + 16 de meio de semana ---------- */
function mkCalendar(year){
  const cal=[];let d=new Date(year,1,1);while(d.getDay()!==0)d.setDate(d.getDate()+1);
  /* meio de semana: T = Taça, I = rodada continental (ida/volta) */
  const mid={2:['T',0],3:['I',0,0],5:['I',0,1],6:['T',1],8:['I',1,0],10:['I',1,1],11:['T',2],13:['I',2,0],15:['I',2,1],16:['T',3],18:['I',3,0],20:['I',3,1],22:['T',4],24:['I',4,0],26:['I',4,1],28:['T',5]};
  for(let w=0;w<30;w++){
    const sun=new Date(d);sun.setDate(d.getDate()+w*7);
    cal.push({k:'L',r:w,y:sun.getFullYear(),m:sun.getMonth(),dd:sun.getDate(),wd:0});
    if(mid[w+1]){const x=mid[w+1];const wed=new Date(sun);wed.setDate(sun.getDate()+3);
      cal.push(x[0]==='T'?{k:'T',r:x[1],y:wed.getFullYear(),m:wed.getMonth(),dd:wed.getDate(),wd:3}:{k:'I',r:x[1],leg:x[2],y:wed.getFullYear(),m:wed.getMonth(),dd:wed.getDate(),wd:3})}
  }
  return cal;
}
const dateTxt=c=>c?`${DIA[c.wd]} ${c.dd} ${MES[c.m]}`:'';

/* ---------- início de temporada ---------- */
function startSeason(cont){
  S.lg={};S.d=0;S.cal=mkCalendar(S.season);
  DIVS.forEach(k=>S.lg['L'+k]=mkLeague(Object.values(S.teams).filter(t=>t.cty==='BRA'&&t.div===k).map(t=>t.id),true));
  FORE.forEach(c=>S.lg['X-'+c]=mkLeague(Object.values(S.teams).filter(t=>t.cty===c).map(t=>t.id),false));
  S.cups={T:mkCup(Object.values(S.teams).filter(t=>t.cty==='BRA').map(t=>t.id),1,false)};
  const lib=cont?cont.LIB:contInit('LIB'),sud=cont?cont.SUD:contInit('SUD');
  S.cups.LIB=mkCup(lib,2,true);S.cups.SUD=mkCup(sud,2,true);
  S.players.forEach(p=>{p.gl=0;p.j=0;p.cg={};p.yc=0;p.f0=p.f;p.sus=0});
  S.sea={inc:{},exp:{},pub:0,hm:0};S.res={};
  S.lineup.xi=S.lineup.xi||[];fixMyXI();
}
/* 1ª temporada: vagas continentais pela força atual */
function contInit(k){
  const out=[];
  Object.keys(CONTQ).forEach(c=>{
    const ids=Object.values(S.teams).filter(t=>t.cty===c&&(c!=='BRA'||t.div===1)).sort((a,b)=>teamF(b.id)+b.rep/10-teamF(a.id)-a.rep/10).map(t=>t.id);
    const q=CONTQ[c];out.push(...(k==='LIB'?ids.slice(0,q):ids.slice(q,2*q)));
  });
  return out.slice(0,32);
}

/* ---------- jogos de uma data ---------- */
function fixturesOf(c){
  const out=[];
  if(c.k==='L'){
    Object.entries(S.lg).forEach(([k,lg])=>{const fx=lg.fx[c.r];if(fx)fx.forEach(([h,a])=>out.push({c:k,h,a}))});
  }else if(c.k==='T'){
    const cup=S.cups.T;if(cup.r===c.r&&!cup.champ){const rd=cup.rounds[cup.r];rd.ties.forEach((t,i)=>{const [h,a]=tieHome(t);out.push({c:'T',h,a,tie:i,neu:rd.ties.length===1})})}
  }else{
    ['LIB','SUD'].forEach(k=>{const cup=S.cups[k];if(cup.r===c.r&&!cup.champ){cup.rounds[cup.r].ties.forEach((t,i)=>out.push({c:k,h:c.leg?t.b:t.a,a:c.leg?t.a:t.b,tie:i,leg:c.leg}))}});
  }
  return out;
}
const myFix=fx=>fx.find(x=>x.h===S.me||x.a===S.me);

/* ---------- simula / aplica uma data ---------- */
/* prepara: joga tudo o que não é seu; o seu jogo fica para ao vivo (ou é jogado também) */
function prepDate(liveMine){
  const c=S.cal[S.d];const fx=fixturesOf(c);
  const mine=myFix(fx);
  fixMyXI();
  const res=fx.map(f=>{const m=makeMatch(f.h,f.a,f.c,f.neu);m.f=f;if(f===mine&&liveMine){m.live=true;return m}return playAll(m)});
  return{c,res,mine:mine?res[fx.indexOf(mine)]:null};
}
function simDate(){const D=prepDate(false);if(D.mine)playAll(D.mine);finishDate(D);return D}

/* fim de uma data: tabelas, taças, gols, cartões, lesões, evolução, moral, finanças */
function finishDate(D){
  const c=D.c;const played=new Set(),app=new Set();
  /* suspensões antigas cumprem-se nesta data; lesões contam por data */
  D.res.forEach(m=>{played.add(m.h);played.add(m.a)});
  played.forEach(t=>squad(t).forEach(p=>{if(p.sus>0)p.sus--}));
  S.players.forEach(p=>{if(p.inj>0&&p.t&&played.has(p.t))p.inj--});
  D.res.forEach(m=>{
    const f=m.f;
    /* desempate na Taça (jogo único) e na volta continental */
    if(f.c==='T'){const cup=S.cups.T;const t=cup.rounds[cup.r].ties[f.tie];t.l1=[m.h,m.gh,m.ga];
      if(m.gh===m.ga&&!m.pens)shootout(m);t.w=m.gh>m.ga?m.h:m.ga>m.gh?m.a:(m.pens[0]>m.pens[1]?m.h:m.a);t.pens=m.pens||null}
    else if(f.c==='LIB'||f.c==='SUD'){const cup=S.cups[f.c];const t=cup.rounds[cup.r].ties[f.tie];
      if(!f.leg)t.l1=[m.h,m.gh,m.ga];else{t.l2=[m.h,m.gh,m.ga];
        const ga=(t.l1[0]===t.a?t.l1[1]:t.l1[2])+(m.h===t.a?m.gh:m.ga),gb=(t.l1[0]===t.b?t.l1[1]:t.l1[2])+(m.h===t.b?m.gh:m.ga);
        m.agg=[ga,gb];if(ga===gb&&!m.pens)shootout(m);t.agg=[ga,gb];t.pens=m.pens||null;
        t.w=ga>gb?t.a:gb>ga?t.b:(m.pens[0]>m.pens[1]?m.h:m.a)}}
    else addRes(S.lg[f.c],m.h,m.a,m.gh,m.ga);
    /* gols e cartões */
    m.ev.forEach(e=>{if((e.k==='gol'||e.k==='pg')&&e.id){const p=P(e.id);if(p){p.gl++;p.cg[f.c]=(p.cg[f.c]||0)+1}}});
    (m.ysus||[]).forEach(id=>{const p=P(id);if(p)p.sus=Math.max(p.sus,1)});
    (m.rsus||[]).forEach(id=>{const p=P(id);if(p)p.sus=Math.max(p.sus,ri(1,2))});
    [m.h,m.a].forEach(t=>m.app[t].forEach(id=>{const p=P(id);if(p){p.j++;app.add(id)}}));
    /* moral */
    const gd=m.gh-m.ga;[[m.h,gd],[m.a,-gd]].forEach(([t,d])=>{const x=T(t);x.moral=clamp(x.moral+(d>0?7:d<0?-7:-1)+(50-x.moral)*.04,5,95);x.last=(x.last||[]).concat(d>0?'V':d<0?'D':'E').slice(-5)});
    /* bilheteira */
    gate(m);
    if(m.h===S.me||m.a===S.me)S.lastM={c:f.c,h:m.h,a:m.a,gh:m.gh,ga:m.ga,pens:m.pens||null,agg:m.agg||null,d:S.d};
  });
  /* diretoria */
  if(D.mine){const m=D.mine;const d=(m.h===S.me?1:-1)*(m.gh-m.ga);S.sat=clamp(S.sat+(d>0?2:d<0?-2.5:-.3),0,100);S.streak=d<0?(S.streak||0)+1:0}
  roundDev(played,app);
  advanceCups(c);
  S.d++;
  const nx=S.cal[S.d];
  if(c.k==='L')monthTick();
  aiMarket();
  maybeAuction();
  checkFired();
  if(S.d>=S.cal.length)endSeason();
}
/* taças: quando a rodada termina, sorteia a próxima */
function advanceCups(c){
  const go=k=>{const cup=S.cups[k];const rd=cup.rounds[cup.r];if(!rd||rd.ties.some(t=>!t.w))return;
    const ws=rd.ties.map(t=>t.w);rd.ties.forEach(t=>{const l=t.w===t.a?t.b:t.a;cup.out[l]=rd.n});
    payCupRound(k,ws,rd.n);
    if(ws.length===1){cup.champ=ws[0];cup.out[ws[0]]=1;onTitle(k,ws[0]);return}
    cup.r++;cup.rounds.push({n:ws.length,ties:drawTies(ws,false)});
    if(ws.includes(S.me))news(`${compName(k)}: sorteio da ${(k==='T'?KO_N:CONT_N)[ws.length]} — ${(()=>{const t=cup.rounds[cup.r].ties.find(t=>t.a===S.me||t.b===S.me);return t?T(t.a).name+' × '+T(t.b).name:''})()}.`);
  };
  if(c.k==='T')go('T');
  if(c.k==='I'&&c.leg===1){go('LIB');go('SUD')}
}

/* ---------- títulos ---------- */
function onTitle(k,id){
  S.titles.push({season:S.season,c:k,id});
  if(id===S.me){news(`🏆 CAMPEÃO: ${compName(k)}!`);S.sat=clamp(S.sat+15,0,100);T(id).moral=95;(UI.champQ=UI.champQ||[]).push({c:k,season:S.season})}
  else if(T(id).cty==='BRA')news(`${T(id).name} conquista a ${compName(k)}.`);
}

/* ---------- fim de temporada ---------- */
function endSeason(){
  const tabs={};DIVS.forEach(k=>tabs[k]=sortTable(S.lg['L'+k]).map(r=>r.id));
  const fore={};FORE.forEach(c=>fore[c]=sortTable(S.lg['X-'+c]).map(r=>r.id));
  /* campeões das ligas e prêmios */
  DIVS.forEach(k=>{onTitle('L'+k,tabs[k][0]);const [top,base]=[[0,12,5,2,.8][k],[0,2,.8,.3,.12][k]];tabs[k].forEach((id,i)=>award(id,top*(15-i)/15+base,'Prêmio da liga'))});
  FORE.forEach(c=>{onTitle('X-'+c,fore[c][0]);fore[c].forEach((id,i)=>award(id,3*(fore[c].length-1-i)/fore[c].length+.5,'Prêmio da liga'))});
  /* minha temporada */
  const me=T(S.me);const myDiv=me.div;const pos=me.cty==='BRA'?tabs[myDiv].indexOf(S.me)+1:0;
  const exp=expectedPos(S.me);
  S.sat=clamp(S.sat+(pos<=exp-3?14:pos<=exp?8:pos<=exp+3?-4:-14),0,100);
  /* acesso e descenso: 3 sobem, 3 descem (a 4ª não cai) */
  const moved={};
  for(let k=1;k<4;k++){const down=tabs[k].slice(-UPDN),up=tabs[k+1].slice(0,UPDN);down.forEach(id=>{T(id).div=k+1;moved[id]='dn'});up.forEach(id=>{T(id).div=k;moved[id]='up'})}
  /* vagas continentais do ano que vem */
  const tw=S.cups.T.champ;
  const br=tabs[1].slice();const libBR=[];if(tw&&T(tw).div<=2)libBR.push(tw);for(const id of br){if(libBR.length>=CONTQ.BRA)break;if(!libBR.includes(id))libBR.push(id)}
  const sudBR=br.filter(id=>!libBR.includes(id)).slice(0,CONTQ.BRA);
  const LIB=[...libBR],SUD=[...sudBR];
  FORE.forEach(c=>{LIB.push(...fore[c].slice(0,CONTQ[c]));SUD.push(...fore[c].slice(CONTQ[c],2*CONTQ[c]))});
  const lc=S.cups.LIB.champ;if(lc&&!LIB.includes(lc)){LIB[LIB.length-1]=lc}
  /* resumo */
  const top=S.players.filter(p=>p.t&&T(p.t).cty==='BRA').sort((a,b)=>(b.cg.L1||0)-(a.cg.L1||0))[0];
  UI.summary={season:S.season,pos,div:myDiv,moved:moved[S.me]||null,exp,tabs,champs:['L1','L2','L3','L4','T','LIB','SUD'].map(k=>[k,/^L\d$/.test(k)?tabs[+k[1]][0]:S.cups[k].champ]).filter(x=>x[1]),
    art:top?`${top.n} (${top.cg.L1||0} gols)`:'—',moves:moved,lib:LIB.includes(S.me),sud:SUD.includes(S.me),cash:me.cash};
  S.hist.push({season:S.season,club:S.me,div:myDiv,pos,titles:S.titles.filter(t=>t.season===S.season&&t.id===S.me).map(t=>compName(t.c))});
  const jp={pos,exp,up:moved[S.me]==='up',tit:S.titles.filter(t=>t.season===S.season&&t.id===S.me).length};
  S.lastSea=S.sea;
  /* IA: caixa muito acima da folha anual vira investimento (base, estrutura) */
  Object.values(S.teams).forEach(t=>{if(t.id===S.me)return;const pay=squad(t.id).reduce((s,p)=>s+wage(p),0)*12;if(t.cash>pay*1.5)t.cash=r100(pay*1.5+(t.cash-pay*1.5)*.5)});
  newYear();
  S.season++;
  startSeason({LIB:LIB.slice(0,32),SUD:SUD.slice(0,32)});
  S.jobOff=jobOffers(jp);
  news(`Começa a temporada ${S.season}.`);
  save();
}
/* posição esperada: ranking de força dentro da divisão */
function expectedPos(id){const t=T(id);if(t.cty!=='BRA')return 8;const ids=Object.values(S.teams).filter(x=>x.cty==='BRA'&&x.div===t.div).sort((a,b)=>teamF(b.id)-teamF(a.id)).map(x=>x.id);return ids.indexOf(id)+1}
/* virada de ano: idade, aposentadorias, base, recompõe elencos */
function newYear(){
  const gone=new Set();
  S.players.forEach(p=>{p.a++;if(p.a>=(p.star?33:30))p.f=Math.max(1,p.f-ri(0,2));if(p.a>=37||(p.a>=34&&R()<.25)){gone.add(p.id);if(p.t===S.me)news(`${p.n} pendura as chuteiras.`)}});
  S.players=S.players.filter(p=>!gone.has(p.id));
  /* livres demais saem do jogo */
  const fa=S.players.filter(p=>!p.t).sort((a,b)=>b.f-a.f);fa.slice(200).forEach(p=>gone.add(p.id));S.players=S.players.filter(p=>!gone.has(p.id));
  reindex();
  if(S.lineup)S.lineup.xi=S.lineup.xi.filter(id=>PI.has(id));
  /* revelações da base: 2 garotos por clube (o seu também) */
  Object.keys(S.teams).forEach(id=>{const b=teamF(id);for(let i=0;i<2;i++){const p=genPlayer(id,pick(['G','D','D','M','M','A','A']),b*.85+ri(-3,3),ri(16,18));p.prom=R()<.35?1:0;if(R()<.05)p.star=1;p.w=wageOf(p);addP(p);if(id===S.me)news(`Base: ${p.n} (${GN[p.g]}, ${p.f}) sobe ao profissional.`)}});
  /* IA enxuga elencos grandes: os piores vão para o mercado de livres */
  Object.keys(S.teams).forEach(id=>{if(id===S.me)return;const sq=squad(id).slice().sort((a,b)=>a.f-b.f);let n=sq.length-25;for(const p of sq){if(n<=0)break;if(squad(id).filter(x=>x.g===p.g).length>(p.g==='G'?2:5)){moveP(p,null);n--}}});
  Object.keys(S.teams).forEach(id=>fillSquad(id,18));
  S.players.forEach(p=>{if(p.w==null)p.w=wageOf(p)});
}

/* =====================================================================
   CLUBE: finanças, mercado, leilão, evolução, moral e carreira do técnico
   ===================================================================== */
function news(s){const c=S.cal&&S.cal[Math.min(S.d,S.cal.length-1)];S.news.unshift({r:c?`${c.dd}/${c.m+1}`:'',s});S.news=S.news.slice(0,60)}
function book(id,k,v){if(id!==S.me||!S.sea)return;const o=v>=0?S.sea.inc:S.sea.exp;o[k]=r100((o[k]||0)+Math.abs(v))}
function award(id,v,k){const t=T(id);t.cash=r100(t.cash+v);book(id,k||'Prêmios',v)}

/* ---------- bilheteira ---------- */
const refPrice=t=>t.cty==='BRA'?[0,50,35,25,18][t.div]||20:25;
function gate(m){
  const h=T(m.h),a=T(m.a);
  const big=m.f.c==='LIB'||m.f.c==='SUD'?1.35:m.f.c==='T'?1.1:1;
  let fill=(.12+h.rep/220+(h.moral-50)/250+(teamF(m.a)-20)/150)*big;
  fill*=Math.pow(refPrice(h)/Math.max(1,h.price),1.15);
  const pub=Math.round(clamp(fill,.05,1)*h.cap);m.pub=pub;
  const rev=r100(pub*h.price/1e6);
  if(m.neu){award(m.h,rev/2,'Bilheteira');award(m.a,rev/2,'Bilheteira')}else award(m.h,rev,'Bilheteira');
  if(m.h===S.me&&S.sea){S.sea.pub+=pub;S.sea.hm++;S.lastGate={pub,rev,cap:h.cap,price:h.price}}
}
/* ---------- mês: salários, TV, patrocínio, juros ---------- */
const tvOf=t=>t.cty==='BRA'?[0,1.0,.6,.4,.25][t.div]:.3+t.rep/300;
const spOf=t=>r100((t.cty==='BRA'?[0,.5,.3,.18,.12][t.div]:.2)*(.6+t.rep/120));
/* valores mensais pagos em parcelas a cada jornada de liga (12 meses ÷ 30 jornadas) */
const PERR=.4;
function monthTick(){
  Object.values(S.teams).forEach(t=>{
    const w=r100(squad(t.id).reduce((s,p)=>s+wage(p),0)*PERR);
    const tv=r100(tvOf(t)*PERR),sp=r100(spOf(t)*PERR),juro=r100(t.loan*.02*PERR);
    t.cash=r100(t.cash+tv+sp-w-juro);
    if(t.id===S.me){book(S.me,'TV',tv);book(S.me,'Patrocínio',sp);book(S.me,'Salários',-w);if(juro)book(S.me,'Juros',-juro);
      if(t.cash<0&&R()<.3){t.moral=clamp(t.moral-4,5,95);news(`Caixa no vermelho (${money(t.cash)}): o elenco se preocupa com os salários.`)}}
    else if(t.cash<-1){aiSellToSurvive(t)}
  });
}
const loanLimit=t=>r100(Math.max(.5,(tvOf(t)+spOf(t))*8));
function takeLoan(v){const t=T(S.me);v=r100(Math.min(v,loanLimit(t)-t.loan));if(v<=0)return toast('Limite do banco atingido.');t.loan=r100(t.loan+v);t.cash=r100(t.cash+v);book(S.me,'Empréstimo',v);news(`Empréstimo de ${money(v)} (juros de 2% ao mês).`);save();render()}
function payLoan(v){const t=T(S.me);v=r100(Math.min(v,t.loan,Math.max(0,t.cash)));if(v<=0)return toast('Sem caixa para pagar.');t.loan=r100(t.loan-v);t.cash=r100(t.cash-v);news(`Pagou ${money(v)} ao banco.`);save();render()}
/* estádio: ampliação em lotes de 2.000 lugares */
const SEATC=.0011; /* custo por lugar, em milhões */
function expand(){const t=T(S.me);const c=r100(2000*SEATC*(1+t.cap/60000));if(t.cap>=90000)return toast('Estádio no limite.');if(t.cash<c)return toast(`Falta caixa: a obra custa ${money(c)}.`);t.cash=r100(t.cash-c);t.cap+=2000;book(S.me,'Obras',-c);news(`Estádio ampliado para ${t.cap.toLocaleString('pt-BR')} lugares.`);save();render()}
function setPrice(d){const t=T(S.me);t.price=clamp(t.price+d,5,300);save();render()}

/* ---------- prêmios das taças ---------- */
function payCupRound(k,ws,n){
  const tab=k==='T'?{64:.15,32:.25,16:.4,8:.7,4:1.2,2:2.5}:{32:.8,16:1.2,8:2,4:3.5,2:6};
  const champ=k==='T'?6:k==='LIB'?15:7;const mult=k==='SUD'?.5:1;
  ws.forEach(id=>award(id,r100((n===2?champ:tab[n])*mult),k==='T'?'Taça':'Copas'));
  if(ws.includes(S.me)&&n>2)news(`💰 ${compName(k)}: classificado, +${money(r100(tab[n]*mult))}.`);
}

/* ---------- evolução (estilo Elifoot): parado sobe, jogando oscila e tende a cair devagar;
   quanto mais forte, mais rápido sobe; craque (*) bem mais rápido ---------- */
const DVP={pu:.13,pd:.23,ru:[.3,.22,.14,.06],rd:[.13,.13,.15,.19],a:.9,b:.2,s:1.7,sd:.75,pr:1.4};
/* âncora (como no clássico): o nível médio de cada divisão/liga fica estável ao longo dos anos;
   time acima do nível da divisão evolui um pouco menos, abaixo um pouco mais */
function anchorOf(tid){const t=T(tid);const k=t.cty==='BRA'?'L'+t.div:'X-'+t.cty;const ref=S.dt&&S.dt[k];if(!ref)return 0;return clamp((ref-teamF(tid))/12,-.45,.45)}
function devPlayer(p,played,adj){adj=adj||0;
  const old=p.a>=(p.star?35:33);let up,dn;
  if(played){up=DVP.pu;dn=DVP.pd}else{const k=p.a<=25?0:p.a<=29?1:p.a<=32?2:3;up=DVP.ru[k];dn=DVP.rd[k]}
  up*=DVP.a+p.f/50*DVP.b;
  if(p.star){up*=DVP.s;dn*=DVP.sd}else if(p.prom&&p.a<=25)up*=DVP.pr;
  if(old){up*=.4;dn+=.1}
  up*=1+adj;dn*=1-adj;
  if(p.inj>0)up=0;
  const r=R();return r<dn?-1:r<dn+up?1:0;
}
function roundDev(teams,app){
  teams.forEach(tid=>{const adj=anchorOf(tid);squad(tid).forEach(p=>{
    if(tid===S.me&&p.evd!==S.d)p.ev=0;

    if(d>0&&p.prom&&!p.star&&p.a<=25&&p.f>=22&&R()<.1){p.star=1;if(tid===S.me)news(`✱ ${p.n} desabrochou: agora é craque!`)}

/* ---------- mercado ---------- */
const SQMAX=34,SQMIN=16;
const askPrice=p=>r100(value(p)*(p.t?1.15:.7));   /* preço fixado pelo jogo (livre sai mais barato) */
function buy(pid){
  const p=P(pid);const me=T(S.me);if(!p||p.t===S.me)return;
  const price=askPrice(p);
  if(squad(S.me).length>=SQMAX)return toast(`Elenco cheio (${SQMAX}).`);
  if(me.cash<price)return toast(`Falta caixa: custa ${money(price)}.`);
  if(p.t&&squad(p.t).length<=SQMIN)return toast(`O ${T(p.t).name} não pode vender: elenco curto.`);
  const from=p.t;me.cash=r100(me.cash-price);book(S.me,'Contratações',-price);
  if(from){T(from).cash=r100(T(from).cash+price)}
  moveP(p,S.me);p.w=r100(wageOf(p)*1.1);p.ev=0;
  news(`Contratado: ${p.n} (${GN[p.g]}, ${p.f})${from?' do '+T(from).name:''} por ${money(price)}.`);
  toast(`${p.n} é do ${me.name}!`);closeSheet();save();render();
}
function sellChance(p,price){const r=price/Math.max(.001,value(p));return r<=1.0005?1:r<=1.15?.6:r<=1.3?.35:r<=1.5?.15:r<=1.8?.04:0}
function buyersFor(p,price){return Object.values(S.teams).filter(t=>t.id!==S.me&&t.cash>=price&&squad(t.id).length<SQMAX&&teamF(t.id)<=p.f+8)}
function sell(pid,price){
  const p=P(pid);if(!p||p.t!==S.me)return;
  if(squad(S.me).length<=SQMIN)return toast(`Mínimo de ${SQMIN} jogadores.`);
  price=price>0?r100(price):value(p);
  const sure=price<=value(p)*1.0005;
  let b=buyersFor(p,price);if(!b.length&&sure)b=Object.values(S.teams).filter(t=>t.id!==S.me&&t.cash>=price&&squad(t.id).length<SQMAX).sort((x,y)=>y.cash-x.cash).slice(0,1);
  if(!b.length||R()>=sellChance(p,price)){toast(`Ninguém pagou ${money(price)}. Peça menos.`);return}
  const bu=b.sort((x,y)=>y.rep-x.rep)[0];
  bu.cash=r100(bu.cash-price);T(S.me).cash=r100(T(S.me).cash+price);book(S.me,'Vendas',price);
  moveP(p,bu.id);S.lineup.xi=S.lineup.xi.filter(x=>x!==pid);fixMyXI();
  news(`${p.n} vendido ao ${bu.name} por ${money(price)}.`);toast(`Vendido: +${money(price)}`);closeSheet();save();render();
}
function release(pid){const p=P(pid);if(!p||p.t!==S.me)return;if(squad(S.me).length<=SQMIN)return toast(`Mínimo de ${SQMIN} jogadores.`);
  const c=r100(wage(p)*3);T(S.me).cash=r100(T(S.me).cash-c);book(S.me,'Rescisões',-c);moveP(p,null);S.lineup.xi=S.lineup.xi.filter(x=>x!==pid);fixMyXI();news(`${p.n} dispensado (multa ${money(c)}).`);closeSheet();save();render()}

/* IA: clubes com caixa reforçam o time; clubes no vermelho vendem */
function aiMarket(){
  const ts=Object.values(S.teams).filter(t=>t.id!==S.me);
  const rich=ts.filter(t=>t.cash>2+squad(t.id).reduce((s,p)=>s+wage(p),0)*4);
  for(let k=0;k<10;k++){
    const t=k<8&&rich.length?pick(rich):pick(ts);if(t.cash<1||squad(t.id).length>=27)continue;
    const avg=teamF(t.id);const sq=squad(t.id);
    const need=GORD[ri(1,3)];const worst=sq.filter(p=>p.g===need).sort((a,b)=>a.f-b.f)[0];
    const c=S.players.filter(p=>p.t!==t.id&&p.t!==S.me&&p.g===need&&p.f>=avg&&p.f<=avg+8&&askPrice(p)<=t.cash*.5&&(!p.t||T(p.t).cty!=='BRA'||T(p.t).div<=T(t.id).div||R()<.3)&&(!p.t||squad(p.t).length>SQMIN+2));
    if(!c.length)continue;const p=pick(c);const price=askPrice(p);const from=p.t;
    t.cash=r100(t.cash-price);if(from)T(from).cash=r100(T(from).cash+price);
    if(from===S.me)continue;
    moveP(p,t.id);p.w=wageOf(p);
    if(worst&&squad(t.id).length>25){moveP(worst,null)}
    if(T(t.id).cty==='BRA'&&(p.f>=35||R()<.15))news(`Mercado: ${t.name} contrata ${p.n} (${p.f})${from?' do '+T(from).name:''} por ${money(price)}.`);
  }
}
function aiSellToSurvive(t){const p=squad(t.id).filter(x=>x.g!=='G').sort((a,b)=>value(b)-value(a))[1];if(!p||squad(t.id).length<=SQMIN+1)return;
  /* quem está no vermelho põe jogador em leilão */
  if(!S.auc&&R()<.5){openAuction(p,'Dívidas do '+t.name);return}
  const b=buyersFor(p,value(p)).filter(x=>x.id!==S.me)[0];if(!b)return;b.cash=r100(b.cash-value(p));t.cash=r100(t.cash+value(p));moveP(p,b.id)}

/* ---------- leilão (como no Elifoot): um jogador por vez, você decide no seu tempo ---------- */
function maybeAuction(){if(S.auc||R()>.22)return;
  const c=S.players.filter(p=>p.t&&p.t!==S.me&&squad(p.t).length>SQMIN+2&&p.f>=8);if(!c.length)return;
  const p=pick(c);openAuction(p,T(p.t).cash<0?'Dívidas do '+T(p.t).name:'Excesso no elenco do '+T(p.t).name)}
function openAuction(p,why){
  const base=r100(Math.max(.01,value(p)*.6));
  const rivs=shuffle(Object.values(S.teams).filter(t=>t.id!==S.me&&t.id!==p.t&&t.cash>base&&teamF(t.id)<=p.f+8)).slice(0,3).map(t=>({id:t.id,max:r100(Math.min(t.cash*.5,value(p)*(.75+R()*.6)))}));
  S.auc={pid:p.id,from:p.t,why,cur:base,lead:null,rivs,msg:'Lances abertos. Sua vez.',done:false};
  if(aucRival())S.auc.msg=`${T(S.auc.lead).name} abre com ${money(S.auc.cur)}. Sua vez.`;
  news(`🔨 Leilão: ${p.n} (${GN[p.g]}, ${p.f}) — lance inicial ${money(base)}.`);
}
const aucStep=v=>Math.max(.01,r100(v*.1));
function aucRival(){const A=S.auc;const nv=A.lead?r100(A.cur+aucStep(A.cur)):A.cur;
  const c=A.rivs.filter(r=>r.id!==A.lead&&r.max>=nv&&T(r.id).cash>=nv);if(!c.length)return false;
  const r=c.sort((a,b)=>b.max-a.max)[0];if(R()>Math.min(.95,.55+(r.max-nv)/Math.max(.05,nv)))return false;
  A.cur=nv;A.lead=r.id;return true}
function aucBid(){const A=S.auc;if(!A||A.done)return;const nv=A.lead?r100(A.cur+aucStep(A.cur)):A.cur;
  if(T(S.me).cash<nv)return toast(`Falta caixa: ${money(nv)}.`);if(squad(S.me).length>=SQMAX)return toast('Elenco cheio.');
  A.cur=nv;A.lead=S.me;
  if(aucRival()){A.msg=`Você ofereceu ${money(nv)} · ${T(A.lead).name} cobriu: ${money(A.cur)}. Sua vez.`;render();return}
  aucClose()}
function aucPass(){const A=S.auc;if(!A||A.done)return;let k=0;while(k++<30&&aucRival()){}aucClose()}
function aucClose(){
  const A=S.auc;const p=P(A.pid);A.done=true;
  if(!p||p.t!==A.from){A.res='Lote retirado.'}
  else if(A.lead===S.me){T(S.me).cash=r100(T(S.me).cash-A.cur);book(S.me,'Leilão',-A.cur);if(A.from)T(A.from).cash=r100(T(A.from).cash+A.cur);moveP(p,S.me);p.w=wageOf(p);A.res=`Arrematado por você: ${money(A.cur)}!`;news(`🔨 Você arrematou ${p.n} por ${money(A.cur)}.`)}
  else if(A.lead){T(A.lead).cash=r100(T(A.lead).cash-A.cur);if(A.from)T(A.from).cash=r100(T(A.from).cash+A.cur);moveP(p,A.lead);A.res=`Vendido ao ${T(A.lead).name}: ${money(A.cur)}.`}
  else A.res='Sem lances: lote retirado.';
  save();render();
}

let SLOT=1;try{SLOT=+localStorage.getItem('tatico26.e98.slot')||1}catch(e){}
const keyOf=n=>'tatico26.e98.'+n;
function metas(){try{return JSON.parse(localStorage.getItem('tatico26.e98.meta')||'{}')||{}}catch(e){return {}}}
function setMeta(n,m){const a=metas();if(m)a[n]=m;else delete a[n];try{localStorage.setItem('tatico26.e98.meta',JSON.stringify(a))}catch(e){}}
const HASCS=typeof CompressionStream!=='undefined'&&typeof DecompressionStream!=='undefined';
function b2s(u){let out='',acc=0,n=0;const parts=[];for(let i=0;i<u.length;i++){acc=(acc<<8)|u[i];n+=8;while(n>=15){n-=15;out+=String.fromCharCode(((acc>>n)&0x7fff)+32);if(out.length>8192){parts.push(out);out=''}}acc&=(1<<n)-1}
  if(n>0)out+=String.fromCharCode(((acc<<(15-n))&0x7fff)+32);parts.push(out);return parts.join('')}
function s2b(s,len){const u=new Uint8Array(len);let acc=0,n=0,j=0;for(let i=0;i<s.length&&j<len;i++){acc=(acc<<15)|(s.charCodeAt(i)-32);n+=15;while(n>=8&&j<len){n-=8;u[j++]=(acc>>n)&255}acc&=(1<<n)-1}return u}
async function deflateTxt(t){const b=await new Response(new Blob([t]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer();const u=new Uint8Array(b);return 'D'+u.length+':'+b2s(u)}
async function inflateTxt(s){const i=s.indexOf(':');const u=s2b(s.slice(i+1),+s.slice(1,i));return await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text()}
const PK=['id','n','r','g','f','a','t','star','prom','beh','inj','sus','yc','gl','j','ev','evd','f0','cg','w','fav'];
function pack(){const pl=S.players.map(p=>PK.map(k=>p[k]));const o=Object.assign({},S,{players:null});return JSON.stringify({o,pl,NID})}
function unpack(txt){const z=JSON.parse(txt);const s=z.o;s.players=z.pl.map(a=>{const p={};PK.forEach((k,i)=>{if(a[i]!==undefined&&a[i]!==null)p[k]=a[i]});p.cg=p.cg||{};return p});NID=z.NID||1;return s}
const metaOf=()=>({club:T(S.me).name,coach:S.coach,season:S.season,div:T(S.me).div,d:S.d,at:Date.now()});
let SAVING=false,AGAIN=false;
function save(){
  if(!S)return;if(SAVING){AGAIN=true;return}
  let raw;try{raw=pack()}catch(e){return}
  const n=SLOT,m=metaOf();const put=v=>{try{localStorage.setItem(keyOf(n),v);setMeta(n,m);localStorage.setItem('tatico26.e98.slot',n)}catch(e){toast('Sem espaço para salvar. Apague um jogo salvo.')}};
  if(!HASCS){put('J'+raw);return}
  SAVING=true;deflateTxt(raw).then(put).catch(()=>put('J'+raw)).finally(()=>{SAVING=false;if(AGAIN){AGAIN=false;save()}});
}

/* =====================================================================
   JOGO AO VIVO: todos os jogos da jornada na tela verde, o seu fixo no topo.
   Toque no placar = pausa e substituições. Pênalti: você escolhe o batedor.
   ===================================================================== */
const SPEEDS={1:420,2:170,4:55};
const EVK=['gol','pg','pp','vm','les'];
const ICON={gol:'⚽',pg:'⚽',pp:'❌',am:'🟨',vm:'🟥',les:'🚑',sub:'🔁',ch:'·'};
const ORDER=c=>({LIB:0,SUD:1,T:2,L1:3,L2:4,L3:5,L4:6})[c]??(10+FORE.indexOf(c.slice(2)));

function playNext(sim){
  if(!S.cal[S.d])return;
  if(S.auc&&!S.auc.done)return toast('Resolva o leilão antes (dar lance ou passar).');
  if(S.auc&&S.auc.done)S.auc=null;
  fixMyXI();
  const c=S.cal[S.d];const f=myFix(fixturesOf(c));
  if(f&&S.lineup.xi.length<11)return toast('Escale 11 jogadores no Plantel.');
  if(f&&!S.lineup.xi.some(id=>P(id).g==='G'))return toast('Escale um goleiro.');
  if(sim){const D=prepDate(false);if(D.mine)playAll(D.mine);finAndRec(D);save();render();return}
  const D=prepDate(true);
  MS={D,mine:D.mine,min:0,speed:S.mspeed||2,paused:false,done:false,gseen:0,gn:{},showEv:false};
  if(D.mine){D.mine.live=true}
  $('#match').hidden=false;$('#match').innerHTML='';
  renderMatch();runClock();
}
function finAndRec(D){const i=S.d,se=S.season;finishDate(D);if(S.season===se)recRes(D,i)}
function recRes(D,idx){if(!D.mine)return;const m=D.mine;S.res=S.res||{};const op=m.h===S.me?m.a:m.h;const my=m.h===S.me?m.gh:m.ga,ot=m.h===S.me?m.ga:m.gh;
  S.res[idx]={c:m.f.c,o:T(op).name+(m.h===S.me?' (c)':' (f)'),s:`${my}-${ot}${m.pens?' p':''}`,w:my>ot?'V':my<ot?'D':'E'}}
function simToNext(){
  let g=0;while(S.d<S.cal.length&&g++<60){const c=S.cal[S.d];const f=myFix(fixturesOf(c));if(f)break;const D=simDate();if(S.auc&&!S.auc.done)break;if(S.fired)break}
  save();render();
}
function runClock(){clearInterval(MS.timer);if(MS.paused||MS.done||MS.pen)return;MS.timer=setInterval(tick,SPEEDS[MS.speed]||170)}
function tick(){
  const m=MS.mine;
  if(m){
    if(m.min>=m.end){endLive();return}
    const n0=m.ev.length;stepMatch(m);if(m.min>=60)aiSubs(m,m.h===S.me?m.a:m.h);
    if(MS.pen){MS.paused=true;clearInterval(MS.timer);renderMatch();return}
    if(m.gap[S.me]){MS.paused=true;clearInterval(MS.timer);renderMatch();toast('Lesão! Escolha quem entra.');return}
    if(m.ev.slice(n0).some(e=>e.t===S.me&&e.k==='vm'))toast('Expulsão no seu time!');
    MS.min=m.min;
  }else{MS.min++;if(MS.min>=93){endLive();return}}
  renderMatch();
}
/* mata-mata: empate no fim → pênaltis */
function needPens(m){
  if(m.f.c==='T')return m.gh===m.ga;
  if((m.f.c==='LIB'||m.f.c==='SUD')&&m.f.leg){const t=S.cups[m.f.c].rounds[S.cups[m.f.c].r].ties[m.f.tie];
    const ga=(t.l1[0]===t.a?t.l1[1]:t.l1[2])+(m.h===t.a?m.gh:m.ga),gb=(t.l1[0]===t.b?t.l1[1]:t.l1[2])+(m.h===t.b?m.gh:m.ga);m.agg=[ga,gb];return ga===gb}
  return false;
}
function endLive(){
  clearInterval(MS.timer);const m=MS.mine;
  if(m&&needPens(m)&&!m.pens){shootout(m);MS.so={i:0};MS.done=true;renderMatch();soStep();return}
  MS.done=true;MS.min=999;renderMatch();
}
function soStep(){if(!MS||!MS.so)return;const m=MS.mine;MS.so.i++;renderMatch();if(MS.so.i<m.so.length)setTimeout(soStep,900)}
function closeMatch(){
  const D=MS.D;clearInterval(MS.timer);
  if(D.mine){D.mine.live=false}
  MS=null;$('#match').hidden=true;$('#match').innerHTML='';
  finAndRec(D);save();render();
}

/* ---------- desenho ---------- */
function setH(el,h){if(el&&el._h!==h){el._h=h;el.innerHTML=h}}
function liveScore(x,cur){const v=x.ev.filter(e=>(e.k==='gol'||e.k==='pg')&&e.min<=cur);return [v.filter(e=>e.t===x.h).length,v.filter(e=>e.t===x.a).length]}
function evPair(x,cur){const one=t=>{const e=x.ev.filter(e=>e.t===t&&e.min<=cur&&EVK.includes(e.k)).slice(-1)[0];return e?`<span class="ge k-${e.k}">${ICON[e.k]} ${e.min}' ${esc(e.n.split(' (')[0])}</span>`:'<span class="ge"></span>'};return `<span class="gep">${one(x.h)}${one(x.a)}</span>`}
function renderMatch(){
  const m=MS.mine;const D=MS.D;const cur=MS.done?999:MS.min;const me=S.me;const root=$('#match');
  /* esqueleto uma vez por jornada (rolagem fluida) */
  let fresh=false;
  if(root._ms!==MS||!root.querySelector('.ggrid')){fresh=true;root._ms=MS;
    const groups={};D.res.forEach(x=>{(groups[x.f.c]=groups[x.f.c]||[]).push(x)});
    const ks=Object.keys(groups).sort((a,b)=>ORDER(a)-ORDER(b));
    const brK=ks.filter(k=>!k.startsWith('X-')),xK=ks.filter(k=>k.startsWith('X-'));
    MS.rows=[];
    const sec=k=>`<div class="gsec ${m&&m.f.c===k?'gmy':''} ${k.startsWith('X-')?'gx':''}"><div class="gh">${esc(compName(k))}</div>${groups[k].map(x=>{MS.rows.push(x);return `<div class="gr ${x===m?'mine':''}" data-gi="${MS.rows.length-1}"></div>`}).join('')}</div>`;
    root.innerHTML=`<div class="gpan"></div><div class="mw"><div class="gfix"><div class="gtop" data-a="mtop"></div><div class="gmine" data-a="mtop"></div><div class="gctl"></div></div><div class="gbody"></div><div class="ggrid">${brK.map(sec).join('')}${xK.length?`<details class="gxd"><summary>Jogos no exterior (${xK.length} ligas)</summary>${xK.map(sec).join('')}</details>`:''}</div></div>`;
    MS.els=[...root.querySelectorAll('.gr')];
  }
  const w=root.querySelector('.mw');
  /* âncora: o que você está vendo não sai do lugar quando algo acima muda */
  let anc=null,ay=0;if(!fresh){const lim=root.querySelector('.gfix').getBoundingClientRect().bottom;for(const r of MS.els){const y=r.getBoundingClientRect().top;if(y>=lim){anc=r;ay=y;break}}}
  const c=D.c;
  const lbl=m?(m.f.c==='T'?`Taça · ${KO_N[S.cups.T.rounds[S.cups.T.r].n]}`:m.f.c==='LIB'||m.f.c==='SUD'?`${compName(m.f.c)} · ${CONT_N[S.cups[m.f.c].rounds[S.cups[m.f.c].r].n]} · ${m.f.leg?'volta':'ida'}`:`${compName(m.f.c)} · ${c.r+1}ª jornada`):`${dateTxt(c)} · seu time não joga`;
  const mn=Math.min(MS.done?(m?m.min:93):MS.min,90),ext=(m?m.min:MS.min)>90?'+'+((m?m.min:MS.min)-90):'';
  const clock=MS.done?'FIM':MS.paused&&!MS.pen?`${mn}' PAUSA`:`${mn}'${ext}`;
  setH(root.querySelector('.gtop'),`<span class="hg ${MS.paused||MS.done?'':'run'}">⏳</span><b>${clock}</b><span class="gl">${esc(lbl)}${m&&!MS.done&&!MS.paused?'<br><i>toque no placar para substituir</i>':''}</span>`);
  /* aviso de gol embaixo de cada time, independentes */
  if(m){const gl=m.ev.filter(e=>e.k==='gol'||e.k==='pg');if(gl.length>MS.gseen){gl.slice(MS.gseen).forEach(e=>{MS.gn[e.t]={h:`⚽ ${e.min}' ${esc(e.n)}`,u:Date.now()+2600}});MS.gseen=gl.length;setTimeout(()=>{if(MS)renderMatch()},2650)}}
  const side=t=>{const g=MS.gn[t]&&Date.now()<MS.gn[t].u&&!MS.done?MS.gn[t]:null;return `<div class="gside">${tbox(t)}<span class="gnote ${g?'on':''}">${g?g.h:''}</span></div>`};
  setH(root.querySelector('.gmine'),m?`${side(m.h)}<b class="gs big">${m.gh}</b><b class="gs big">${m.ga}</b>${side(m.a)}`:`<p class="small center grow">Acompanhe os outros resultados.</p>`);
  const ctl=MS.done?`<button class="btn pri big wide" data-a="mclose">Continuar</button>`:MS.pen?'':
    `${m?`<div class="row">${MS.paused?`<button class="btn pri grow" data-a="mres">▶ Continuar</button>`:`<button class="btn grow" data-a="mpause">Substituições</button>`}<button class="btn ${MS.showEv?'on':''}" data-a="mev">Lances</button></div>`:''}<div class="row">${[1,2,4].map(v=>`<button class="btn sm ${MS.speed===v?'on':''}" data-a="mspd" data-v="${v}">${v===1?'Normal':v===2?'Rápida':'Super'}</button>`).join('')}<button class="btn sm" data-a="mskip">Fim ⏭</button></div>`;
  setH(root.querySelector('.gctl'),ctl);
  /* painel por cima: substituições / pênalti */
  let pan='';
  if(m&&MS.pen&&!MS.done){const L=m.on[me].map(P).filter(Boolean).sort((a,b)=>penChance(m,me,b)-penChance(m,me,a));
    pan=`<div class="sw-h"><b>🎯 Pênalti para você · ${MS.pen.min}'</b><span>Escolha o batedor (craque * bate melhor)</span></div>${L.map(p=>`<button class="sw-p" data-a="pentk" data-v="${p.id}">${gpill(p.g)}<span>${nm(p)}</span><b>${p.f}</b></button>`).join('')}`}
  else if(m&&MS.paused&&!MS.done){
    const on=m.on[me].map(P).filter(Boolean).sort((a,b)=>GORD.indexOf(a.g)-GORD.indexOf(b.g));const bn=bench(m,me).sort((a,b)=>GORD.indexOf(a.g)-GORD.indexOf(b.g)||b.f-a.f);const left=MAXSUB-m.subs[me];
    pan=`<div class="sw-h"><b>Substituições · jogo parado</b><span>${left} de ${MAXSUB} · esquema ${formOf(m.on[me])}</span><button class="btn pri sm" data-a="mres">▶ Continuar</button></div>
      ${m.gap[me]?`<p class="warn">Lesionado saiu: escolha quem entra.</p>`:''}
      <div class="sw-c"><div><p class="sw-t">EM CAMPO ${MS.eo?'· agora quem entra →':'· toque em quem sai'}</p>${on.map(p=>`<button class="sw-p ${MS.eo===p.id?'sel':''}" data-a="mout" data-v="${p.id}">${gpill(p.g)}<span>${nm(p)}${m.yc[p.id]?' 🟨':''}</span><b>${p.f}</b></button>`).join('')}</div>
      <div><p class="sw-t">BANCO</p>${bn.map(p=>`<button class="sw-p" data-a="min" data-v="${p.id}" ${left<=0?'disabled':''}>${gpill(p.g)}<span>${nm(p)}</span><b>${p.f}</b></button>`).join('')||'<p class="small">Ninguém.</p>'}</div></div>`}
  setH(root.querySelector('.gpan'),pan);
  /* corpo: fim de jogo, pênaltis, lances */
  let body='';
  if(m&&m.so&&MS.so){const sq=m.so.slice(0,MS.so.i);const sh=sq.filter(x=>x.t===m.h&&x.ok).length,sa=sq.filter(x=>x.t===m.a&&x.ok).length;
    body+=`<div class="box"><p class="lbl">Disputa de pênaltis · ${sh} × ${sa}</p>${sq.map(x=>`<p class="small">${x.ok?'⚽':'❌'} ${esc(T(x.t).code||T(x.t).name)} · ${esc(x.n)}</p>`).join('')}${MS.so.i>=m.so.length?`<p class="up"><b>${esc(T(m.pens[0]>m.pens[1]?m.h:m.a).name)} vence nos pênaltis</b></p>`:''}</div>`}
  if(m&&MS.done&&m.agg)body+=`<p class="small center">Agregado: ${esc(T(m.h===S.cups[m.f.c].rounds[S.cups[m.f.c].r].ties[m.f.tie].a?m.h:m.a).name)} ${m.agg[0]} × ${m.agg[1]}</p>`;
  if(m&&MS.showEv){const ev=m.ev.filter(e=>e.k!=='ch'||true).slice().reverse();body+=`<div class="gev" data-a="mev">${ev.map(e=>`<div class="${e.t===me?'us':''} k-${e.k}"><span>${e.min}'</span><span>${ICON[e.k]||''}</span><span>${esc(e.n)} <i>${esc(T(e.t).code||'')}</i></span></div>`).join('')||'<div><span></span><span></span><span>A bola vai rolar…</span></div>'}</div>`}
  if(m)body+=`<p class="ginfo">Árbitro ${esc(m.ref.n)} · ${m.ref.r>=1.3?'rigoroso':m.ref.r<=.85?'liberal':'normal'}</p>`;
  setH(root.querySelector('.gbody'),body);
  /* placares (só linhas que mudaram) */
  MS.els.forEach(el=>{const x=MS.rows[+el.dataset.gi];const [gh,ga]=x===m?[m.gh,m.ga]:liveScore(x,cur);const hot=!MS.done&&x.ev.some(e=>(e.k==='gol'||e.k==='pg')&&e.min<=cur&&e.min>cur-3);
    const le=evPair(x,x===m?999:cur);const k=gh+'|'+ga+'|'+hot+'|'+le;if(el._k!==k){el._k=k;el.classList.toggle('hot',hot);el.innerHTML=`${tbox(x.h)}<b class="gs">${gh}</b><b class="gs">${ga}</b>${tbox(x.a)}${le}`}});
  if(anc){const d=anc.getBoundingClientRect().top-ay;if(Math.abs(d)>.5)w.scrollTop+=d}
  if(fresh)requestAnimationFrame(()=>{const s=w.querySelector('.gsec.gmy'),fx=w.querySelector('.gfix');if(s&&fx)w.scrollTop+=s.getBoundingClientRect().top-w.getBoundingClientRect().top-fx.offsetHeight-6});
  if(MS.done&&!MS._dt){MS._dt=1;w.scrollTop=0}
}

/* =====================================================================
   AÇÕES (toques) e inicialização
   ===================================================================== */
const ACT={
  tab:v=>{UI.tab=v;closeSheet();render()},
  menu:()=>openMenu(),shclose:()=>closeSheet(),
  /* início */
  ndiv:v=>{UI.newDiv=+v;UI.coach=($('#coach')||{}).value||UI.coach;render()},
  nclub:v=>newGame(v),
  nrand:()=>{const l=Object.values(UI.world.teams).filter(t=>t.cty==='BRA'&&t.div===4);newGame(pick(l).id)},
  load:async v=>{try{const s=await loadSlot(+v);if(!s)return toast('Save não encontrado.');S=s;SLOT=+v;reindex();UI.tab='inicio';render();toast(`Bem-vindo de volta, ${S.coach}!`)}catch(e){toast('Não foi possível abrir este save.')}},
  delslot:v=>{if(!confirmOnce('del'+v,'Toque de novo no lixo para apagar este jogo.'))return;delSlot(+v);render()},
  delold:()=>{if(!confirmOnce('old','Toque de novo para apagar os saves antigos.'))return;Object.keys(localStorage).filter(k=>/^tatico26\.(v5|slot)/.test(k)).forEach(k=>localStorage.removeItem(k));render()},
  quit:()=>{save();S=null;closeSheet();prepWorld();render()},
  savenow:()=>{save();closeSheet();toast('Jogo salvo.')},
  hist:()=>openHist(),
  /* jogo */
  play:()=>playNext(false),simto:()=>simToNext(),
  mtop:()=>{if(MS&&MS.mine&&!MS.done&&!MS.paused&&!MS.pen)ACT.mpause()},
  mpause:()=>{MS.paused=true;clearInterval(MS.timer);MS.eo=null;renderMatch()},
  mres:()=>{const m=MS.mine;if(m&&m.gap[S.me]){m.gap[S.me]=0;autoSub(m,S.me,'D')}MS.paused=false;MS.eo=null;runClock();renderMatch()},
  mout:v=>{MS.eo=MS.eo===+v?null:+v;renderMatch()},
  min:v=>{const m=MS.mine;if(m.subs[S.me]>=MAXSUB)return toast('Já fez 3 substituições.');
    if(m.gap[S.me]){m.gap[S.me]--;doSub(m,S.me,null,+v)}else if(MS.eo){doSub(m,S.me,MS.eo,+v);MS.eo=null}else return toast('Toque primeiro em quem sai.');renderMatch()},
  pentk:v=>{const m=MS.mine;resolvePen(m,S.me,P(+v));MS.pen=null;MS.paused=false;runClock();renderMatch()},
  mev:()=>{MS.showEv=!MS.showEv;renderMatch()},
  mspd:v=>{MS.speed=+v;S.mspeed=+v;runClock();renderMatch()},
  mskip:()=>{const m=MS.mine;clearInterval(MS.timer);MS.skip=true;MS.pen=null;MS.paused=false;if(m){if(m.gap[S.me]){m.gap[S.me]=0;autoSub(m,S.me,'D')}while(m.min<m.end){stepMatch(m);if(m.min>=60)aiSubs(m,m.h===S.me?m.a:m.h)}}MS.min=93;endLive()},
  mclose:()=>{if(MS.so&&MS.mine&&MS.so.i<MS.mine.so.length){MS.so.i=MS.mine.so.length;renderMatch();return}closeMatch()},
  champok:()=>{const e=$('#champ');if(e)e.remove();render()},
  /* plantel */
  tgl:v=>toggleXI(+v),
  auto:v=>{S.lineup.xi=pickXI(S.me,v);save();render();toast(`Escalado no ${formOf(S.lineup.xi)}.`)},
  pl:v=>openPlayer(+v),team:v=>openTeam(v),
  /* tabelas */
  tb:v=>{UI.tb=v;render()},xc:v=>{UI.xc=v;render()},ac:v=>{UI.ac=v;render()},
  /* mercado */
  mg:v=>{UI.mk.g=v;render()},mf:v=>{UI.mk[v]=!UI.mk[v];render()},
  mclear:()=>{UI.mk={g:'',fmin:'',fmax:'',pmax:'',q:'',sort:'f',amax:''};render()},
  fav:v=>{const p=P(+v);p.fav=p.fav?0:1;save();render()},
  buy:v=>buy(+v),
  sellmk:v=>sell(+v,0),
  sellask:v=>{const x=parseFloat((($('#sellp')||{}).value||'').replace(',','.'));sell(+v,x>0?x:0)},
  rel:v=>{if(!confirmOnce('rel'+v,'Toque de novo para dispensar (paga multa).'))return;release(+v)},
  /* leilão */
  aucbid:()=>aucBid(),aucpass:()=>aucPass(),aucok:()=>{S.auc=null;save();render()},
  /* finanças */
  loan:v=>takeLoan(+v),pay:v=>payLoan(+v),price:v=>setPrice(+v),expand:()=>expand(),
  /* carreira */
  take:v=>takeJob(v),jobno:()=>{S.jobOff=null;save();render();closeSheet();toast('Convites recusados.')},
  crestdel:()=>{delete CRESTS[S.me];saveCrests();closeSheet();render()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=ACT[el.dataset.a];if(f){e.preventDefault();f(el.dataset.v)}});
/* campos do mercado: filtram ao digitar (com pequena espera) */
let INT=null;
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.in;if(!k)return;const v=e.target.value;
  const map={mq:'q'};UI.mk[map[k]||k]=v;clearTimeout(INT);INT=setTimeout(()=>{const id=e.target.id,pos=e.target.selectionStart;render();const n=id?document.getElementById(id):document.querySelector(`[data-in="${k}"]`);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}},350)});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.in==='sort'){UI.mk.sort=e.target.value;render()}
  if(e.target.id==='crestup'){const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=96;const x=c.getContext('2d');const s=Math.min(96/img.width,96/img.height);x.drawImage(img,(96-img.width*s)/2,(96-img.height*s)/2,img.width*s,img.height*s);CRESTS[S.me]=c.toDataURL('image/png');if(saveCrests()){closeSheet();render();toast('Escudo guardado neste aparelho.')}};img.src=rd.result};rd.readAsDataURL(f)}});
/* início */
(async()=>{
  try{const ms=metas();if(ms[SLOT]){const s=await loadSlot(SLOT);if(s){S=s;reindex()}}}catch(e){S=null}
  if(!S)prepWorld();
  render();
})();

</script>
<script>const APPV="64";if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));

addEventListener("load",chkV);document.addEventListener("visibilitychange",()=>{if(!document.hidden)chkV()});</script></body></html>
