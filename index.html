<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0c8546"><title>Tático 26</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-title" content="Tático 26"><style>[hidden]{display:none!important}body{margin:0}</style></head><body><title>Tático 26</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de uma coluna (máx. 560px), barra superior com o clube, navegação inferior fixa; partida em tela cheia com placar noturno */
:root{
  --bg:#edf1ee; --surface:#ffffff; --surface2:#f4f7f5; --line:#dbe3de; --fg:#0f1a14; --mute:#5c6b62;
  --accent:#0c8546; --accent-soft:#dcefe3; --accent-ink:#ffffff; --gold:#c98a08;
  --win:#14834a; --draw:#7b8680; --loss:#c3302f;
  --pG:#b7791f; --pD:#2f62c9; --pM:#14834a; --pA:#c3302f;
  --pitch:#1f6b3d; --pitch2:#23784a; --pline:rgba(255,255,255,.55);
  --shadow:0 1px 2px rgba(16,32,24,.06),0 4px 14px rgba(16,32,24,.06);
  --f-d:"Barlow Condensed","Arial Narrow",Roboto Condensed,sans-serif;
  --f-b:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b110e; --surface:#141c18; --surface2:#1a241f; --line:#27342d; --fg:#e8efea; --mute:#93a299;
  --accent:#2fbf73; --accent-soft:#173626; --accent-ink:#06120b; --gold:#e3ad3a;
  --win:#33b86c; --draw:#7f8a84; --loss:#e0574f;
  --pG:#d49a3a; --pD:#5b8cf0; --pM:#33b86c; --pA:#e0574f;
  --pitch:#184f2f; --pitch2:#1b5934;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b110e; --surface:#141c18; --surface2:#1a241f; --line:#27342d; --fg:#e8efea; --mute:#93a299;
  --accent:#2fbf73; --accent-soft:#173626; --accent-ink:#06120b; --gold:#e3ad3a;
  --win:#33b86c; --draw:#7f8a84; --loss:#e0574f;
  --pG:#d49a3a; --pD:#5b8cf0; --pM:#33b86c; --pA:#e0574f;
  --pitch:#184f2f; --pitch2:#1b5934;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--f-b);font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin-inline:auto;background:var(--bg)}
.top{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.top .who{flex:1;min-width:0;display:flex;flex-direction:column}
.top .club{font-family:var(--f-d);font-weight:700;font-size:20px;line-height:1.1;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:12px;color:var(--mute)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
main{flex:1;min-height:0;overflow:auto;padding-block:16px 24px;padding-inline:16px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.nav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 4px}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:600;color:var(--mute);position:relative;border-radius:10px}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--accent)}
.nav button.on::before{content:"";position:absolute;top:-7px;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.badge{position:absolute;top:2px;right:calc(50% - 20px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--loss);color:#fff;font-size:10px;display:grid;place-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0;font-family:var(--f-d);font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1,h2{margin:0;font-family:var(--f-d);font-weight:800;text-wrap:balance;line-height:1.05}
p{margin:0;line-height:1.45}
.mute{color:var(--mute)}.small{font-size:13px}.tiny{font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .08s,background .15s}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{width:100%;min-height:54px;font-family:var(--f-d);font-size:20px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:14px}
.btn.sm{min-height:34px;padding:6px 11px;font-size:13px;border-radius:10px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--loss)}
.btn[disabled]{opacity:.45;cursor:default}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-width:0;border:0;background:transparent;border-radius:9px;padding:8px 6px;font-size:13px;font-weight:600;color:var(--mute);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.chipset{display:flex;gap:6px;flex-wrap:wrap}
.chipb{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--mute)}
.chipb.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.crest{--c1:#888;--c2:#fff;width:var(--s,36px);height:var(--s,36px);flex:none;border-radius:50%;background:var(--c1);color:var(--c2);display:grid;place-items:center;font-family:var(--f-d);font-weight:800;font-size:calc(var(--s,36px)*.34);letter-spacing:.02em;box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--line)}
.hero{position:relative;border-radius:18px;overflow:hidden;color:#fff;box-shadow:var(--shadow)}
.hero .bg{position:absolute;inset:0}
.hero .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.62))}
.hero .in{position:relative;padding:16px;display:flex;flex-direction:column;gap:14px}
.hero .meta{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.vs .side{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.vs .nm{font-family:var(--f-d);font-weight:700;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.vs .x{font-family:var(--f-d);font-size:28px;font-weight:800;opacity:.85}
.vs .s{font-size:12px;opacity:.85}
.hero .crest{box-shadow:0 0 0 3px rgba(255,255,255,.85)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat small{font-size:12px;color:var(--mute)}
.stat b{font-family:var(--f-d);font-size:24px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.form{display:flex;gap:5px}
.fm{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px}
.fm.V{background:var(--win)}.fm.E{background:var(--draw)}.fm.D{background:var(--loss)}
.pos{display:inline-grid;place-items:center;width:34px;height:22px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.04em;color:#fff;flex:none}
.pos.G{background:var(--pG)}.pos.D{background:var(--pD)}.pos.M{background:var(--pM)}.pos.A{background:var(--pA)}
.ovr{min-width:36px;height:30px;border-radius:9px;display:grid;place-items:center;font-family:var(--f-d);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;background:var(--surface2);border:1px solid var(--line)}
.ovr.t1{background:var(--gold);color:#1a1200;border-color:transparent}
.ovr.t2{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.list{display:flex;flex-direction:column}
.pr{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);min-width:0}
.pr:last-child{border-bottom:0}
.pr .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;cursor:pointer}
.pr .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .mt{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.pr.out .nm{color:var(--mute)}
.pr .price{font-size:13px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tog{width:30px;height:30px;flex:none;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;padding:0;color:transparent;font-weight:800;font-size:14px}
.tog.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.up{color:var(--win);font-weight:700}.dn{color:var(--loss);font-weight:700}
.flag{font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;margin-left:4px;vertical-align:1px}
.flag.inj{background:rgba(195,48,47,.14);color:var(--loss)}.flag.sal{background:rgba(201,138,8,.18);color:var(--gold)}
.grp{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:12px 2px 2px}
.pitch{position:relative;border-radius:12px;padding:14px 6px;display:flex;flex-direction:column;gap:14px;background:repeating-linear-gradient(180deg,var(--pitch) 0 34px,var(--pitch2) 34px 68px);overflow:hidden}
.pitch::before{content:"";position:absolute;left:8px;right:8px;top:8px;bottom:8px;border:1.5px solid var(--pline);border-radius:4px}
.pitch::after{content:"";position:absolute;left:50%;top:50%;width:70px;height:70px;border:1.5px solid var(--pline);border-radius:50%;transform:translate(-50%,-50%)}
.pline{display:flex;justify-content:space-evenly;position:relative;z-index:1;gap:2px}
.tok{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;max-width:74px}
.tok i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--f-d);font-weight:800;font-size:15px;box-shadow:0 2px 6px rgba(0,0,0,.35),0 0 0 2px rgba(255,255,255,.9)}
.tok span{font-size:11px;font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:72px}
.warn{font-size:13px;color:var(--loss);font-weight:600}
.tblw{overflow-x:auto;margin-inline:-14px}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.tbl th{font-size:11px;font-weight:600;color:var(--mute);text-align:right;padding:6px 8px;text-transform:uppercase;letter-spacing:.05em}
.tbl td{text-align:right;padding:8px;border-top:1px solid var(--line)}
.tbl .l{text-align:left}
.tbl tr.me td{background:var(--accent-soft);font-weight:700}
.tbl .tm{display:flex;align-items:center;gap:8px;white-space:nowrap}
.zn{display:inline-block;width:3px;height:18px;border-radius:2px;vertical-align:middle;margin-right:6px}
.z1{background:#2f62c9}.z2{background:#7fa3ef}.z3{background:var(--win)}.z4{background:var(--loss)}.z0{background:transparent}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mute)}
.fx{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.fx:first-of-type{border-top:0}
.fx .h,.fx .a{display:flex;align-items:center;gap:8px;min-width:0;font-weight:600;font-size:14px}
.fx .h{justify-content:flex-end;text-align:right}
.fx .sc{font-family:var(--f-d);font-weight:800;font-size:20px;min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
.fx.me{background:var(--accent-soft);border-radius:10px;padding-inline:8px}
.news{display:flex;flex-direction:column}
.news div{padding:9px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.4}
.news div:first-child{border-top:0}
.news .r{font-size:11px;font-weight:700;color:var(--mute);margin-right:6px}
.offer{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface2)}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-variant-numeric:tabular-nums}
input[type=text],input[type=number],select,textarea{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px 12px;min-width:0}
textarea{width:100%;min-height:150px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;resize:vertical}
label{font-size:12px;font-weight:600;color:var(--mute);display:flex;flex-direction:column;gap:4px}
.search{position:relative}
.search input{width:100%;padding-left:36px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--mute);fill:none;stroke-width:2}
/* início */
.splash{display:flex;flex-direction:column;gap:6px;padding:8px 2px 4px}
.splash h1{font-size:52px;letter-spacing:-.01em}
.splash h1 em{font-style:normal;color:var(--accent)}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tp{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;display:flex;align-items:center;gap:10px;text-align:left;min-width:0}
.tp .t{display:flex;flex-direction:column;min-width:0}
.tp b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp .bar{height:4px;border-radius:2px;background:var(--line);margin-top:5px;width:90px;max-width:100%}
.tp .bar i{display:block;height:100%;border-radius:2px;background:var(--accent)}
/* folha (modal) */
.sheet-wrap{position:fixed;inset:0;z-index:30;background:rgba(5,12,9,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{width:100%;max-width:560px;max-height:90%;background:var(--surface);border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .2s ease-out}
.sheet .hd{display:flex;align-items:center;gap:10px;padding:10px 16px 8px;border-bottom:1px solid var(--line)}
.sheet .hd::before{content:"";position:absolute;left:50%;transform:translateX(-50%);margin-top:-18px;width:40px;height:4px;border-radius:2px;background:var(--line)}
.sheet .hd h2{flex:1;font-size:22px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet .bd{overflow:auto;padding:14px 16px 20px;display:flex;flex-direction:column;gap:14px}
.x{border:0;background:var(--surface2);width:32px;height:32px;border-radius:50%;font-size:16px;color:var(--mute)}
.pstat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pstat div{background:var(--surface2);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:1px;min-width:0}
.pstat small{font-size:11px;color:var(--mute)}
.pstat b{font-family:var(--f-d);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big-ovr{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;font-family:var(--f-d);font-weight:800;font-size:34px;flex:none}
.stars{color:var(--gold);letter-spacing:1px}
.spark{width:100%;height:56px;display:block}
details summary{cursor:pointer;font-weight:600;font-size:14px}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(30px);opacity:.5}}
/* partida: placar noturno, mesma cara nos dois temas */
#match{position:fixed;inset:0;z-index:20;background:#07121c;color:#e8f0f7;display:flex;justify-content:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);--m-card:#0f1e2c;--m-line:#1f3446;--m-mute:#8ea4b8;--m-goal:#f2b233;--m-acc:#35d07f;color-scheme:dark}
#match .wrap{width:100%;max-width:560px;height:100%;overflow:auto;padding:14px 16px 20px;display:flex;flex-direction:column;gap:12px}
.board{background:radial-gradient(120% 90% at 50% 0%,#17334a,#0b1825);border:1px solid var(--m-line);border-radius:18px;padding:14px 12px 12px;display:flex;flex-direction:column;gap:10px}
.board .st{text-align:center;font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--m-mute)}
.board .st b{color:var(--m-acc)}
.sb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.sb .tm{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.sb .tm span{font-family:var(--f-d);font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sb .num{font-family:var(--f-d);font-weight:800;font-size:64px;line-height:.9;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.sb .num i{font-style:normal;color:var(--m-mute);margin:0 4px}
.sb .crest{box-shadow:0 0 0 2px #07121c,0 0 0 3px #3a5670}
.prog{height:4px;border-radius:2px;background:var(--m-line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--m-acc);transition:width .2s}
.press{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--m-mute)}
.press .b{flex:1;height:6px;border-radius:3px;overflow:hidden;display:flex;background:var(--m-line)}
.mcard{background:var(--m-card);border:1px solid var(--m-line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.mcard h3{margin:0;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--m-mute)}
.tl{display:flex;flex-direction:column;max-height:30vh;overflow:auto}
.tl div{display:grid;grid-template-columns:36px 24px minmax(0,1fr);gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--m-line);font-size:14px}
.tl div:first-child{border-top:0}
.tl .mn{color:var(--m-mute);font-variant-numeric:tabular-nums;font-weight:600}
.tl .g{color:var(--m-goal);font-weight:700}
.tl .side{font-size:11px;color:var(--m-mute)}
.og{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
.og div{display:flex;justify-content:space-between;gap:6px;font-variant-numeric:tabular-nums;font-size:14px;padding:3px 0}
.og b{font-family:var(--f-d);font-size:17px}
.og .hot b{color:var(--m-goal)}
#match .btn{background:var(--m-card);border-color:var(--m-line);color:#e8f0f7}
#match .btn.pri{background:var(--m-acc);border-color:var(--m-acc);color:#04130a}
#match .btn.on{border-color:var(--m-acc);color:var(--m-acc)}
#match .seg{background:#0a1724;border-color:var(--m-line)}
#match .seg button{color:var(--m-mute)}
#match .seg button.on{background:#1b3247;color:#fff;box-shadow:none}
.subs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.subs .col{display:flex;flex-direction:column;gap:4px;min-width:0}
.subs .it{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:9px;border:1px solid var(--m-line);background:#0b1825;font-size:13px;min-width:0;text-align:left}
.subs .it span:nth-child(2){flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subs .it.sel{border-color:var(--m-acc);background:#123326}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;padding:11px 16px;border-radius:12px;background:var(--fg);color:var(--bg);font-size:14px;font-weight:600;max-width:90%;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.hint{font-size:12px;color:var(--mute);line-height:1.45}
code{font-size:12px;background:var(--surface2);padding:1px 5px;border-radius:5px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
/* campo com posições por função */
.field{position:relative;width:100%;aspect-ratio:68/86;border-radius:12px;overflow:hidden;background:repeating-linear-gradient(180deg,var(--pitch) 0 9%,var(--pitch2) 9% 18%)}
.field::before{content:"";position:absolute;inset:6px;border:1.5px solid var(--pline);border-radius:4px}
.field .mid{position:absolute;left:6px;right:6px;top:50%;border-top:1.5px solid var(--pline)}
.field .ccl{position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;border:1.5px solid var(--pline);border-radius:50%;transform:translate(-50%,-50%)}
.field .box{position:absolute;left:30%;right:30%;height:11%;border:1.5px solid var(--pline)}
.field .box.t{top:6px;border-top:0}.field .box.b{bottom:6px;border-bottom:0}
.slot{position:absolute;transform:translate(-50%,-50%);width:76px;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:0;z-index:1;color:#fff}
.slot i{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--f-d);font-weight:800;font-size:16px;box-shadow:0 2px 6px rgba(0,0,0,.35),0 0 0 2px rgba(255,255,255,.92);position:relative}
.slot.off i{box-shadow:0 2px 6px rgba(0,0,0,.35),0 0 0 2.5px #ffc24a}
.slot.empty i{background:rgba(0,0,0,.25)!important;box-shadow:0 0 0 2px rgba(255,255,255,.7);color:#fff!important}
.slot em{position:absolute;top:-8px;right:-14px;font-style:normal;font-size:10px;font-weight:700;background:#ffc24a;color:#2a1a00;border-radius:6px;padding:0 4px;line-height:15px}
.slot b{font-size:10px;font-weight:700;letter-spacing:.06em;opacity:.85;line-height:1}
.slot span{font-size:11px;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.65);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:76px;line-height:1.1}
.st-tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pick{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;min-width:0}
.pick .info{flex:1;min-width:0;display:flex;flex-direction:column}
.pick .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .mt{font-size:12px;color:var(--mute)}
.pick.cur{background:var(--accent-soft);border-radius:10px}
.effv{display:flex;flex-direction:column;align-items:flex-end;font-variant-numeric:tabular-nums}
.effv small{font-size:11px;color:var(--mute)}
.roles{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.roles .chipb{flex:none}
/* quadro tático arrastável */
.slot{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;transition:transform .1s}
.slot.lift{z-index:6;transform:translate(-50%,-50%) scale(1.15);cursor:grabbing}
.slot:focus-visible i{outline:2px solid #fff;outline-offset:2px}
.field .zl{position:absolute;left:6px;right:6px;border-top:1px dashed transparent;pointer-events:none}
.field .zt{position:absolute;left:10px;transform:translateY(-50%);font-size:9px;font-weight:700;letter-spacing:.1em;color:rgba(255,255,255,0);pointer-events:none}
.field.dragging .zl{border-color:rgba(255,255,255,.4)}
.field.dragging .zt{color:rgba(255,255,255,.7)}
.benchrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:10px 4px;padding:4px 0 6px}
.bb{min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.bb i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--f-d);font-weight:800;font-size:15px;box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--line)}
.bb b{font-size:10px;font-weight:700;color:var(--mute);letter-spacing:.05em}
.bb span{font-size:11px;font-weight:600;max-width:60px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bb.out{opacity:.5}
.bb.ghost{position:fixed;z-index:60;pointer-events:none;transform:translate(-50%,-60%) scale(1.15)}
.field .sp{position:absolute;width:26px;height:26px;border-radius:50%;transform:translate(-50%,-50%);border:1.5px dashed rgba(255,255,255,.22);pointer-events:none}
.field.dragging .sp{border-color:rgba(255,255,255,.55)}
.field .sp.hot{border:2px solid #fff;background:rgba(255,255,255,.18)}

.shield{flex:none;display:inline-block;vertical-align:middle;overflow:visible;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.2))}
.hero .shield{filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}

.crestgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.cg{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);min-width:0}
.cg .btn{width:100%}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}

.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px;transition:width .3s}
input[type=range]{width:100%;accent-color:var(--accent);margin-top:6px}
.nav{grid-template-columns:repeat(6,1fr)}
.nav button{font-size:10.5px}

.ib{border:0;background:var(--surface2);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--mute);flex:none}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib.on{color:var(--accent);background:var(--accent-soft)}
.hero .s+.s{opacity:.75}
.odds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.odds div{background:var(--surface2);border-radius:10px;padding:8px 4px;display:flex;flex-direction:column}
.odds b{font-family:var(--f-d);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.odds small{font-size:12px;color:var(--mute)}
.cmp{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:8px;font-variant-numeric:tabular-nums;font-size:13px;font-weight:600}
.cmp>span:last-child{text-align:right}
.cmp small{display:block;text-align:center;font-size:11px;color:var(--mute);margin-bottom:3px}
.cb{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line)}

.duel{display:flex;flex-direction:column;gap:4px;text-align:center;padding:4px 0 2px}
.duel p:first-child{font-weight:700;letter-spacing:.12em}
.duel h1{font-size:34px;letter-spacing:-.005em}
.duel h1 span{color:var(--mute);font-weight:600;margin:0 4px}

/* duelo sem cortes: nomes e infos quebram linha dentro da caixa */
.hero .row{flex-wrap:wrap;row-gap:4px}
.hero h1.dt{font-size:clamp(24px,7vw,34px);text-align:center;color:#fff;text-wrap:balance;overflow-wrap:anywhere;text-shadow:0 2px 8px rgba(0,0,0,.35)}
.hero h1.dt span{opacity:.7;font-weight:600;margin:0 4px}
.vs{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:start}
.vs .x{align-self:center}
.vs .nm{white-space:normal;overflow:visible;text-overflow:clip;text-wrap:balance;overflow-wrap:anywhere;line-height:1.1}
.vs .s{white-space:normal;line-height:1.3;overflow-wrap:anywhere}
.hero .in>p{text-wrap:balance}

main>*{flex-shrink:0}

.sb .tm em.red{font-style:normal;font-size:11px;font-weight:700;color:#ff8a80}
.mcard.pen{border-color:var(--m-goal);background:#1d2a14}
.mcard.pen h3{color:var(--m-goal)}
.it.pk{width:100%;color:#e8f0f7;padding:10px}
.it.pk b{color:var(--m-goal)}
.it.pk{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--m-line);background:#0b1825;font-size:14px;text-align:left;min-width:0}
.it.pk span:nth-child(2){flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it.pk:active{border-color:var(--m-goal)}

/* estrelas: cheias = nível atual, douradas vazadas = espaço até o potencial, apagadas = além do potencial */
.stars2{display:inline-flex;gap:1px;font-size:13px;line-height:1;vertical-align:-1px}
.stars2 i{font-style:normal}
.stars2 .sf{color:var(--gold)}
.stars2 .se{color:var(--gold)}
.stars2 .sn{color:var(--line)}
/* campinho da partida */
.field.mf{max-width:420px;margin-inline:auto}
.mslot{cursor:pointer;touch-action:manipulation}
.mslot.sel i{box-shadow:0 0 0 3px #ffc24a,0 2px 6px rgba(0,0,0,.4)!important}
.mslot.sel{z-index:3}
#match .bb.mb{background:none;border:0;padding:0;color:#e8f0f7;cursor:pointer;touch-action:manipulation}
#match .bb.mb b{color:var(--m-mute)}
#match .bb.mb i{box-shadow:0 0 0 2px #0f1e2c,0 0 0 3px #3a5670}
#match .bb.mb.sel i{box-shadow:0 0 0 3px #35d07f}
/* classificação ao fim do jogo */
.mtbl{display:flex;flex-direction:column;font-size:13px;font-variant-numeric:tabular-nums}
.mtbl>div{display:grid;grid-template-columns:34px minmax(0,1fr) 30px 24px 30px 30px;gap:6px;align-items:center;padding:5px 2px;border-top:1px solid var(--m-line)}
.mtbl>div:first-child{border-top:0}
.mtbl>div.me{background:#173326;border-radius:8px}
.mtbl .tm{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtbl>div>span:nth-child(n+3),.mtbl b{text-align:right}
.mtbl .up{color:#35d07f}.mtbl .dn{color:#ff8a80}

.stat b{white-space:normal;overflow:visible;text-overflow:clip;font-size:clamp(17px,5vw,24px);overflow-wrap:anywhere}
.pr .mt .stars2{font-size:12px}

/* v5: seletores de competição e listas */
label select{display:block;width:100%;margin-top:6px}
.kv.me{background:var(--accent-soft);border-radius:8px;padding:4px 6px}
.fx .tiny{line-height:1.25}
#tlist{max-height:none}
.calr{display:grid;grid-template-columns:minmax(0,1.1fr) 46px minmax(0,1.4fr);gap:8px;align-items:center;padding:8px 2px;border-top:1px solid var(--line)}
.calr:first-of-type{border-top:0}
.calr .cd{display:flex;flex-direction:column;min-width:0}
.calr .cd b{font-size:13px}
.calr .cd small{font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.calr .ha{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;text-align:center;border-radius:6px;padding:2px 0;background:var(--surface2);color:var(--mute)}
.calr .ha.h{background:var(--accent-soft);color:var(--accent)}
.calr .op{display:flex;align-items:center;gap:6px;min-width:0;font-size:14px;font-weight:600}
.calr .op span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv>span:last-child,.kv>b:last-child{white-space:nowrap}
.mspot{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;border:2px dashed rgba(255,255,255,.75);background:rgba(255,255,255,.12);color:#fff;padding:0;display:grid;place-items:center;z-index:2;cursor:pointer}
.mspot span{font-size:8px;font-weight:700;letter-spacing:.02em}
#match .chipb.mchip{background:#0b1825;color:#e8f0f7;border-color:#3a5670}
#match .seg{margin-top:8px}
.mslot.pout i{opacity:.45}
.mslot.pout span{color:#35d07f}
.pendl{display:flex;flex-direction:column;gap:6px}
.pendl>div{display:flex;align-items:center;gap:8px;background:#0b1825;border:1px solid #1f3446;border-radius:10px;padding:6px 10px;font-size:13px}
.pendl>div span{flex:1;min-width:0}
.pendl .x{background:none;border:0;color:#8ea4b8;font-size:16px;padding:2px 6px}
#match .chipb.mchip.on{background:#35d07f;color:#07121c;border-color:#35d07f}
#mfield .mslot{touch-action:none}
#mfield .mslot.lift{z-index:6;transform:translate(-50%,-50%) scale(1.15)}
#mfield .mslot{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.qs-wrap{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.qs{width:100%;max-width:560px;max-height:75vh;overflow:auto;background:#0f1e2c;border-radius:18px 18px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;color:#e8f0f7}
.qs-h{display:flex;align-items:center;gap:10px}.qs-h>div{flex:1;display:flex;flex-direction:column}.qs-h small{color:#8ea4b8;font-size:12px}
.qs .x{background:#0b1825;border:1px solid #1f3446;color:#8ea4b8;border-radius:50%;width:32px;height:32px}
.qs em.rec{font-style:normal;font-size:11px;color:#35d07f;font-weight:700;margin-left:4px}
.presets{display:flex;flex-direction:column;gap:6px}
/* sem zoom de toque duplo; campos com 16px para o iPhone não ampliar ao focar */
html,body{touch-action:manipulation}
input,select,textarea{font-size:16px}
.tlink{cursor:pointer}
tr.tlink:active td{background:var(--accent-soft)}
/* balanço simplificado */
.card.balc{display:flex!important;flex-direction:row!important;justify-content:flex-start!important;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;padding:12px 14px}
.card.balc span:first-child{flex:1;color:var(--mute);font-size:.9rem}
.card.balc b{font-size:1.15rem}
.chev{color:var(--mute);font-size:1.3rem;line-height:1}
/* escudinho de cor nos outros jogos */
.tg{display:inline-block;font-style:normal;font-weight:800;font-size:.68rem;letter-spacing:.02em;padding:2px 5px;border-radius:4px;min-width:34px;text-align:center;vertical-align:middle}
/* sessão de leilão */
.card.aucs{display:flex!important;flex-direction:row!important;justify-content:flex-start!important;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;border-color:var(--accent)}
.aucs .grow{display:flex;flex-direction:column;flex:1;align-items:flex-start}
.aucs-ic{font-size:1.5rem}
.lot{border:1px solid var(--line);border-radius:12px;padding:6px 8px;margin:8px 0}
.lot.me{border-color:var(--win)}
.lot-r{align-items:center;gap:8px;margin-top:4px}
/* animação de pênalti */
.pa-wrap{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;animation:paIn .2s ease}
@keyframes paIn{from{opacity:0}to{opacity:1}}
.pa{width:min(320px,86vw);background:#fff;color:#14212b;border-radius:18px;padding:16px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.pa-team{margin:0 0 10px;font-weight:700;font-size:.9rem;color:#4a5a66}
.pa-goal{position:relative;height:150px;background:linear-gradient(#2f8f4e,#247a40);border-radius:10px;overflow:hidden}
.pa-goal .net{position:absolute;left:15%;right:15%;top:14px;height:70px;border:4px solid #fff;border-bottom:none;background:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 2px,transparent 2px 10px),repeating-linear-gradient(0deg,rgba(255,255,255,.18) 0 2px,transparent 2px 10px)}
.pa-goal .keeper{position:absolute;left:50%;top:30px;width:40px;height:56px;margin-left:-20px;transform-origin:50% 70%;transition:left .5s cubic-bezier(.25,.9,.4,1),transform .5s cubic-bezier(.25,.9,.4,1),top .5s}
.pa-goal .keeper svg{width:100%;height:100%;display:block;overflow:visible}
.pa:not(.go) .keeper{animation:paSway 1s ease-in-out infinite alternate}
@keyframes paSway{from{transform:translateX(-4px)}to{transform:translateX(4px)}}
.pa.go .keeper{left:var(--kl);top:var(--kt);transform:rotate(var(--kr))}
.pa-goal .ball{position:absolute;left:50%;top:120px;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff 55%,#cfd6db);box-shadow:0 2px 3px rgba(0,0,0,.35);transition:left .45s cubic-bezier(.2,.7,.3,1),top .45s cubic-bezier(.2,.7,.3,1),transform .45s}
.pa-goal .ball::after{content:'';position:absolute;inset:4px;border-radius:50%;background:#1d2a33;clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%)}
.pa:not(.go) .ball{animation:paBob .6s ease-in-out infinite alternate}
@keyframes paBob{to{transform:translateY(-3px)}}
.pa.go .ball{left:var(--bl);top:var(--bt);transform:scale(.72) rotate(540deg)}
.pa.end .ball{left:var(--bl2);top:var(--bt2);transition-duration:.55s}
.pa.end.g .net{animation:paNet .5s ease}
@keyframes paNet{40%{transform:scaleY(1.06) translateY(-2px)}}
.pa-goal .spot{position:absolute;left:50%;top:126px;width:6px;height:3px;margin-left:-3px;background:rgba(255,255,255,.8);border-radius:50%}
.pa-goal .area{position:absolute;left:6%;right:6%;top:84px;height:30px;border:2px solid rgba(255,255,255,.5);border-top:none}
.pa-goal .line{position:absolute;left:0;right:0;top:84px;height:2px;background:rgba(255,255,255,.7)}
.pa-txt{margin:12px 0 0;font-size:1.4rem;font-weight:900;min-height:1.7em}
.pa-txt.g{color:#12924a;font-size:2rem;animation:paPop .4s ease}
.pa-txt.d,.pa-txt.t,.pa-txt.f{color:#d0342c;font-size:1.7rem;animation:paPop .4s ease}
@keyframes paPop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
/* modo espectador */
.spm{padding:9px 4px;border-bottom:1px solid var(--m-line)}.spm:last-child{border-bottom:none}
.spr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.spr .h{display:flex;align-items:center;justify-content:flex-end;gap:6px;text-align:right;font-weight:700;font-size:.9rem}
.spr .a{display:flex;align-items:center;gap:6px;font-weight:700;font-size:.9rem}
.spr .sc{font-size:1.35rem;font-variant-numeric:tabular-nums;min-width:58px;text-align:center}
.spm.hot .sc{color:var(--m-acc);animation:paPop .4s ease}
.sps{margin:4px 0 0;text-align:center;font-size:.75rem;color:var(--m-mute)}
.mstat{margin:4px 0 0;font-size:1rem}
/* tabelas finais das séries */
.sumseg{margin:6px 0 8px}
.sumleg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.75rem;margin-bottom:6px}
.sumrows{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sumh,.sumr{display:grid;grid-template-columns:26px 1fr 34px 30px 36px;align-items:center;gap:4px;padding:5px 8px;font-size:.82rem}
.sumh{font-size:.7rem;color:var(--mute);font-weight:700;background:var(--surface2)}
.sumh span:nth-child(n+3),.sumr span:nth-child(n+3){text-align:right}
.sumr{border-top:1px solid var(--line)}
.sumr .tm{display:flex;align-items:center;gap:6px;min-width:0}.sumr .tm b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.sumr .tm i{font-style:normal;font-size:.7rem}
.sumr.zu{box-shadow:inset 3px 0 0 var(--win);background:color-mix(in srgb,var(--win) 8%,transparent)}
.sumr.zd{box-shadow:inset 3px 0 0 var(--loss);background:color-mix(in srgb,var(--loss) 8%,transparent)}
.sumr.me b{color:var(--accent)}
.sumgap{text-align:center;color:var(--mute);font-size:.8rem;border-top:1px solid var(--line)}
/* espaços de jogo salvo */
.svslot{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.svslot:first-of-type{border-top:none}
.slotn{width:24px;height:24px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;flex:none}
.svslot.empty .slotn{opacity:.5}
.svslot .grow p{margin:0}
/* filtros do mercado */
.mfil{display:flex;flex-direction:column;gap:8px;padding:12px 14px}
.mfr{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mfr>span{width:96px;font-size:.85rem;font-weight:700;color:var(--mute)}
.mfr input{width:74px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--surface);color:inherit}
.mfr i{font-style:normal;color:var(--mute);font-size:.85rem}
/* disputa de pênaltis */
.so{width:min(340px,90vw);background:#fff;color:#14212b;border-radius:18px;padding:14px;box-shadow:0 10px 40px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:10px}
.so .pa{width:auto;box-shadow:none;padding:0;background:transparent}
.so-h{margin:0;text-align:center;font-weight:900;letter-spacing:.1em;font-size:.8rem;color:#4a5a66}
.so-board{display:flex;flex-direction:column;gap:6px}
.so-row{display:flex;align-items:center;gap:8px}
.so-row b{margin-left:auto;font-size:1.3rem;font-variant-numeric:tabular-nums}
.so-dots{display:flex;gap:4px;flex-wrap:wrap}
.so-dots i{font-style:normal;width:18px;text-align:center;color:#b6c0c8;font-size:1rem}
.so-dots i.ok{color:#12924a}.so-dots i.no{color:#d0342c;font-weight:900}
.so-skip{align-self:center;background:#eef2f4!important;color:#14212b!important;border-color:#dbe2e6!important}
/* tela de campeão */
.ch-wrap{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--tc) 70%,#000) 0%,#05090d 75%);overflow:hidden;animation:paIn .35s ease}
.ch-conf{position:absolute;inset:0;pointer-events:none}
.ch-conf i{position:absolute;top:-20px;border-radius:2px;animation-name:chFall;animation-timing-function:linear;animation-iteration-count:infinite;opacity:.95}
@keyframes chFall{0%{transform:translateY(-20px) rotate(0)}100%{transform:translateY(110vh) rotate(720deg)}}
.ch{position:relative;width:min(380px,100%);max-height:100%;overflow:auto;background:rgba(10,18,26,.82);backdrop-filter:blur(6px);border:1px solid rgba(255,210,63,.45);border-radius:22px;padding:22px 18px 18px;color:#f3f6f8;text-align:center;display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.ch-rays{position:absolute;left:50%;top:70px;width:340px;height:340px;margin-left:-170px;margin-top:-170px;background:repeating-conic-gradient(rgba(255,210,63,.16) 0 10deg,transparent 10deg 20deg);border-radius:50%;animation:chSpin 14s linear infinite;pointer-events:none;mask:radial-gradient(circle,#000 30%,transparent 70%);-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%)}
@keyframes chSpin{to{transform:rotate(360deg)}}
.ch-cup{position:relative;font-size:78px;line-height:1;animation:chCup 1s cubic-bezier(.2,1.6,.4,1) both,chFloat 2.4s 1s ease-in-out infinite alternate;filter:drop-shadow(0 6px 18px rgba(255,200,40,.55))}
@keyframes chCup{from{transform:scale(0) rotate(-30deg)}to{transform:scale(1) rotate(0)}}
@keyframes chFloat{to{transform:translateY(-6px) rotate(3deg)}}
.ch-kicker{position:relative;margin:4px 0 0;font-size:.78rem;letter-spacing:.12em;font-weight:800;color:#ffd23f}
.ch-title{position:relative;margin:0;font-size:2.6rem;font-weight:900;letter-spacing:.04em;background:linear-gradient(180deg,#fff6c9,#ffd23f 55%,#e09b00);-webkit-background-clip:text;background-clip:text;color:transparent;animation:paPop .6s .3s both}
.ch-club{display:flex;align-items:center;justify-content:center;gap:8px;font-size:1.15rem}
.ch-rec{margin:0;font-size:.85rem;color:#a9b6c0}
.ch-box{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:10px 12px;text-align:left;animation:paIn .5s .6s both}
.ch-h{margin:0 0 6px;font-size:.7rem;font-weight:800;letter-spacing:.1em;color:#a9b6c0}
.ch-art{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.95rem}
.ch-art b{color:#ffd23f;white-space:nowrap}
.ch-art.sm{font-size:.82rem;color:#c9d3da;margin-top:4px}
.ch-team{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;color:#a9b6c0;margin-left:4px}
.ch-kv{display:flex;justify-content:space-between;gap:10px;font-size:.85rem;padding:3px 0}
.ch-kv b{white-space:nowrap}.ch-kv.up b{color:#3ddc84}
.ch .btn.pri{margin-top:4px}
/* gols do jogador */
.gbad{font-size:.78rem;font-weight:800;background:var(--surface2);border-radius:999px;padding:3px 8px;white-space:nowrap}
.gcard{border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.gtot{display:flex;align-items:baseline;gap:8px}.gtot span{font-size:1.2rem}.gtot b{font-size:1.8rem;line-height:1}.gtot small{color:var(--mute)}
.gcomp{display:flex;flex-wrap:wrap;gap:6px}.gcomp span{font-size:.78rem;background:var(--surface2);border-radius:999px;padding:3px 9px}
/* leilão ao vivo */
#auclive .al-wrap{position:fixed;inset:0;z-index:75;background:rgba(4,10,16,.82);display:flex;align-items:center;justify-content:center;padding:16px;animation:paIn .25s ease}
.al{width:min(380px,100%);max-height:100%;overflow:auto;background:var(--surface);color:var(--ink,inherit);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 16px 50px rgba(0,0,0,.5)}
.al-top{display:flex;justify-content:space-between;font-size:.75rem;font-weight:800;letter-spacing:.08em;color:var(--mute)}
.al-pl{display:flex;gap:12px;align-items:center}.al-pl .ovr{font-size:1.6rem;min-width:54px;height:54px;display:grid;place-items:center}
.al-nm{font-size:1.2rem}.al-pl p{margin:2px 0 0}
.al-bid{text-align:center;border:2px solid var(--line);border-radius:16px;padding:10px;transition:background .3s,border-color .3s}
.al-bid small{font-size:.7rem;font-weight:800;letter-spacing:.1em;color:var(--mute)}
.al-bid>b{display:block;font-size:2.1rem;line-height:1.15;font-variant-numeric:tabular-nums}
.al-bid.flash{border-color:#ffb020;background:color-mix(in srgb,#ffb020 14%,transparent);animation:paPop .35s ease}
.al-lead{display:flex;align-items:center;justify-content:center;gap:6px;font-size:.9rem}
.al-me{color:var(--win)}
.al-bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}.al-bar i{display:block;height:100%;background:linear-gradient(90deg,#e8452c,#ffb020,#2fbf71);transition:width .25s linear}
.al-msg{margin:0;text-align:center;font-weight:900;font-size:1.25rem;min-height:1.5em}
.al-msg.up{color:var(--win)}.al-msg.dn{color:var(--mute)}
.arank{width:26px;text-align:center;font-weight:800;color:var(--mute);flex:none}
.agoals{font-size:1.2rem;font-weight:900;min-width:34px;text-align:right}
.pr.me .nm{color:var(--accent)}
/* ================= MODO ELIFOOT ================= */
.craque{color:#d39a00;font-weight:800}.star{color:#d39a00;font-style:normal;font-weight:900}
.cmp{font-size:.85em}.cmp.c4,.cmp.c5{color:var(--loss);font-weight:700}.cmp.c0,.cmp.c1{color:var(--win)}
/* tela Equipe */
.el-pre{background:#0f5a2c;color:#fff;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.el-pre p{margin:0;opacity:.9}
.el-vs{display:flex;align-items:center;gap:8px;justify-content:center;font-weight:800}
.el-t{padding:4px 10px;border-radius:6px;font-weight:800;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.el-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.el-sum small{display:block;font-size:.7rem;color:var(--mute);font-weight:700}.el-sum b{font-size:1.15rem}
.el-g h3{display:flex;justify-content:space-between;align-items:baseline}
.er{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.er:first-of-type{border-top:none}
.er.on{background:color-mix(in srgb,var(--win) 9%,transparent);border-radius:8px}
.er.out{opacity:.55}
.er-ck{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:1.1rem;color:var(--win);flex:none;display:grid;place-items:center}
.er.on .er-ck{border-color:var(--win)}
.er-nm{flex:1;min-width:0;text-align:left;background:none;border:none;padding:0;font:inherit;color:inherit;display:flex;flex-direction:column}
.er-nm b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.er-nm small{color:var(--mute);font-size:.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.er-nm .fl{font-style:normal;font-size:.68rem;font-weight:800;color:var(--loss)}.er-nm .fl.sal{color:#b7791f}
.er-f{min-width:34px;text-align:center;font-weight:900;font-size:1.05rem;background:var(--surface2);border-radius:8px;padding:4px 0}
.er-f.t1{background:#ffe08a;color:#3a2a00}.er-f.t2{background:#d8f0dc}
/* tela de jogo verde */
#match .wrap.el{background:#0b5a2a;gap:8px;padding:10px 10px 20px}
.gtop{display:flex;align-items:center;gap:8px;background:#063d1c;border-radius:10px;padding:6px 10px;color:#fff}
.gtop b{font-size:1.3rem;font-variant-numeric:tabular-nums;color:#ffe14d}.gtop .gl{margin-left:auto;font-size:.75rem;opacity:.85;text-align:right}
.hg{display:inline-block;filter:hue-rotate(180deg) saturate(2)}.hg.run{animation:hgS 2s linear infinite}
@keyframes hgS{0%,40%{transform:rotate(0)}50%,90%{transform:rotate(180deg)}100%{transform:rotate(360deg)}}
.gt{display:inline-block;min-width:0;max-width:40%;flex:1;padding:3px 6px;border-radius:4px;font-weight:800;font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.gs{color:#ffe14d;font-variant-numeric:tabular-nums;width:20px;text-align:center;font-size:1rem;flex:none}
.gmine{display:flex;align-items:center;gap:6px;background:#06451f;border:2px solid #ffe14d;border-radius:12px;padding:10px 8px}
.gmine .gt{font-size:1rem;padding:6px 8px;text-align:center}.gs.big{font-size:2rem;width:34px}
.ginfo{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center;font-size:.75rem;color:#cfe9d6}
.gctl{display:flex;gap:6px;flex-wrap:wrap}.gctl .btn{background:#063d1c!important;border-color:#2a7a45!important;color:#e8f7ec!important}
.gctl .btn.pri{background:#ffe14d!important;color:#2a2400!important;border-color:#ffe14d!important}.gctl .btn.on{border-color:#ffe14d!important;color:#ffe14d!important}
.gev{background:#063d1c;border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;gap:2px;font-size:.8rem;color:#d9efe0}
.gev>div{display:grid;grid-template-columns:30px 20px 1fr;gap:4px}.gev .us{color:#fff;font-weight:700}.gev i{font-style:normal;opacity:.6;font-size:.7rem}
.gev .k-gol,.gev .k-pg{color:#ffe14d;font-weight:800}
.ggrid{display:flex;flex-direction:column;gap:8px}
.gsec{background:#0a4d24;border-radius:10px;padding:6px}
.gh{font-size:.7rem;font-weight:800;letter-spacing:.06em;color:#9fd3b0;text-transform:uppercase;padding:2px 4px 4px}
.gr{display:flex;align-items:center;gap:4px;padding:3px 2px;flex-wrap:wrap;border-radius:6px}
.gr.mine{outline:2px solid #ffe14d;cursor:pointer}.gr.hot{background:rgba(255,225,77,.18)}
.gr .ge{flex-basis:100%;font-size:.68rem;color:#bfe3cb;padding-left:4px}.gr .ge.k-vm{color:#ff8a80}
.gmore{background:#063d1c!important;color:#e8f7ec!important;border-color:#2a7a45!important}
.golo{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:70;text-align:center;pointer-events:none;animation:goloA 1.5s ease forwards}
.golo b{display:block;font-size:4.2rem;font-weight:900;letter-spacing:.06em;color:#ffe14d;text-shadow:0 4px 0 #6b5800,0 8px 24px rgba(0,0,0,.6)}
.golo.them b{color:#fff;text-shadow:0 4px 0 #333,0 8px 24px rgba(0,0,0,.6)}
.golo span{display:inline-block;margin-top:4px;background:rgba(0,0,0,.6);color:#fff;padding:4px 10px;border-radius:8px;font-weight:700}
@keyframes goloA{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}15%{transform:translate(-50%,-50%) scale(1.15);opacity:1}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
.sw{background:#f4f7f5;color:#14212b;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.sw-h{display:flex;flex-direction:column}.sw-h span{font-size:.75rem;color:#4a5a66}
.sw-c{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sw-t{margin:0 0 4px;font-size:.66rem;font-weight:800;color:#4a5a66}
.sw-p{display:flex;align-items:center;gap:5px;width:100%;padding:5px 6px;margin-bottom:4px;border:1px solid #d6dee3;border-radius:8px;background:#fff;font:inherit;font-size:.8rem;color:inherit;text-align:left}
.sw-p span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sw-p.sel{border-color:#e8452c;background:#fff1ee}
.sw-p:disabled{opacity:.45}
.sw .mtbl>div{color:#14212b}
.el-pre .btn:not(.pri){background:#063d1c;color:#fff;border-color:#2a7a45}
.gctl .btn.grow{flex:1 1 100%}
.gctl .btn.sm{flex:1}
.seg5 button{font-size:.68rem;padding:6px 1px;white-space:nowrap;min-width:0}
.gpost{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.gpost button{background:#063d1c;border:1px solid #2a7a45;color:#e8f7ec;border-radius:8px;padding:6px 2px;font:inherit;font-size:.7rem;font-weight:700}
.gpost button.on{background:#ffe14d;color:#2a2400;border-color:#ffe14d}

/* ================= TEMA ELIFOOT 98: fundo verde, visual limpo ================= */
:root,:root:not([data-theme="light"]),:root[data-theme="dark"]{
  --bg:#0c5a2b;--surface:#0a4c24;--surface2:#0f6532;--line:#2a7d47;--fg:#f3fbf5;--mute:#a9d6b6;
  --accent:#ffe14d;--accent-soft:rgba(255,225,77,.16);--accent-ink:#1f1a00;--gold:#ffe14d;
  --win:#7ee69a;--draw:#c9d6cd;--loss:#ff8a80;
  --pG:#d9a200;--pD:#3f7fe8;--pM:#21a35a;--pA:#e5483d;
  --shadow:none;--r:8px;
  --f-d:Verdana,Tahoma,"DejaVu Sans",Geneva,sans-serif;
  --f-b:Verdana,Tahoma,"DejaVu Sans",Geneva,sans-serif;
  color-scheme:dark}
html,body,#app{background:#0c5a2b}
body{font-size:14px;color:var(--fg)}
/* barra do clube */
.top{background:#073d1c;border-bottom:1px solid #2a7d47}
.top .club{font-family:var(--f-b);font-size:16px;font-weight:700;color:#fff}
.top .sub{color:var(--mute);font-size:11px}
.top .pill{background:#0c5a2b;color:#ffe14d;border:1px solid #2a7d47;font-weight:700}
main{padding:10px;gap:10px}
/* painéis */
.card{background:rgba(0,0,0,.16);border:1px solid rgba(255,255,255,.12);border-radius:8px;box-shadow:none;padding:10px;gap:8px}
.card h3,.card-h h3{font-family:var(--f-b);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#ffe14d}
h1,h2{font-family:var(--f-b)}
.mute,.hint{color:var(--mute)}
/* botões */
.btn{background:#0a4c24;color:#f3fbf5;border:1px solid #2a7d47;border-radius:6px;font-weight:700;min-height:38px;font-size:13px}
.btn.pri{background:#ffe14d;border-color:#ffe14d;color:#1f1a00}
.btn.big{font-family:var(--f-b);font-size:15px;border-radius:8px}
.btn.danger{color:#ff8a80;border-color:#7a3b35}
.btn:disabled{opacity:.45}
.btn.on{border-color:#ffe14d;color:#ffe14d}
.chipb{background:#0a4c24;color:#f3fbf5;border:1px solid #2a7d47;border-radius:6px;font-weight:700;font-size:12px}
.chipb.on{background:#ffe14d;border-color:#ffe14d;color:#1f1a00}
.seg{background:#073d1c;border:1px solid #2a7d47;border-radius:8px;padding:2px}
.seg button{color:#cfe9d6;border-radius:6px;font-weight:700}
.seg button.on{background:#ffe14d;color:#1f1a00;box-shadow:none}
/* campos */
input,select,textarea{background:#073d1c!important;color:#fff!important;border:1px solid #2a7d47!important;border-radius:6px!important}
input::placeholder{color:#7fb38f}
.search{background:#073d1c;border:1px solid #2a7d47;border-radius:6px}
.search input{border:0!important}
.search svg{stroke:#a9d6b6}
/* listas e tabelas */
.pr{border-color:rgba(255,255,255,.08)!important}
.pr .nm{color:#fff}.pr .mt{color:var(--mute)}
.stat{background:#073d1c;border:1px solid #2a7d47;border-radius:6px}
.stat small{color:var(--mute)}.stat b{color:#ffe14d}
.st-tag{background:#ffe14d;color:#1f1a00;border-radius:4px}
.pill{background:#073d1c;border-color:#2a7d47;color:#f3fbf5}
.kv{border-color:rgba(255,255,255,.08)!important}
.tbl th{background:transparent;color:#ffe14d;border-bottom:1px solid #2a7d47}
.tbl td{border-color:rgba(255,255,255,.07)!important}
.tbl tr.me td,.tbl tr.me td *{color:#ffe14d;font-weight:700}
.tbl tr.me td{background:rgba(255,225,77,.1)}
.ovr{background:transparent;border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:4px}
.ovr.t1{background:#ffe14d;color:#1f1a00;border-color:#ffe14d}.ovr.t2{background:rgba(255,225,77,.18);color:#ffe14d}
.pos{border-radius:3px}
.up{color:#7ee69a}.dn{color:#ff8a80}
.up b,.dn b{color:inherit}
/* menu inferior */
.nav{background:#073d1c;border-top:1px solid #2a7d47}
.nav button{color:#a9d6b6}
.nav button.on{color:#ffe14d}
.nav button.on::before{background:#ffe14d}
/* janela (sheet) */
.sheet{background:#0c5a2b!important;color:#f3fbf5;border:1px solid #2a7d47}
.sheet .hd{border-bottom:1px solid #2a7d47}
.sheet .hd h2{color:#ffe14d;font-size:16px}
.sheet .hd .x{background:#073d1c;color:#fff;border:1px solid #2a7d47}
.offer{background:rgba(0,0,0,.18);border:1px solid #2a7d47}
/* tela inicial */
.splash h1{font-family:var(--f-b);color:#fff}
.splash h1 em{color:#ffe14d}
.tp{background:rgba(0,0,0,.16);border:1px solid #2a7d47}
.tp .bar{background:#073d1c}.tp .bar i{background:#ffe14d}
.svslot{border-color:rgba(255,255,255,.1)}
.slotn{background:#073d1c;color:#ffe14d}
/* próximo jogo */
.hero{border:1px solid #2a7d47}
.card.balc,.card.aucs{background:rgba(0,0,0,.16)}
/* elenco estilo planilha */
.er{border-top:1px solid rgba(255,255,255,.08)!important}
.er.on{background:rgba(255,225,77,.1)!important}
.er.rs{background:rgba(120,190,255,.08)!important}
.er-nm b{color:#fff}.er-nm small{color:var(--mute)}
.er-ck{background:#073d1c;border:1px solid #2a7d47;color:#ffe14d}
.er.on .er-ck{border-color:#ffe14d}
.er-r{width:28px;height:28px;flex:none;font-weight:800;font-size:.75rem;background:#073d1c;color:#7fb38f;border:1px solid #2a7d47;border-radius:6px}
.er-r.on{background:#7ec8ff;color:#06263d;border-color:#7ec8ff}
.er-r:disabled{opacity:.25}
.er-f{background:transparent;border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:4px}
.er-f.t1{background:#ffe14d;color:#1f1a00}.er-f.t2{color:#ffe14d}
.el-sum>div{background:#073d1c;border:1px solid #2a7d47;border-radius:6px;padding:4px}
.el-sum small{color:var(--mute)}.el-sum b{color:#ffe14d}
.el-pre{background:#073d1c;border:1px solid #2a7d47}
.craque,.star{color:#ffe14d}
.cmp.c4,.cmp.c5{color:#ff8a80}.cmp.c0,.cmp.c1{color:#7ee69a}
/* substituições no jogo */
.sw{background:#073d1c;color:#f3fbf5;border:1px solid #2a7d47}
.sw-h span,.sw-t{color:var(--mute)}
.sw-p{background:#0a4c24;border:1px solid #2a7d47;color:#fff}
.sw-p.sel{border-color:#ffe14d;background:rgba(255,225,77,.15)}
.sw-p .pos{flex:none!important;min-width:22px;text-align:center}.sw-c>div{min-width:0}
.sw .mtbl>div{color:#f3fbf5}
.sw .mtbl>div.me{background:#ffe14d!important;border-radius:4px}
.sw .mtbl>div.me,.sw .mtbl>div.me *{color:#1f1a00!important;font-weight:800}
/* outros */
.toast{background:#073d1c!important;color:#fff!important;border:1px solid #ffe14d!important}
.warn{color:#ffb4a8}
.gcard,.pstat>div{background:#073d1c;border:1px solid #2a7d47}
.lot{border-color:#2a7d47}
.al{background:#0c5a2b;color:#f3fbf5;border:1px solid #2a7d47}
.al-bid{border-color:#2a7d47}.al-bid>b{color:#ffe14d}
.gbad{background:#073d1c;color:#ffe14d}
.sumrows{border-color:#2a7d47}.sumh{background:#073d1c;color:#ffe14d}
.sumr{border-color:rgba(255,255,255,.08)}
.arank{color:#ffe14d}
.calr{border-color:rgba(255,255,255,.08)!important}
/* elenco compacto (planilha) */
.ec-pre{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:#073d1c;border:1px solid #2a7d47;border-radius:8px;padding:6px}
.ec-pre .gt{max-width:32%;font-size:.78rem}.ec-pre .btn{min-height:30px;padding:4px 10px;margin-left:auto}.ec-pre .btn+.btn{margin-left:0}
.ec-top{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.78rem;color:var(--mute);padding:0 2px}
.ec-top b{color:#ffe14d}
.ec-forms{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:0 2px}
.ec-forms::-webkit-scrollbar{display:none}
.ec-forms button{flex:none;background:#0a4c24;border:1px solid #2a7d47;color:#e9f7ee;border-radius:5px;padding:4px 7px;font:inherit;font-size:.72rem;font-weight:700}
.ec-forms button.on{background:#ffe14d;color:#1f1a00;border-color:#ffe14d}
.ec-list{border:1px solid #2a7d47;border-radius:6px;overflow:hidden;background:rgba(0,0,0,.12)}
.ec{display:grid;grid-template-columns:22px 22px 18px 1fr 22px 22px 18px 26px;align-items:center;gap:3px;padding:1px 4px;font-size:.78rem;line-height:1.1;min-height:25px;border-top:1px solid rgba(255,255,255,.06)}
.ec.t{background:rgba(255,225,77,.11)}.ec.r{background:rgba(126,200,255,.08)}.ec.out{opacity:.5}
.ec-h{font-size:.66rem;font-weight:800;color:#ffe14d;min-height:18px;background:#073d1c;border-top:0}
.ec-g{font-size:.62rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#a9d6b6;background:#073d1c;padding:1px 6px;border-top:1px solid #2a7d47}
.ec-b{width:20px;height:20px;padding:0;border:1px solid #2a7d47;border-radius:4px;background:#073d1c;color:#ffe14d;font-size:.7rem;font-weight:900;line-height:1}
.ec-b.on{border-color:#ffe14d}.ec-b.rb.on{background:#7ec8ff;color:#06263d;border-color:#7ec8ff}.ec-b:disabled{opacity:.2}
.ec-p{font-size:.6rem!important;padding:1px 0!important;text-align:center;border-radius:3px}
.ec-n{min-width:0;background:none;border:0;padding:0;font:inherit;color:#fff;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ec-n .star{margin-left:1px}
.ec-x{font-style:normal;font-size:.6rem;font-weight:800;color:#ff8a80;margin-left:3px}.ec-x.y{color:#ffe14d}
.ec-a,.ec-gl{text-align:center;color:#cfe9d6}.ec-gl{color:#ffe14d}
.ec-c{text-align:center;font-size:.66rem;color:#a9d6b6}.ec-c.c4,.ec-c.c5{color:#ff8a80}.ec-c.c0,.ec-c.c1{color:#7ee69a}
.ec-f{text-align:center;font-weight:800;color:#fff}.ec-f.t1{color:#1f1a00;background:#ffe14d;border-radius:3px}.ec-f.t2{color:#ffe14d}
.ec .ec-p{width:18px;min-width:0!important;max-width:18px;padding:0!important;display:block;line-height:16px;overflow:hidden}
.ec-f.evu{background:#2f7de1!important;color:#fff!important;border-radius:3px}
.ec-f.evd{background:#d23b30!important;color:#fff!important;border-radius:3px}
.big-ovr.evu{background:#2f7de1!important;color:#fff!important}.big-ovr.evd{background:#d23b30!important;color:#fff!important}
.sti{font-style:normal;font-size:.72rem;margin-left:3px;white-space:nowrap}.sti small{font-size:.6rem;font-weight:800;color:#fff;margin-left:1px}
.gmine{cursor:pointer}.gev-tip{margin:-4px 0 0;text-align:center;font-size:.68rem;color:#9fd3b0}.gev-x{margin:4px 0 0;text-align:center;font-size:.66rem;color:#9fd3b0}.gev{max-height:42vh;overflow:auto;cursor:pointer}
#match .wrap.el>*{flex-shrink:0}
.favb{flex:none;width:30px;height:30px;margin-left:4px;border:1px solid #2a7d47;border-radius:6px;background:#073d1c;color:#a9d6b6;font-size:1rem;line-height:1;padding:0}
.favb.on{color:#ff6b81;border-color:#ff6b81}
/* placar fixo no topo enquanto rola os outros jogos */
#match .wrap.el{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.gfix{position:sticky;top:-10px;z-index:6;background:#0b5a2a;margin:-10px -10px 0;padding:10px 10px 6px;display:flex;flex-direction:column;gap:6px;box-shadow:0 6px 10px -6px rgba(0,0,0,.5)}
.gtop,.gmine{cursor:pointer;touch-action:manipulation}.gtop .gl i{font-style:normal;font-size:.62rem;color:#ffe14d;opacity:.9}
.gbody{display:flex;flex-direction:column;gap:8px}.gbody:empty{display:none}
.ggrid .gr{contain:content}.gsec.gmy{outline:1px solid #ffe14d55}
.gctl .btn.sm{padding:6px 8px}
#auclive .al-bar{display:none}
/* cada linha de jogo tem altura fixa: o lance embaixo do placar já fica reservado */
#match .wrap.el{overflow-anchor:none}
.ggrid .gr .ge{display:block;min-height:1.05em;line-height:1.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.golo{animation:goloB 2.8s ease forwards}
@keyframes goloB{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}10%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}18%{transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
.gr.mine .ge{color:#fff;font-weight:700}.gr .ge i{font-style:normal;opacity:.6;font-size:.62rem}
.gr .ge.k-am{color:#ffe14d}
/* aviso de gol embaixo do time que marcou (sem travar o jogo) */
.gmine .gside{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.gmine .gside .gt{width:100%}
.gnote{min-height:1.1em;font-size:.72rem;font-weight:800;text-align:center;color:#ffe14d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0}
.gnote.on{opacity:1;animation:gnA 2.6s ease forwards}
@keyframes gnA{0%{transform:scale(.6);opacity:0}8%{transform:scale(1.15);opacity:1}16%{transform:scale(1)}85%{opacity:1}100%{opacity:0}}
/* substituições e pênalti abrem por cima, sem precisar rolar */
.gpan:empty{display:none}
.gpan{position:fixed;left:0;right:0;bottom:0;z-index:40;margin:0 auto;max-width:560px;max-height:68vh;overflow:auto;overscroll-behavior:contain;background:#0a4c24;border-top:3px solid #ffe14d;border-radius:16px 16px 0 0;padding:8px 8px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(0,0,0,.55)}
.gpan>.sw{margin:0;border:0;background:none;padding:0}
.gpan .sw-h{position:sticky;top:-8px;background:#0a4c24;z-index:1;padding:6px 2px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.gpan .gpan-go{order:3;margin-left:auto}
.gmine .gside .gt{max-width:none;flex:none}

</style>

/* ==================== POTENCIAL, VALOR E CONTRATOS ==================== */
function initPot(p){
  const g=p.a<=19?ri(6,14):p.a<=21?ri(4,11):p.a<=23?ri(2,7):p.a<=26?ri(0,3):0;
  p.pot=clamp(p.o+g,p.o,93);p.o0=p.o;p.h=[p.o];
}
function migrate(p){if(LEGACY[p.p])p.p=LEGACY[p.p];if(p.p2&&!RN[p.p2])p.p2='';if(p.pot==null)initPot(p);if(p.o0==null)p.o0=p.o;if(!p.h)p.h=[p.o]}
/* VK: preço de transferência (valores de mercado baixados à metade); salário segue a escala anterior */
const VK=.5;
function value(p){
  /* jovem vale um pouco mais pelo potencial, mas quem ainda é fraco continua barato */
  const e=p.a<=23?p.o+Math.min(Math.max(0,(p.pot||p.o)-p.o)*(p.a<=21?.25:.2),6):p.o;
  /* abaixo de 64 o valor cai mais rápido: jogador de Série D vale centenas de milhares, não milhões */
  let v=Math.pow(1.17,e-55)*(e<64?Math.pow(1.12,e-64):1);
  if(p.a<=21)v*=1.35;else if(p.a<=24)v*=1.15;else if(p.a>=34)v*=.35;else if(p.a>=31)v*=.65;
  if(p.o<54)v*=.6;
  if(isStar(p))v*=1.4;
  return Math.max(.01,v*VK);
}
/* salário MENSAL (R$ milhões) */
/* salário pela força atual (não pelo potencial): garoto promissor ainda ganha como garoto */
const wageVal=p=>{const o=p.o;let v=Math.pow(1.17,o-55)*(o<64?Math.pow(1.12,o-64):1);if(p.a>=34)v*=.5;else if(p.a>=31)v*=.75;return v};
const baseWage=p=>wageVal(p)*.0055*MO+.012;
const wage=p=>p.w??baseWage(p);
const starLv=v=>v>=85?5:v>=79?4:v>=73?3:v>=67?2:1;
const potStars=p=>{const c=starLv(p.o),t=Math.max(c,starLv(p.pot));return '★'.repeat(c)+'☆'.repeat(t-c)};

function teamAvg(tid){const s=(SQ.get(tid)||[]).map(p=>p.o).sort((a,b)=>b-a).slice(0,14);return s.length?s.reduce((a,b)=>a+b,0)/s.length:55}

function compMeta(id){

  if(id==='NE')return{n:'Copa do Nordeste',s:'Copa do Nordeste',k:'reg'};
  if(id==='SSE')return{n:'Copa Sul-Sudeste',s:'Copa Sul-Sudeste',k:'reg'};

}

const divLabel=d=>d==='E'?'Distrital':d==='X'?'Exterior':'Série '+d;

/* ==================== TABELA DE JOGOS (BERGER) ==================== */
/* todos alternam casa e fora; no returno ninguém faz 3 jogos seguidos no mesmo mando */
function bergerRounds(ids,legs){
  const arr=shuffle(ids.slice());if(arr.length%2)arr.push(null);
  const n=arr.length;const rounds=[];
  for(let r=0;r<n-1;r++){
    const m=[r%2?[arr[n-1],arr[r]]:[arr[r],arr[n-1]]];
    for(let k=1;k<n/2;k++){const a=arr[(r+k)%(n-1)],b=arr[(r-k+n-1)%(n-1)];m.push(k%2?[a,b]:[b,a])}
    rounds.push(m.filter(([h,a])=>h!==null&&a!==null));
  }
  if(legs<2)return rounds;
  return rounds.concat([...rounds.slice(1),rounds[0]].map(m=>m.map(([h,w])=>[w,h])));
}
const blankRow=()=>({P:0,J:0,V:0,E:0,D:0,GP:0,GC:0});
const rrRounds=(n,legs)=>(n%2?n:n-1)*legs;
const sortRows=(rows)=>rows.sort((x,y)=>y.P-x.P||y.V-x.V||(y.GP-y.GC)-(x.GP-x.GC)||y.GP-x.GP||(S.teams[y.id]?.rep||0)-(S.teams[x.id]?.rep||0));
function groupTable(g){return sortRows(g.ids.map(id=>({id,...g.tb[id]})))}
const KONAME={2:'Final',4:'Semifinal',8:'Quartas de final',16:'Oitavas de final'};

/* ==================== MONTAGEM DAS COMPETIÇÕES ==================== */
/* cada competição tem fases (stages); cada fase tem um número fixo de datas no calendário */
function snakeGroups(ids,g){const s=ids.slice().sort((a,b)=>S.teams[b].rep-S.teams[a].rep);const out=Array.from({length:g},()=>[]);s.forEach((id,i)=>{const r=Math.floor(i/g);out[r%2?g-1-(i%g):i%g].push(id)});return out}
function koSpec(size,legsFn,draw,from){const rounds=[];let n=size,ph=1;while(n>=2){rounds.push({n:KONAME[n]||(ph+'ª fase'),legs:legsFn(n)});n/=2;ph++}return{t:'ko',from,rounds,draw,nd:rounds.reduce((s,r)=>s+r.legs,0)}}
function rrSpec(groups,legs){return{t:'rr',groups,legs,nd:Math.max(...groups.map(g=>rrRounds(g.length,legs)))}}
/* Copa do Brasil no formato 2026: 1ª fase só com os de pior ranking; os demais entram aos poucos;
   Série A entra na 5ª fase. Fases 1–4 em jogo único, com potes por ranking (forte x fraco);
   da 5ª fase à semifinal, ida e volta; final em jogo único, campo neutro. */
const cbRankV=id=>({A:4,B:3,C:2,D:1}[S.teams[id].div]||0)*100+S.teams[id].rep;
function cbSpec(P){
  let ids=P.CB.slice().sort((a,b)=>cbRankV(b)-cbRankV(a));
  const A=ids.filter(id=>S.teams[id].div==='A');let rest=ids.filter(id=>S.teams[id].div!=='A');
  /* 5ª fase = 32 clubes: os 20 da Série A + 12 que vêm da 4ª fase (24 = 22 da 3ª + 2 que entram) */
  let p1=2*(ids.length-124)+28;if(p1<0)p1=0;if(p1%2)p1--;
  const e4=rest.slice(0,2),e2=rest.slice(2,rest.length-p1),f1=rest.slice(rest.length-p1);
  const R=[{n:'1ª fase',legs:1,pots:1},{n:'2ª fase',legs:1,pots:1},{n:'3ª fase',legs:1,pots:1},{n:'4ª fase',legs:1,pots:1},{n:'5ª fase',legs:2},{n:'Oitavas de final',legs:2},{n:'Quartas de final',legs:2},{n:'Semifinal',legs:2},{n:'Final',legs:1,neutral:1}];
  if(!f1.length)R.shift();
  const ent={};const off=f1.length?0:-1;ent[1+off]=e2;ent[3+off]=e4;ent[4+off]=A;
  return{t:'ko',rounds:R,draw:'pots',teams:f1.length?f1:e2,entries:f1.length?ent:{[2+off]:e4,[3+off]:A},nd:R.reduce((s,r)=>s+r.legs,0)};
}
function makeComp(id,stages){const m=compMeta(id);return{id,n:m.n,s:m.s,kind:m.k,stages,si:-1,st:null,done:[],k:0,dates:[],champ:null,fin:false}}
function buildComps(P){
  const C={};
  C.A=makeComp('A',[rrSpec([P.A],2)]);
  C.B=makeComp('B',[rrSpec([P.B],2)]);
  C.C=makeComp('C',[rrSpec([P.C],1),{t:'rr',from:{k:'top',n:8,gs:4},legs:2,nd:6},koSpec(2,()=>2,'seed',{k:'grp',size:2})]);
  C.D=D20F&&P.D.length<=24?makeComp('D',[rrSpec([P.D],2)]):makeComp('D',[rrSpec(P.Dg,2),koSpec(32,()=>2,'seed',{k:'grp',size:32})]);
  if(C.D.stages[1])C.D.stages[1].rounds[0].n='Segunda fase';
  C.CB=makeComp('CB',[cbSpec(P)]);
  const lib=g=>[rrSpec(g,2),koSpec(16,n=>n>2?2:1,'seed',{k:'grp',size:16})];
  C.LIB=makeComp('LIB',lib(P.LIBg));C.SUD=makeComp('SUD',lib(P.SUDg));
  if(!NOREG)for(const r of ['NE','SSE','VER'])C[r]=makeComp(r,[rrSpec(P[r+'g'],1),koSpec(8,n=>n>2?1:2,'seed',{k:'grp',size:8})]);
  if(NOEST)for(const u in {}){}else for(const u in P.ST){const ids=P.ST[u];if(ids.length<4)continue;const g=ids.length>12?snakeGroups(ids,2):[ids];C['E-'+u]=makeComp('E-'+u,[rrSpec(g,1),koSpec(4,n=>n>2?1:2,'seed',{k:'grp',size:4})])}
  for(const u in P.EX){const ids=P.EX[u];C['X-'+u]=makeComp('X-'+u,[rrSpec([ids],ids.length<=20?2:1)])}
  return C;
}
const compND=c=>c.stages.reduce((s,x)=>s+x.nd,0);

/* ==================== CALENDÁRIO ==================== */
/* jan–abr: estaduais (domingos) e copas regionais/Copa do Brasil inicial (quartas);
   mai–dez: ligas (36+ datas) intercaladas com Libertadores/Sul-Americana e Copa do Brasil */
const MESF=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DOW=['dom','seg','ter','qua','qui','sex','sáb'],MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function mergeProp(a,na,b,nb){const out=[];let i=0,j=0;while(i<na||j<nb){if(j>=nb||(i<na&&(i+1)/na<=(j+1)/nb))out.push(a),i++;else out.push(b),j++}return out}
function buildCalendar(year,C){
  const cbR=C.CB.stages[0].rounds;const fi=cbR.findIndex(r=>r.legs===2);const cb1=fi<0?cbR.length:fi,cb2=cbR.slice(cb1).reduce((s,r)=>s+r.legs,0);
  const contND=Math.max(C.LIB?compND(C.LIB):0,C.SUD?compND(C.SUD):0);
  const mb=mergeProp('C',contND,'Y',cb2);
  const lanes=[];
  /* sem estaduais: o campeonato começa em janeiro, nos domingos que eram dos estaduais */
  if(NOEST){for(let i=0;i<16;i++)lanes.push('L','MA');mergeProp('L',22,'MB',mb.length).forEach(x=>lanes.push(x))}
  else{for(let i=0;i<16;i++)lanes.push('EA','MA');mergeProp('L',38,'MB',mb.length).forEach(x=>lanes.push(x))}
  let dt=new Date(Date.UTC(year,0,11));while(dt.getUTCDay()!==0)dt=new Date(+dt+864e5);
  const cal=lanes.map((ln,i)=>{const o={ln,y:dt.getUTCFullYear(),m:dt.getUTCMonth(),dd:dt.getUTCDate(),w:dt.getUTCDay()};dt=new Date(+dt+(o.w===0?3:4)*864e5);return o});
  const idx=ln=>cal.map((c,i)=>c.ln===ln?i:-1).filter(i=>i>=0);
  const EA=idx('EA'),MA=idx('MA'),L=idx('L'),MBi=idx('MB');
  const mbC=MBi.filter((_,k)=>mb[k]==='C'),mbY=MBi.filter((_,k)=>mb[k]==='Y');
  for(const c of Object.values(C)){
    const nd=compND(c);
    if(c.kind==='est')c.dates=EA.slice(0,nd);
    else if(c.kind==='reg')c.dates=MA.slice(0,nd);
    else if(c.kind==='liga'||c.kind==='ext')c.dates=L.slice(0,nd);
    else if(c.kind==='cont')c.dates=mbC.slice(0,nd);
    else if(c.id==='CB'){const a=[];let mi=16-2*cb1+1;if(mi<9)mi=9;for(let r=0;r<cb1;r++){a.push(MA[Math.min(mi,MA.length-1)]);mi+=2}c.dates=a.concat(mbY.slice(0,cb2))}
    if(c.dates.length<nd)console.warn('calendário curto',c.id,c.dates.length,nd);
  }
  return cal;
}
const dLabel=(c,long)=>c?`${DOW[c.w]} ${c.dd} ${MES[c.m]}${long?' '+c.y:''}`:'';

/* ==================== FASES: INÍCIO, JOGOS, RESULTADOS ==================== */
function startStage(c){
  c.si++;const sp=c.stages[c.si];if(!sp){c.fin=true;return}
  if(c.si===0)c.all=sp.groups?sp.groups.flat():sp.teams.concat(...Object.values(sp.entries||{}));
  if(sp.t==='rr'){
    let groups=sp.groups;
    if(!groups){const prev=c.st;const top=groupTable(prev.groups[0]).slice(0,sp.from.n).map(r=>r.id);const g=sp.from.n/sp.from.gs;groups=Array.from({length:g},()=>[]);top.forEach((id,i)=>{const r=Math.floor(i/g);groups[r%2?g-1-(i%g):i%g].push(id)})}
    c.st={t:'rr',legs:sp.legs,nd:sp.nd,j:0,groups:groups.map(ids=>({ids:ids.slice(),sch:bergerRounds(ids,sp.legs),tb:Object.fromEntries(ids.map(id=>[id,blankRow()]))}))};
  }else{
    let pool;

  const order=t=>{const on=m.on[t].filter(x=>P(x[1]));const c=on.map(([r,id])=>({id,r,c:penChance(m,t,P(id),r)})).sort((a,b)=>(a.r==='GOL')-(b.r==='GOL')||b.c-a.c);return c.length?c:[{id:null,r:'CA',c:.7}]};

    const k=ok?'gol':(()=>{const y=R();return y<.55?'def':y<.72?'trave':'fora'})();if(ok)sc[t]++;seq.push({t,id:x.id,n:x.id?P(x.id).n:'Cobrador',k})};

    kick(m.a);if(sc[m.h]>sc[m.a]+(4-r)||sc[m.a]>sc[m.h]+(4-r))break;

/* R$ milhões: entry = cota de participação; q = passar da fase de grupos; adv[i] = vencer a fase i do mata-mata; champ = título */
const PRZ={
